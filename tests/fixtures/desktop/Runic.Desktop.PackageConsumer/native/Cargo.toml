# The application's own Rust static library in the package-consumer test (eng/native/verify-native-server-package.mjs),
# built the way an application such as Artificer's Storyline builds its one: fat LTO and unwinding panics. A NativeAOT
# publish that links it beside Runic's librunic_server.a fails on two copies of Rust's standard library (#859); with
# the runic-server feature it links the crate itself and re-exports its C ABI
# (RunicDesktopNativeServerLinkage=Application).
#
# The test copies this directory, points the path dependency at the checkout's native/runic-server and seeds the
# lock from native/Cargo.lock, so the crate's dependencies resolve to the versions the SDK ships.
[workspace]

[package]
name = "consumer_native"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
runic-server = { path = "../../../../../native/runic-server", optional = true }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
