<section>
  <h2>Counter View</h2>
  <p class="caption">{{ state()?.label ?? "…" }}</p>
  <p class="count">{{ state()?.count ?? "…" }}</p>
  <label>
    Step
    <select [disabled]="!counter.client()" (change)="step.inputText($event)" (blur)="step.commit()">
      @for (value of steps; track value) { <option [value]="value" [selected]="value === step.value()">{{ value }}</option> }
    </select>
  </label>
  <label>
    Label
    <input [value]="label.text()" [disabled]="!counter.client()" (input)="label.inputText($event)"
      (compositionstart)="label.compositionStart()" (compositionend)="label.compositionEnd($event)" (blur)="label.commit()">
  </label>
  <!-- Increment waits until the Step it adds has been written. -->
  <button [disabled]="!counter.client() || increment.pending() || step.editing()" (click)="increment.run()">Increment</button>
  @if (error(); as issue) { <p role="alert">{{ issue }}</p> }
</section>
