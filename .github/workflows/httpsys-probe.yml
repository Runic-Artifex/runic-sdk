# Temporary: http.sys URL reservation isolation probe for the CS-WebUI blob endpoint. Not for merging.
name: http.sys isolation probe
on:
  push:
    branches: [v017/httpsys-prefix-check]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe
        if: runner.environment == 'github-hosted'
        shell: pwsh
        run: eng/ci/httpsys-isolation/probe.ps1
      - name: Remove the probe's users
        if: always() && runner.environment == 'github-hosted'
        shell: pwsh
        run: eng/ci/httpsys-isolation/cleanup.ps1
