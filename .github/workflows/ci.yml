          # The GTK runner has one lifetime per process; the entry-point check runs separately.
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory dbus-run-session -- xvfb-run -a dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --event-loop
          # SIGTERM closes the GTK window and disposes the host before the GTK loop ends.
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory dbus-run-session -- xvfb-run -a dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --signal
          # SEC-04: DesktopWebContentPolicy with real clicks through XTEST.
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory dbus-run-session -- xvfb-run -a dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --web-content
          # DesktopWindow.AnnounceAsync reaches AT-SPI as Object:Announcement with GTK 3 and GTK 4 (#318).
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory dbus-run-session -- xvfb-run -a dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --announcement gtk3
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory dbus-run-session -- xvfb-run -a dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --announcement gtk4
          # Right-to-left (W315-019): an Arabic process locale reaches the page's navigator.language, GTK 4's own
          # direction is right to left without a translation, and the application can override it.
          sudo locale-gen ar_EG.UTF-8
          LC_ALL=ar_EG.UTF-8 LANG=ar_EG.UTF-8 LANGUAGE=ar GDK_BACKEND=x11 GSETTINGS_BACKEND=memory dbus-run-session -- xvfb-run -a dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --rtl
          # Controlled-portal journey: directory and SaveFile requests through the production provider.
          # A private runtime directory lets the isolated bus activate its own document portal, when
          # installed, for the document-view save; otherwise that variant reports a skip with its reason.
          journey_runtime=$(mktemp -d) && mkdir "$journey_runtime/data"
          XDG_RUNTIME_DIR="$journey_runtime" XDG_DATA_HOME="$journey_runtime/data" GDK_BACKEND=x11 GSETTINGS_BACKEND=memory dbus-run-session -- xvfb-run -a dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --directory
          # Without a display the entry point must fall back instead of letting gtk_init exit the process.
          env -u DISPLAY -u WAYLAND_DISPLAY GDK_BACKEND=x11 GSETTINGS_BACKEND=memory dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --no-display
      - name: Verify GTK4 and portal NativeAOT consumers
        if: runner.os == 'Linux'
        run: |
