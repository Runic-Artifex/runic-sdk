name: SDK CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CONFIGURATION: Release
  NUGET_PACKAGES: ${{ github.workspace }}/.cache/nuget
jobs:
  # Pull requests run the jobs whose inputs changed (eng/ci/plan.mjs); pushes and
  # manual runs plan everything. Planned skips still report, and `verify` accepts a
  # skipped job only when this plan skipped it.
  plan:
    name: Plan affected jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      managed: ${{ steps.plan.outputs.managed }}
      web: ${{ steps.plan.outputs.web }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request merge commit and its base parent.
          fetch-depth: 2
      - uses: ./.github/actions/setup-sdk
        with:
          dotnet: "false"
          install: "false"
      # A pull_request checkout is GitHub's merge commit; its first parent is the
      # base branch, so the diff is exactly what the pull request changes. The base
      # branch's planner and component map decide what is affected, so a pull request
      # cannot narrow its own plan; this checkout then enumerates the suites.
      - name: Plan jobs from the changed files
        id: plan
        # shell: bash adds pipefail, so a failed git diff cannot become an empty change list.
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] && git rev-parse --verify --quiet HEAD^2 > /dev/null \
            && git worktree add --detach "$RUNNER_TEMP/base" HEAD^1 \
            && affected=$(git diff --name-only --no-renames -z HEAD^1 HEAD | bun "$RUNNER_TEMP/base/eng/ci/plan.mjs" --affected); then
            bun eng/ci/plan.mjs --plan "$affected" >> "$GITHUB_OUTPUT"
          else
            bun eng/ci/plan.mjs >> "$GITHUB_OUTPUT"
          fi
  build:
    name: Build shared SDK inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - name: Restore managed dependencies
        run: dotnet restore RunicSdk.Core.slnx --locked-mode
      - name: Build managed SDK, tools and test executables
        run: bun eng/run.mjs build-core
      - name: Build web packages
        run: bun eng/run.mjs build-web
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
      - name: Archive reusable Linux build outputs
        run: bun eng/ci/build-artifact.mjs create
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-build-${{ github.run_id }}
          path: artifacts/ci-build
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  managed:
    name: Managed / ${{ matrix.suite }}
    needs: [plan, build]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'managed') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.managed) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - uses: ./.github/actions/restore-build
      - name: Run managed conformance suite
        run: bun eng/ci/test-managed.mjs "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  web:
    name: Web / ${{ matrix.package }}
    needs: [plan, build]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'web') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.web) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Web package tests do not run managed code.
      - uses: ./.github/actions/setup-sdk
        with:
          nuget: none
          node: ${{ matrix.node && 'true' || 'false' }}
      - uses: ./.github/actions/restore-build
        with:
          nuget: "false"
      - uses: ./.github/actions/install-browser
        if: matrix.package == 'vite-plugin-runic'
      - name: Run package tests
        working-directory: packages/web/${{ matrix.package }}
        run: bun run --bun test
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  engineering:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: ./.github/actions/restore-build
      - name: Verify workspace, runtime and CI contracts
        run: bun test --timeout 180000 ./eng/*.test.mjs ./eng/ci/*.test.mjs ./eng/release/*.test.mjs ./eng/reliability/*.test.mjs ./tests/engineering/*.test.mjs
      - name: Check embedded CLI compatibility metadata and README support table
        run: bun tools/dotnet-runic/metadata/generate.mjs --check
      - name: Check generated packing project inventory
        run: bun eng/generate-shipping-projects.mjs --check
      # The flake provides the same actionlint version for local runs.
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  framework-consumers:
    needs: [plan, build]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'framework-consumers') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Svelte checks and npm consumers do not run managed code.
      - uses: ./.github/actions/setup-sdk
        with:
          nuget: none
          node: "true"
      - uses: ./.github/actions/restore-build
        with:
          nuget: "false"
      - name: Check Svelte integration types
        working-directory: packages/web/svelte
        run: bun run --bun check
      - name: Check SvelteKit integration types
        working-directory: packages/web/sveltekit
        run: bun run --bun check
      - name: Exercise isolated npm framework consumers
        run: bun tests/web/svelte-package-consumers/package-consumers.mjs
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  views:
    name: Window and View journeys
    needs: [plan, build]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'views') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: ./.github/actions/restore-build
      - uses: ./.github/actions/install-browser
      - name: Exercise first Window generated client
        run: node examples/first-window/browser-smoke.mjs
      - name: Exercise Runic Desktop Views host and ReactiveUI client
        run: |
          node examples/first-window-desktop/browser-smoke.mjs
          xvfb-run -a dotnet run --project examples/first-window-desktop/FirstWindowDesktop.csproj -c Release --no-build -- --probe-owner
      - name: Check composed View lifetime and window scopes
        run: |
          dotnet run --no-build -c Release --project examples/notes-view-first/NotesViewFirst.csproj -- --check-view-lifetime
          dotnet run --no-build -c Release --project examples/notes-view-first/NotesViewFirst.csproj -- --check-view-lifetime --splat
          node examples/notes-view-first/window-smoke.mjs
      - name: Run the Notes example unit tests
        run: |
          dotnet test examples/notes-view-first/Tests/NotesViewFirst.Tests.csproj -c Release --no-build
          (cd examples/notes-view-first/Frontend && bun install --frozen-lockfile && bun run test)
      - name: Exercise CommunityToolkit and ReactiveUI typed clients
        run: |
          node examples/notes-view-first/browser-smoke.mjs
          RUNIC_VERIFY_CALL_BURST=1 node examples/notes-reactive-views/browser-smoke.mjs
          RUNIC_VERIFY_PENDING_MOUNT=1 node examples/notes-reactive-views/browser-smoke.mjs
          RUNIC_VERIFY_CLIENT_DISCONNECT=1 node examples/notes-reactive-views/browser-smoke.mjs
      - name: Exercise the Effect adapter Notes variant
        run: |
          (cd examples/notes-view-first/Effect && bun run --bun build)
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Effect/dist" node examples/notes-view-first/browser-smoke.mjs
      - name: Exercise the React and Vue Notes editor variants
        run: |
          (cd examples/notes-view-first/React && bun run --bun build)
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/React/dist" node examples/notes-view-first/browser-smoke.mjs
          (cd examples/notes-view-first/Vue && bun run --bun build)
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Vue/dist" node examples/notes-view-first/browser-smoke.mjs
      - name: Exercise Svelte and Angular View outlets
        run: |
          (cd examples/notes-view-first/Svelte && bun install --frozen-lockfile && bun run build)
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Svelte/dist" node examples/notes-view-first/browser-smoke.mjs
          npm --prefix examples/notes-view-first/Angular ci
          npm --prefix examples/notes-view-first/Angular run build
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Angular/dist/angular-composed/browser" node examples/notes-view-first/browser-smoke.mjs
          (cd examples/notes-reactive-views/Svelte && bun install --frozen-lockfile && bun run build)
          RUNIC_WEB_ROOT="$PWD/examples/notes-reactive-views/Svelte/dist" node examples/notes-reactive-views/browser-smoke.mjs
          npm --prefix examples/notes-reactive-views/Angular ci
          npm --prefix examples/notes-reactive-views/Angular run build
          RUNIC_WEB_ROOT="$PWD/examples/notes-reactive-views/Angular/dist/angular-reactive/browser" node examples/notes-reactive-views/browser-smoke.mjs
      - name: Exercise View development reload and IDE host
        run: |
          RUNIC_HMR_FRONTEND=svelte RUNIC_HMR_VIA_RUNIC_DEV=1 node examples/notes-reactive-views/hmr-smoke.mjs
          dotnet build examples/notes-reactive-views/NotesReactiveViews.csproj -c Debug
          node examples/notes-reactive-views/ide-host-smoke.mjs
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  packages:
    name: Materialize package candidates
    needs: [plan, build]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'packages') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - uses: ./.github/actions/restore-build
      - name: Pack the verified build inputs
        run: bun eng/run.mjs pack-built
      - name: Verify shipped template lock integrity
        run: bun eng/release/verify-template-locks.mjs
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  package-consumers:
    needs: [plan, packages]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'package-consumers') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
      - uses: ./.github/actions/install-browser
      - name: Verify isolated NuGet and npm consumers
        run: bun run verify-packages
      - name: Verify packaged Angular View outlet
        run: |
          version=$(bun -p 'JSON.parse(require("node:fs").readFileSync("eng/workspace.json", "utf8")).version')
          bun tests/web/angular-package-consumer/test-package-consumer.mjs "artifacts/packages/npm/runic-artifex-angular-$version.tgz"
      - name: Verify packaged Window factory, generated client, and browser
        run: |
          bun run --cwd packages/web/views --bun build
          node examples/first-window/package-smoke.mjs
          node examples/first-window-desktop/package-smoke.mjs
      - name: Verify the packaged navigation consumer with JIT and NativeAOT
        run: bun tests/fixtures/application/navigation-consumer/package-smoke.mjs
      - name: Verify standalone Runic.Navigation without Runic.Application, Node or a host
        run: bun tests/fixtures/navigation/standalone-consumer/package-smoke.mjs
      - name: Verify the ReactiveUI navigation adapters pull in no Runic.Application
        run: bun tests/fixtures/navigation/reactiveui-consumer/package-smoke.mjs
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  wpf:
    name: WPF navigation
    needs: [plan, packages]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'wpf') }}
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          nuget: wpf
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
      # STA hosts, dialogs and dispatcher contexts need a real Windows desktop session.
      - name: Test the WPF navigation hosts
        run: dotnet run --project tests/dotnet/Runic.Navigation.Wpf.Tests -c Release
      - name: Verify the packed WPF consumer pulls in only Runic.Navigation
        run: bun tests/fixtures/navigation/wpf-consumer/package-smoke.mjs
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  templates:
    name: Templates / ${{ matrix.framework }}
    needs: [plan, packages]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'templates') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        framework: [react, vue, svelte, angular]
        # The guided creator check is framework-independent; run it once.
        # The vue lane owns the desktop-gtk4 variant and runs it under Xvfb.
        include:
          - framework: react
            creator: "1"
          - framework: vue
            desktop-smoke: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
      - name: Install the GTK 4 Desktop template runtime
        if: matrix.desktop-smoke == '1'
        run: eng/ci/apt-install.sh libwebkitgtk-6.0-4 xvfb dbus-x11 at-spi2-core
      - name: Permit the WebKit sandbox on Ubuntu
        if: matrix.desktop-smoke == '1'
        run: eng/ci/permit-webkit-sandbox.sh
      - name: Verify generated template applications
        run: bun run verify:templates
        env:
          RUNIC_TEMPLATE_FRAMEWORKS: ${{ matrix.framework }}
          RUNIC_TEMPLATE_CREATOR: ${{ matrix.creator || '0' }}
          RUNIC_TEMPLATE_DESKTOP_SMOKE: ${{ matrix.desktop-smoke || '0' }}
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  native:
    name: Native / ${{ matrix.rid }}
    needs: plan
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'native') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            provider: Linux
            extension: ""
          - os: windows-latest
            rid: win-x64
            provider: Windows
            extension: .exe
            # Cold Chromium and Node timers stall on Windows runners (#70).
            smoke-timeout-scale: "2"
          - os: macos-26
            rid: osx-arm64
            provider: MacOS
            extension: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      RUNIC_SMOKE_TIMEOUT_SCALE: ${{ matrix.smoke-timeout-scale || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          nuget: native
          node: "true"
      - uses: ./.github/actions/install-browser
      # Generated Views clients import the workspace runtime from its build output.
      - name: Build the shared Views runtime
        working-directory: packages/web/views
        run: bun run --bun build
      - name: Build managed desktop contracts
        run: dotnet build tests/dotnet/Runic.Desktop.Tests -c Release
      - name: Test managed desktop contracts
        timeout-minutes: 5
        run: >-
          dotnet test tests/dotnet/Runic.Desktop.Tests -c Release --no-build
          --settings eng/ci/desktop.runsettings --diag artifacts/native-tests/vstest.log
          --logger "console;verbosity=normal" --logger "trx;LogFileName=desktop.trx"
          --results-directory artifacts/native-tests
          --blame-hang-timeout 2m --blame-hang-dump-type none
      - name: Retain desktop contract diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-tests-${{ matrix.rid }}-${{ github.run_id }}
          path: artifacts/native-tests
          if-no-files-found: ignore
          overwrite: true
      - name: Install Linux native WebView prerequisites
        if: runner.os == 'Linux'
        run: eng/ci/apt-install.sh libwebkit2gtk-4.1-0 libwebkitgtk-6.0-4 xvfb dbus-x11 at-spi2-core
      - name: Permit the WebKit sandbox on Ubuntu
        if: runner.os == 'Linux'
        run: eng/ci/permit-webkit-sandbox.sh
      - name: Build native window smoke
        run: dotnet build tests/native/Runic.Desktop.WebViewSmoke -c Release
      - name: Exercise native window close interception on Linux
        if: runner.os == 'Linux'
        run: GDK_BACKEND=x11 xvfb-run -a dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll
      - name: Exercise the Desktop event-loop entry point on Linux
        if: runner.os == 'Linux'
        run: GDK_BACKEND=x11 xvfb-run -a dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll --event-loop
      - name: Exercise direct portal protocol
        if: runner.os == 'Linux'
        run: dbus-run-session -- dotnet run --project tests/dotnet/Runic.Platform.Linux.Portal.Tests -c Release -- --dbus
      - name: Exercise GTK4 native window and platform services
        if: runner.os == 'Linux'
        run: |
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory dbus-run-session -- xvfb-run -a dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release
          # The GTK runner has one lifetime per process; the entry-point check runs separately.
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory dbus-run-session -- xvfb-run -a dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --event-loop
          # Without a display the entry point must fall back instead of letting gtk_init exit the process.
          env -u DISPLAY -u WAYLAND_DISPLAY GDK_BACKEND=x11 GSETTINGS_BACKEND=memory dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --no-display
      - name: Verify GTK4 and portal NativeAOT consumers
        if: runner.os == 'Linux'
        run: |
          dotnet publish tests/native/Runic.Desktop.Gtk4.Smoke -c Release -r linux-x64 --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/gtk4-aot
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory dbus-run-session -- xvfb-run -a artifacts/gtk4-aot/Runic.Desktop.Gtk4.Smoke
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory dbus-run-session -- xvfb-run -a artifacts/gtk4-aot/Runic.Desktop.Gtk4.Smoke --event-loop
          env -u DISPLAY -u WAYLAND_DISPLAY GDK_BACKEND=x11 GSETTINGS_BACKEND=memory artifacts/gtk4-aot/Runic.Desktop.Gtk4.Smoke --no-display
          dotnet publish tests/dotnet/Runic.Platform.Linux.Portal.Tests -c Release -r linux-x64 --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/portal-aot
          dbus-run-session -- artifacts/portal-aot/Runic.Platform.Linux.Portal.Tests --dbus
      - name: Exercise native window close interception on Windows and macOS
        if: runner.os != 'Linux'
        run: dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll
      - name: Exercise the Desktop event-loop entry point on Windows and macOS
        if: runner.os != 'Linux'
        run: dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll --event-loop
      - name: Verify Windows administration native inspection
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: dotnet run --project tests/dotnet/Runic.Platform.Administration.Windows.Tests -c Release -p:RunicApplicationBuildMode=Verification
      - name: Publish Windows administration inspection with NativeAOT
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: dotnet publish tests/dotnet/Runic.Platform.Administration.Windows.Tests -c Release -r win-x64 --self-contained true -p:PublishAot=true -p:RunicApplicationBuildMode=Verification -p:IlcTreatWarningsAsErrors=true -o artifacts/administration-aot
      - name: Verify NativeAOT Windows administration inspection
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: ./artifacts/administration-aot/Runic.Platform.Administration.Windows.Tests.exe
      - name: Build native clipboard conformance
        run: dotnet build tests/dotnet/Runic.Platform.${{ matrix.provider }}.Tests -c Release -p:TreatWarningsAsErrors=true
      - name: Verify native GTK clipboard
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: GDK_BACKEND=x11 xvfb-run -a dotnet tests/dotnet/Runic.Platform.Linux.Tests/bin/Release/net10.0/Runic.Platform.Linux.Tests.dll --native
      - name: Verify native clipboard
        if: runner.os != 'Linux'
        timeout-minutes: 3
        run: dotnet tests/dotnet/Runic.Platform.${{ matrix.provider }}.Tests/bin/Release/net10.0/Runic.Platform.${{ matrix.provider }}.Tests.dll --native
      - name: Publish native clipboard conformance with NativeAOT
        timeout-minutes: 10
        run: dotnet publish tests/dotnet/Runic.Platform.${{ matrix.provider }}.Tests -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -p:TrimmerSingleWarn=false -o artifacts/clipboard-aot
      - name: Verify Windows system-sleep inhibition with JIT and NativeAOT
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: bash
        run: |
          dotnet tests/dotnet/Runic.Platform.Windows.Tests/bin/Release/net10.0/Runic.Platform.Windows.Tests.dll --native-inhibition --system-only
          ./artifacts/clipboard-aot/Runic.Platform.Windows.Tests.exe --native-inhibition --system-only
      - name: Verify Windows settings read with JIT and NativeAOT
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: bash
        run: |
          dotnet tests/dotnet/Runic.Platform.Windows.Tests/bin/Release/net10.0/Runic.Platform.Windows.Tests.dll --native-settings
          ./artifacts/clipboard-aot/Runic.Platform.Windows.Tests.exe --native-settings
      - name: Verify NativeAOT GTK clipboard
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: GDK_BACKEND=x11 xvfb-run -a artifacts/clipboard-aot/Runic.Platform.Linux.Tests --native
      - name: Verify NativeAOT clipboard
        if: runner.os != 'Linux'
        timeout-minutes: 3
        shell: bash
        run: ./artifacts/clipboard-aot/Runic.Platform.${{ matrix.provider }}.Tests${{ matrix.extension }} --native
      - name: Publish and run platform runtime conformance with NativeAOT
        timeout-minutes: 10
        shell: bash
        run: |
          dotnet publish tests/dotnet/Runic.Platform.Runtime.Tests/Runic.Platform.Runtime.Tests.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/platform-runtime-aot
          ./artifacts/platform-runtime-aot/Runic.Platform.Runtime.Tests${{ matrix.extension }}
      - name: Prepare signed macOS sandbox fixture for manual permission evidence
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts/platform-sandbox/RunicPlatform.app/Contents/MacOS
          cp tests/native/platform-sandbox/Info.plist artifacts/platform-sandbox/RunicPlatform.app/Contents/Info.plist
          ditto artifacts/platform-runtime-aot artifacts/platform-sandbox/RunicPlatform.app/Contents/MacOS
          codesign --force --deep --sign - --entitlements tests/native/platform-sandbox/entitlements.plist artifacts/platform-sandbox/RunicPlatform.app
          codesign --verify --deep --strict artifacts/platform-sandbox/RunicPlatform.app
          tar -czf artifacts/platform-sandbox-${{ matrix.rid }}.tar.gz -C artifacts/platform-sandbox RunicPlatform.app
      - name: Retain macOS sandbox permission fixture
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-sandbox-${{ matrix.rid }}-${{ github.run_id }}
          path: artifacts/platform-sandbox-${{ matrix.rid }}.tar.gz
          if-no-files-found: error
      - name: Publish and exercise WebView2 with NativeAOT
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet publish tests/native/Runic.Desktop.WebViewSmoke -c Release -r win-x64 --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -p:TrimmerSingleWarn=false -o artifacts/webview-aot
          test ! -e artifacts/webview-aot/WebView2Loader.dll
          mkdir artifacts/webview-exe-only
          cp artifacts/webview-aot/Runic.Desktop.WebViewSmoke.exe artifacts/webview-exe-only/
          (cd artifacts/webview-exe-only && ./Runic.Desktop.WebViewSmoke.exe)
      - name: Publish Window and View application with NativeAOT
        shell: bash
        run: |
          dotnet publish examples/first-window/FirstWindow.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/views-aot
          dotnet publish tests/fixtures/application/cswebui-window-probes/CsWebUiWindowProbes.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/views-probes-aot
          if [[ "$RUNNER_OS" == Linux ]]; then
            GDK_BACKEND=x11 xvfb-run -a ./artifacts/views-probes-aot/CsWebUiWindowProbes${{ matrix.extension }} --probe-factory-failure
            GDK_BACKEND=x11 xvfb-run -a ./artifacts/views-probes-aot/CsWebUiWindowProbes${{ matrix.extension }} --probe-window-close
            GDK_BACKEND=x11 xvfb-run -a ./artifacts/views-probes-aot/CsWebUiWindowProbes${{ matrix.extension }} --probe-missing-bridge
            GDK_BACKEND=x11 RUNIC_FIRST_WINDOW_EXECUTABLE="$(node -p 'require("node:path").resolve("artifacts/views-aot/FirstWindow${{ matrix.extension }}")')" xvfb-run -a node examples/first-window/browser-smoke.mjs
          else
            ./artifacts/views-probes-aot/CsWebUiWindowProbes${{ matrix.extension }} --probe-factory-failure
            ./artifacts/views-probes-aot/CsWebUiWindowProbes${{ matrix.extension }} --probe-window-close
            ./artifacts/views-probes-aot/CsWebUiWindowProbes${{ matrix.extension }} --probe-missing-bridge
            RUNIC_FIRST_WINDOW_EXECUTABLE="$(node -p 'require("node:path").resolve("artifacts/views-aot/FirstWindow${{ matrix.extension }}")')" node examples/first-window/browser-smoke.mjs
          fi
      - name: Verify Windows View IDE launch and framework reload
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 10
        run: |
          npm --prefix examples/notes-reactive-views/Angular ci
          (cd examples/notes-reactive-views/Svelte && bun install --frozen-lockfile)
          dotnet build examples/notes-reactive-views/NotesReactiveViews.csproj -c Debug
          node examples/notes-reactive-views/ide-host-smoke.mjs
          RUNIC_HMR_FRONTEND=angular RUNIC_HMR_VIA_IDE=1 node examples/notes-reactive-views/hmr-smoke.mjs

  verify:
    name: verify
    if: always()
    needs: [plan, build, managed, web, engineering, framework-consumers, views, packages, package-consumers, wpf, templates, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: eng/ci/gate.mjs
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Require every planned verification job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIP: ${{ needs.plan.outputs.skip }}
        run: bun eng/ci/gate.mjs
