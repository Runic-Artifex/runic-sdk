name: SDK CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CONFIGURATION: Release
  NUGET_PACKAGES: ${{ github.workspace }}/.cache/nuget
jobs:
  # Pull requests run the jobs whose inputs changed (eng/ci/plan.mjs); pushes and
  # manual runs plan everything. Planned skips still report, and `verify` accepts a
  # skipped job only when this plan skipped it.
  plan:
    name: Plan affected jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      managed: ${{ steps.plan.outputs.managed }}
      web: ${{ steps.plan.outputs.web }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request merge commit and its base parent.
          fetch-depth: 2
      - uses: ./.github/actions/setup-sdk
        with:
          dotnet: "false"
          install: "false"
      # A pull_request checkout is GitHub's merge commit; its first parent is the
      # base branch, so the diff is exactly what the pull request changes. The base
      # branch's planner and component map decide what is affected, so a pull request
      # cannot narrow its own plan; this checkout then enumerates the suites.
      - name: Plan jobs from the changed files
        id: plan
        # shell: bash adds pipefail, so a failed git diff cannot become an empty change list.
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] && git rev-parse --verify --quiet HEAD^2 > /dev/null \
            && git worktree add --detach "$RUNNER_TEMP/base" HEAD^1 \
            && affected=$(git diff --name-only --no-renames -z HEAD^1 HEAD | bun "$RUNNER_TEMP/base/eng/ci/plan.mjs" --affected); then
            bun eng/ci/plan.mjs --plan "$affected" >> "$GITHUB_OUTPUT"
          else
            bun eng/ci/plan.mjs >> "$GITHUB_OUTPUT"
          fi
  build:
    name: Build shared SDK inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - name: Restore managed dependencies
        run: dotnet restore RunicSdk.Core.slnx --locked-mode
      - name: Build managed SDK, tools and test executables
        run: bun eng/run.mjs build-core
      - name: Build web packages
        run: bun eng/run.mjs build-web
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
      - name: Archive reusable Linux build outputs
        run: bun eng/ci/build-artifact.mjs create
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-build-${{ github.run_id }}
          path: artifacts/ci-build
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  managed:
    name: Managed / ${{ matrix.suite }}
    needs: [plan, build]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'managed') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.managed) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - uses: ./.github/actions/restore-build
      - name: Run managed conformance suite
        run: bun eng/ci/test-managed.mjs "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}
      # TRX reports and Cobertura coverage of the TUnit suites (CONTRIBUTING.md). The TRX extension
      # also copies the HTML and Cobertura reports into a _<machine>_<time> attachments folder.
      - name: Retain managed test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-test-results-${{ matrix.suite }}-${{ github.run_id }}
          path: |
            artifacts/test-results
            !artifacts/test-results/*/_*
          if-no-files-found: ignore
          overwrite: true
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  web:
    name: Web / ${{ matrix.package }}
    needs: [plan, build]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'web') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.web) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Web package tests do not run managed code.
      - uses: ./.github/actions/setup-sdk
        with:
          nuget: none
          node: ${{ matrix.node && 'true' || 'false' }}
      - uses: ./.github/actions/restore-build
        with:
          nuget: "false"
      - uses: ./.github/actions/install-browser
        if: matrix.package == 'vite-plugin-runic'
      - name: Run package tests
        working-directory: packages/web/${{ matrix.package }}
        run: bun run --bun test
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  engineering:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: ./.github/actions/restore-build
      - name: Verify workspace, runtime and CI contracts
        run: bun test --timeout 180000 ./eng/*.test.mjs ./eng/ci/*.test.mjs ./eng/release/*.test.mjs ./eng/reliability/*.test.mjs ./tests/engineering/*.test.mjs
      - name: Check embedded CLI compatibility metadata and README support table
        run: bun tools/dotnet-runic/metadata/generate.mjs --check
      - name: Check generated packing project inventory
        run: bun eng/generate-shipping-projects.mjs --check
      # The flake provides the same actionlint version for local runs.
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  framework-consumers:
    needs: [plan, build]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'framework-consumers') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Svelte checks and npm consumers do not run managed code.
      - uses: ./.github/actions/setup-sdk
        with:
          nuget: none
          node: "true"
      - uses: ./.github/actions/restore-build
        with:
          nuget: "false"
      - name: Check Svelte integration types
        working-directory: packages/web/svelte
        run: bun run --bun check
      - name: Check SvelteKit integration types
        working-directory: packages/web/sveltekit
        run: bun run --bun check
      - name: Exercise isolated npm framework consumers
        run: bun tests/web/svelte-package-consumers/package-consumers.mjs
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  views:
    name: Window and View journeys
    needs: [plan, build]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'views') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: ./.github/actions/restore-build
      - uses: ./.github/actions/install-browser
      - name: Exercise first Window generated client
        run: |
          node examples/first-window/browser-smoke.mjs
          node examples/first-window/navigation-smoke.mjs
      - name: Exercise Runic Desktop Views host and ReactiveUI client
        run: |
          node examples/first-window-desktop/browser-smoke.mjs
          xvfb-run -a dotnet run --project examples/first-window-desktop/FirstWindowDesktop.csproj -c Release --no-build -- --probe-owner
      - name: Check composed View lifetime and window scopes
        run: |
          dotnet run --no-build -c Release --project examples/notes-view-first/NotesViewFirst.csproj -- --check-view-lifetime
          dotnet run --no-build -c Release --project examples/notes-view-first/NotesViewFirst.csproj -- --check-view-lifetime --splat
          node examples/notes-view-first/window-smoke.mjs
      - name: Run the Notes and multi-window example unit tests
        run: |
          dotnet run --project examples/notes-view-first/Tests -c Release --no-build
          dotnet run --project examples/multi-window/Tests -c Release --no-build
          (cd examples/notes-view-first/Frontend && bun install --frozen-lockfile && bun run test)
      - name: Exercise CommunityToolkit and ReactiveUI typed clients
        run: |
          node examples/notes-view-first/browser-smoke.mjs
          RUNIC_VERIFY_CALL_BURST=1 node examples/notes-reactive-views/browser-smoke.mjs
          RUNIC_VERIFY_PENDING_MOUNT=1 node examples/notes-reactive-views/browser-smoke.mjs
          RUNIC_VERIFY_CLIENT_DISCONNECT=1 node examples/notes-reactive-views/browser-smoke.mjs
      - name: Exercise the Effect adapter Notes variant
        run: |
          (cd examples/notes-view-first/Effect && bun run --bun build)
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Effect/dist" node examples/notes-view-first/browser-smoke.mjs
      - name: Exercise the React and Vue Notes editor variants
        run: |
          (cd examples/notes-view-first/React && bun run --bun build)
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/React/dist" node examples/notes-view-first/browser-smoke.mjs
          (cd examples/notes-view-first/Vue && bun run --bun build)
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Vue/dist" node examples/notes-view-first/browser-smoke.mjs
      - name: Exercise Svelte and Angular View outlets
        run: |
          (cd examples/notes-view-first/Svelte && bun install --frozen-lockfile && bun run build)
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Svelte/dist" node examples/notes-view-first/browser-smoke.mjs
          npm --prefix examples/notes-view-first/Angular ci
          npm --prefix examples/notes-view-first/Angular run build
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Angular/dist/angular-composed/browser" node examples/notes-view-first/browser-smoke.mjs
          (cd examples/notes-reactive-views/Svelte && bun install --frozen-lockfile && bun run build)
          RUNIC_WEB_ROOT="$PWD/examples/notes-reactive-views/Svelte/dist" node examples/notes-reactive-views/browser-smoke.mjs
          npm --prefix examples/notes-reactive-views/Angular ci
          npm --prefix examples/notes-reactive-views/Angular run build
          RUNIC_WEB_ROOT="$PWD/examples/notes-reactive-views/Angular/dist/angular-reactive/browser" node examples/notes-reactive-views/browser-smoke.mjs
      - name: Exercise View development reload and IDE host
        run: |
          RUNIC_HMR_FRONTEND=svelte RUNIC_HMR_VIA_RUNIC_DEV=1 node examples/notes-reactive-views/hmr-smoke.mjs
          dotnet build examples/notes-reactive-views/NotesReactiveViews.csproj -c Debug
          node examples/notes-reactive-views/ide-host-smoke.mjs
          node examples/notes-reactive-views/dotnet-hot-reload-smoke.mjs
          RUNIC_HOT_RELOAD_SCENARIO=getter node examples/notes-reactive-views/dotnet-hot-reload-smoke.mjs
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  packages:
    name: Materialize package candidates
    needs: [plan, build]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'packages') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - uses: ./.github/actions/restore-build
      - name: Pack the verified build inputs
        run: bun eng/run.mjs pack-built
      - name: Verify shipped template lock integrity
        run: bun eng/release/verify-template-locks.mjs
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  package-consumers:
    needs: [plan, packages]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'package-consumers') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
      - uses: ./.github/actions/install-browser
      - name: Verify isolated NuGet and npm consumers
        run: bun run verify-packages
      - name: Verify packaged Angular View outlet
        run: |
          version=$(bun -p 'JSON.parse(require("node:fs").readFileSync("eng/workspace.json", "utf8")).version')
          bun tests/web/angular-package-consumer/test-package-consumer.mjs "artifacts/packages/npm/runic-artifex-angular-$version.tgz"
      - name: Verify packaged Window factory, generated client, and browser
        run: |
          bun run --cwd packages/web/views --bun build
          node examples/first-window/package-smoke.mjs
          node examples/first-window-desktop/package-smoke.mjs
      - name: Verify the packaged navigation consumer with JIT and NativeAOT
        run: bun tests/fixtures/application/navigation-consumer/package-smoke.mjs
      - name: Verify packaged operation controls, selection and accepted-work shutdown
        run: bun tests/fixtures/application/operations-consumer/package-smoke.mjs
      - name: Verify WPF Bridge generation, single-project and split, from the packed packages
        run: bun tests/fixtures/application/wpf-bridge-consumer/package-smoke.mjs
      - name: Verify standalone Runic.Navigation without Runic.Application.Views, Node or a host
        run: bun tests/fixtures/navigation/standalone-consumer/package-smoke.mjs
      - name: Verify the ReactiveUI navigation adapters pull in no Runic.Application.Views
        run: bun tests/fixtures/navigation/reactiveui-consumer/package-smoke.mjs
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  wpf:
    name: WPF navigation / ${{ matrix.rid }}
    needs: [plan, packages]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'wpf') }}
    # Both run the WPF hosts. Bridge generation and the packed consumers do not
    # depend on the architecture, so only win-x64 runs them.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          nuget: wpf
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
      # STA hosts, dialogs and dispatcher contexts need a real Windows desktop session.
      - name: Test the WPF navigation hosts
        run: dotnet run --project tests/dotnet/Runic.Navigation.Wpf.Tests -c Release
      - name: Test the WPF embedded Runic View host
        run: dotnet run --project tests/dotnet/Runic.Application.Views.Wpf.Windows.Tests -c Release
      - name: Test the hybrid WPF editor migration example
        run: |
          bun run --cwd packages/web/views --bun build
          dotnet run --project examples/wpf-hybrid-editor/WindowsSmoke/HybridNotes.WindowsSmoke.csproj -c Release
      # #269 and #270 were reported on Windows: generate beside WPF stand-ins and
      # ASP.NET Core types, and from the packed packages, there too.
      - name: Test Bridge generation beside WPF and ASP.NET Core types
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          dotnet run --project tests/dotnet/Runic.Application.Testing.Tests -c Release -- --treenode-filter "/*/*/CodegenDiagnosticsTests/*Framework*"
          dotnet run --project tests/dotnet/Runic.Application.Testing.Tests -c Release --no-build -- --treenode-filter "/*/*/BridgeAttributeNamesTests/*"
      # A generator that stalls past the cases' timeout is dumped there (#348).
      - name: Retain dumps of stalled Bridge generators
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codegen-timeouts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/codegen-timeouts
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify WPF Bridge generation, single-project and split, from the packed packages
        if: matrix.rid == 'win-x64'
        run: bun tests/fixtures/application/wpf-bridge-consumer/package-smoke.mjs
      - name: Verify the packed WPF consumer pulls in only Runic.Navigation
        if: matrix.rid == 'win-x64'
        run: bun tests/fixtures/navigation/wpf-consumer/package-smoke.mjs
      # W240-007: the reference app and its scenario tests, built from the packed packages only.
      - name: Test the WPF navigation example from the packed packages
        if: matrix.rid == 'win-x64'
        run: bun examples/wpf-navigation/package-smoke.mjs
      # W250-037: the ReactiveUI variant of the same app, built from source with the ReactiveUI adapter.
      - name: Test the ReactiveUI WPF navigation example
        if: matrix.rid == 'win-x64'
        run: dotnet run --project examples/wpf-navigation/Tests.ReactiveUI -c Release
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  templates:
    name: Templates / ${{ matrix.framework }}
    needs: [plan, packages]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'templates') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        framework: [react, vue, svelte, angular]
        # The guided creator check is framework-independent; run it once.
        # The vue lane owns the desktop-gtk4 variant and opens it and the default
        # Runic Desktop project under Xvfb.
        include:
          - framework: react
            creator: "1"
          - framework: vue
            desktop-smoke: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
      - name: Install the Desktop template runtimes
        if: matrix.desktop-smoke == '1'
        run: eng/ci/apt-install.sh libwebkit2gtk-4.1-0 libwebkitgtk-6.0-4 xvfb dbus-x11 at-spi2-core
      - name: Permit the WebKit sandbox on Ubuntu
        if: matrix.desktop-smoke == '1'
        run: eng/ci/permit-webkit-sandbox.sh
      - name: Verify generated template applications
        run: bun run verify:templates
        env:
          RUNIC_TEMPLATE_FRAMEWORKS: ${{ matrix.framework }}
          RUNIC_TEMPLATE_CREATOR: ${{ matrix.creator || '0' }}
          RUNIC_TEMPLATE_DESKTOP_SMOKE: ${{ matrix.desktop-smoke || '0' }}
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  native:
    name: Native / ${{ matrix.rid }}
    needs: plan
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'native') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # cswebui: whether CS-WebUI ships a native library for the RID, so the job runs its
          # window probes (eng/support.json).
          - os: ubuntu-24.04
            rid: linux-x64
            provider: Linux
            extension: ""
            cswebui: true
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            provider: Linux
            extension: ""
            cswebui: true
          - os: windows-latest
            rid: win-x64
            provider: Windows
            extension: .exe
            cswebui: true
            # Cold Chromium and Node timers stall on Windows runners (#70).
            smoke-timeout-scale: "2"
          - os: windows-11-arm
            rid: win-arm64
            provider: Windows
            extension: .exe
            cswebui: false
            smoke-timeout-scale: "2"
          - os: macos-26
            rid: osx-arm64
            provider: MacOS
            extension: ""
            cswebui: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      RUNIC_SMOKE_TIMEOUT_SCALE: ${{ matrix.smoke-timeout-scale || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          nuget: native
          node: "true"
      - uses: ./.github/actions/install-browser
      # Generated Views clients import the workspace runtime from its build output.
      - name: Build the shared Views runtime
        working-directory: packages/web/views
        run: bun run --bun build
      - name: Build managed desktop contracts
        run: dotnet build tests/dotnet/Runic.Desktop.Tests -c Release
      # --timeout bounds the whole session, including test-host startup and exit. MTP resolves a
      # relative results directory against the test binary, so the paths are absolute.
      - name: Test managed desktop contracts
        timeout-minutes: 5
        run: >-
          dotnet run --project tests/dotnet/Runic.Desktop.Tests -c Release --no-build --
          --timeout 3m --output detailed
          --diagnostic --diagnostic-output-directory ${{ github.workspace }}/artifacts/native-tests
          --results-directory ${{ github.workspace }}/artifacts/native-tests --report-trx --report-trx-filename desktop.trx
      # The managed job runs these cases on Linux. FileSystemWatcher uses ReadDirectoryChangesW on Windows
      # and FSEvents on macOS, whose symlink, rename and timing behavior differs from inotify.
      - name: Test file watching on Windows and macOS
        if: runner.os != 'Linux'
        timeout-minutes: 10
        run: >-
          dotnet run --project tests/dotnet/Runic.Application.Testing.Tests -c Release --
          --treenode-filter "/*/*/PathWatcherTests/*" --timeout 3m --output detailed
      - name: Retain desktop contract diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-tests-${{ matrix.rid }}-${{ github.run_id }}
          path: artifacts/native-tests
          if-no-files-found: ignore
          overwrite: true
      - name: Install Linux native WebView prerequisites
