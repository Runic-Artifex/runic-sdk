name: SDK CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: sdk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CONFIGURATION: Release
  NUGET_PACKAGES: ${{ github.workspace }}/.cache/nuget
jobs:
  build:
    name: Build shared SDK inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      web: ${{ steps.plan.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - name: Discover web test suites
        id: plan
        run: bun eng/ci/plan.mjs >> "$GITHUB_OUTPUT"
      - name: Restore managed dependencies
        run: dotnet restore RunicSdk.Core.slnx
      - name: Build managed SDK, tools and test executables
        run: bun eng/run.mjs build-core
      - name: Build web packages
        run: bun eng/run.mjs build-web
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
      - name: Archive reusable Linux build outputs
        run: bun eng/ci/build-artifact.mjs create
      - uses: actions/upload-artifact@v7
        with:
          name: sdk-build-${{ github.run_id }}
          path: artifacts/ci-build
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  managed:
    name: Managed / ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [platform, assets, command-line, translations, application]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - uses: ./.github/actions/restore-build
      - name: Install the C++20 conformance compiler
        if: matrix.suite == 'translations'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang
      - name: Run managed conformance suite
        run: bun eng/ci/test-managed.mjs "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}
      - name: Publish and execute RMF2 artifact-v5 NativeAOT smoke
        if: matrix.suite == 'translations'
        run: |
          dotnet publish tests/dotnet/Runic.Translations.Rmf2AotTests -c Release -r linux-x64 --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/rmf2-aot
          ./artifacts/rmf2-aot/Runic.Translations.Rmf2AotTests
      - name: Run bounded RMF2 LSP performance guard
        if: matrix.suite == 'translations'
        run: dotnet run --project tests/dotnet/Runic.Translations.Build.Tests/Runic.Translations.Build.Tests.csproj -c Release --no-build -- --rmf2-lsp-benchmark
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  web:
    name: Web / ${{ matrix.package }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.build.outputs.web) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: ${{ matrix.node && 'true' || 'false' }}
      - uses: ./.github/actions/restore-build
      - uses: ./.github/actions/install-browser
        if: matrix.package == 'vite-plugin-runic' || matrix.package == 'svelte'
      - name: Run package tests
        working-directory: packages/web/${{ matrix.package }}
        run: bun run --bun test
      - name: Verify Svelte inline SSR and hydration
        if: matrix.package == 'svelte'
        working-directory: packages/web/${{ matrix.package }}
        run: bun run --bun test:inline-browser
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  engineering:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: ./.github/actions/restore-build
      - name: Verify workspace, runtime and CI contracts
        run: bun test --timeout 180000 ./eng/*.test.mjs ./eng/ci/*.test.mjs ./eng/release/*.test.mjs ./eng/reliability/*.test.mjs
      - name: Verify current engineering acceptance
        run: bun eng/ci/test-acceptance.mjs
      - name: Check embedded CLI compatibility metadata
        run: bun tools/dotnet-runic/metadata/generate.mjs --check
      - name: Check generated translation capability artifacts
        run: |
          bun eng/generate-cldr.mjs --check
          bun eng/render-capabilities.mjs --check
      - name: Check generated packing project inventory
        run: bun eng/generate-shipping-projects.mjs --check
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  framework-consumers:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: ./.github/actions/restore-build
      - name: Check Svelte integration types
        working-directory: packages/web/svelte
        run: bun run --bun check
      - name: Check SvelteKit integration types
        working-directory: packages/web/sveltekit
        run: bun run --bun check
      - name: Exercise isolated npm framework consumers
        run: bun tests/web/svelte-package-consumers/package-consumers.mjs
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  views:
    name: Window and View journeys
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: ./.github/actions/restore-build
      - uses: ./.github/actions/install-browser
      - name: Exercise first Window generated client
        run: node examples/first-window/browser-smoke.mjs
      - name: Check composed View lifetime and window scopes
        run: |
          dotnet run --no-build -c Release --project examples/notes-view-first/NotesViewFirst.csproj -- --check-view-lifetime
          dotnet run --no-build -c Release --project examples/notes-view-first/NotesViewFirst.csproj -- --check-view-lifetime --splat
          node examples/notes-view-first/window-smoke.mjs
      - name: Exercise Toolkit and ReactiveUI typed clients
        run: |
          node examples/notes-view-first/browser-smoke.mjs
          node examples/notes-reactive-views/browser-smoke.mjs
          RUNIC_VERIFY_PENDING_MOUNT=1 node examples/notes-reactive-views/browser-smoke.mjs
          RUNIC_VERIFY_CLIENT_DISCONNECT=1 node examples/notes-reactive-views/browser-smoke.mjs
      - name: Exercise Svelte and Angular View outlets
        run: |
          (cd examples/notes-view-first/Svelte && bun install --frozen-lockfile && bun run build)
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Svelte/dist" node examples/notes-view-first/browser-smoke.mjs
          npm --prefix examples/notes-view-first/Angular ci
          npm --prefix examples/notes-view-first/Angular run build
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Angular/dist/angular-composed/browser" node examples/notes-view-first/browser-smoke.mjs
          (cd examples/notes-reactive-views/Svelte && bun install --frozen-lockfile && bun run build)
          RUNIC_WEB_ROOT="$PWD/examples/notes-reactive-views/Svelte/dist" node examples/notes-reactive-views/browser-smoke.mjs
          npm --prefix examples/notes-reactive-views/Angular ci
          npm --prefix examples/notes-reactive-views/Angular run build
          RUNIC_WEB_ROOT="$PWD/examples/notes-reactive-views/Angular/dist/angular-reactive/browser" node examples/notes-reactive-views/browser-smoke.mjs
      - name: Exercise View development reload and IDE host
        run: |
          RUNIC_HMR_FRONTEND=svelte RUNIC_HMR_VIA_RUNIC_DEV=1 node examples/notes-reactive-views/hmr-smoke.mjs
          dotnet build examples/notes-reactive-views/NotesReactiveViews.csproj -c Debug
          node examples/notes-reactive-views/ide-host-smoke.mjs
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  editor:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - uses: ./.github/actions/restore-build
      - name: Build the Translations Editor
        run: dotnet build apps/translations-editor/Runic.Translations.Editor.csproj -c Release
      - name: Verify editor frontend and production output
        working-directory: apps/translations-editor/Frontend
        run: bun run --bun verify:built
        env:
          RUNIC_TRANSLATIONS_MANIFEST: ${{ github.workspace }}/apps/translations-editor/obj/Release/net10.0/translations/editor.esm-v5/web-module-manifest-v3.json
      - name: Run editor smoke scenarios
        run: dotnet apps/translations-editor/bin/Release/net10.0/Runic.Translations.Editor.dll --smoke-test
      - name: Validate the example translation workspace
        run: dotnet apps/translations-editor/bin/Release/net10.0/Runic.Translations.Editor.dll validate apps/translations-editor/ExampleWorkspace
      - uses: ./.github/actions/install-browser
      - name: Verify real hosted editor RMF2 editing and recovery
        run: bun apps/translations-editor/tests/HostedBrowserE2E/run-hosted-rmf2-ui.mjs apps/translations-editor/bin/Release/net10.0/Runic.Translations.Editor.dll
        env:
          RUNIC_EDITOR_HOSTED_E2E_REPORT_DIR: ${{ github.workspace }}/artifacts/editor-hosted-rmf2-ui
      - name: Retain hosted editor browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editor-hosted-rmf2-ui
          path: artifacts/editor-hosted-rmf2-ui
          if-no-files-found: ignore
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  ide-packaging:
    name: IDE / package and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - name: Build and test the VS Code extension
        working-directory: tools/vscode-runic-translations
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test
          bun run package
      - name: Verify the Visual Studio source packaging contract
        run: python3 tools/visualstudio-runic-translations/package.py --check-source
      - uses: actions/upload-artifact@v7
        with:
          name: rmf2-ide-packages
          path: tools/vscode-runic-translations/artifacts/runic-translations.vsix
          if-no-files-found: error
          retention-days: 14
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  ide-windows-package:
    name: IDE / Windows VSIX package
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: microsoft/setup-msbuild@v2
      - name: Build the language server
        run: dotnet build tools/dotnet-runic-translations/dotnet-runic-translations.csproj -c Release
      - name: Build the native VSIX with full-framework MSBuild
        run: msbuild tools/visualstudio-runic-translations/Runic.Translations.VisualStudio.csproj /restore /m:1 /p:Configuration=Release
      - name: Verify the generated VSIX against the source manifest
        run: python tools/visualstudio-runic-translations/package.py --configuration Release
      - uses: actions/upload-artifact@v7
        with:
          name: rmf2-visualstudio-vsix
          path: tools/visualstudio-runic-translations/artifacts/runic-translations-visualstudio.vsix
          if-no-files-found: error
          retention-days: 14
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          dotnet: "false"
      - name: Check documentation types
        working-directory: docs
        run: bun run --bun check
      - name: Build and test documentation and release data
        working-directory: docs
        run: bun run --bun test
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  packages:
    name: Materialize package candidates
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - uses: ./.github/actions/restore-build
      - name: Pack the verified build inputs
        run: bun eng/run.mjs pack-built
      - name: Verify shipped template lock integrity
        run: bun eng/release/verify-template-locks.mjs
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
      - uses: actions/upload-artifact@v7
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  package-consumers:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: actions/download-artifact@v8
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
      - name: Verify isolated NuGet and npm consumers
        run: bun run verify-packages
      - name: Verify generated CommandLine package consumer with NativeAOT
        shell: pwsh
        run: |
          $version = (Get-Content eng/workspace.json -Raw | ConvertFrom-Json).version
          ./tests/fixtures/command-line/package-consumer/Runic.CommandLine.PackageConsumer/Invoke-PackageConsumer.ps1 -PackageVersion $version -PackageDirectory artifacts/packages/nuget -RuntimeIdentifier linux-x64 -Configuration Release
      - name: Verify packaged Angular View outlet
        run: |
          version=$(bun -p 'JSON.parse(require("node:fs").readFileSync("eng/workspace.json", "utf8")).version')
          bun tests/web/angular-package-consumer/test-package-consumer.mjs "artifacts/packages/npm/runic-artifex-views-angular-$version.tgz"
      - uses: ./.github/actions/install-browser
      - name: Verify packaged Window factory, generated client, and browser
        run: node examples/first-window/package-smoke.mjs
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  wpf-package-consumer:
    needs: packages
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - uses: actions/download-artifact@v8
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
      - name: Verify packaged WPF translation consumer
        run: bun eng/run.mjs verify-packages Runic.Translations.Wpf
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  templates:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: actions/download-artifact@v8
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
      - name: Verify generated template applications
        run: bun run verify:templates
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  native:
    name: Native / ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            provider: Linux
            extension: ""
          - os: windows-latest
            rid: win-x64
            provider: Windows
            extension: .exe
          - os: macos-26
            rid: osx-arm64
            provider: MacOS
            extension: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install pinned npm
        shell: bash
        run: npm install --global npm@12.0.2
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/install-browser
      - name: Build managed desktop contracts
        run: dotnet build tests/dotnet/Runic.Desktop.Tests -c Release
      - name: Test managed desktop contracts
        timeout-minutes: 5
        run: >-
          dotnet test tests/dotnet/Runic.Desktop.Tests -c Release --no-build
          --settings eng/ci/desktop.runsettings --diag artifacts/native-tests/vstest.log
          --logger "console;verbosity=normal" --logger "trx;LogFileName=desktop.trx"
          --results-directory artifacts/native-tests
          --blame-hang-timeout 2m --blame-hang-dump-type none
      - name: Retain desktop contract diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-tests-${{ matrix.rid }}-${{ github.run_id }}
          path: artifacts/native-tests
          if-no-files-found: ignore
          overwrite: true
      - name: Install Linux native WebView prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-0 libwebkitgtk-6.0-4 xvfb dbus-x11 at-spi2-core
      - name: Permit the WebKit sandbox on Ubuntu
        if: runner.os == 'Linux'
        run: |
          # Ubuntu restricts capabilities inside unprivileged user namespaces.
          # Permit the distribution's bwrap helper without disabling AppArmor or WebKit's sandbox.
          test "$(command -v bwrap)" = /usr/bin/bwrap
          sudo tee /etc/apparmor.d/runic-ci-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile runic-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/runic-ci-bwrap
          bwrap --unshare-user --unshare-net --ro-bind / / --proc /proc --dev /dev true
      - name: Build native window smoke
        run: dotnet build tests/native/Runic.Desktop.WebViewSmoke -c Release
      - name: Exercise native window close interception on Linux
        if: runner.os == 'Linux'
        run: GDK_BACKEND=x11 xvfb-run -a dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll
      - name: Exercise direct portal protocol
        if: runner.os == 'Linux'
        run: dbus-run-session -- dotnet run --project tests/dotnet/Runic.Platform.Linux.Portal.Tests -c Release -- --dbus
      - name: Exercise GTK4 native window and platform services
        if: runner.os == 'Linux'
        run: GDK_BACKEND=x11 GSETTINGS_BACKEND=memory dbus-run-session -- xvfb-run -a dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release
      - name: Verify GTK4 and portal NativeAOT consumers
        if: runner.os == 'Linux'
        run: |
          dotnet publish tests/native/Runic.Desktop.Gtk4.Smoke -c Release -r linux-x64 --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/gtk4-aot
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory dbus-run-session -- xvfb-run -a artifacts/gtk4-aot/Runic.Desktop.Gtk4.Smoke
          dotnet publish tests/dotnet/Runic.Platform.Linux.Portal.Tests -c Release -r linux-x64 --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/portal-aot
          dbus-run-session -- artifacts/portal-aot/Runic.Platform.Linux.Portal.Tests --dbus
      - name: Exercise native window close interception on Windows and macOS
        if: runner.os != 'Linux'
        run: dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll
      - name: Verify Windows administration native inspection
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: dotnet run --project tests/dotnet/Runic.Platform.Administration.Windows.Tests -c Release -p:RunicToolkitBuildMode=Verification
      - name: Publish Windows administration inspection with NativeAOT
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: dotnet publish tests/dotnet/Runic.Platform.Administration.Windows.Tests -c Release -r win-x64 --self-contained true -p:PublishAot=true -p:RunicToolkitBuildMode=Verification -p:IlcTreatWarningsAsErrors=true -o artifacts/administration-aot
      - name: Verify NativeAOT Windows administration inspection
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: ./artifacts/administration-aot/Runic.Platform.Administration.Windows.Tests.exe
      - name: Build native clipboard conformance
        run: dotnet build tests/dotnet/Runic.Platform.${{ matrix.provider }}.Tests -c Release -p:TreatWarningsAsErrors=true
      - name: Verify native GTK clipboard
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: GDK_BACKEND=x11 xvfb-run -a dotnet tests/dotnet/Runic.Platform.Linux.Tests/bin/Release/net10.0/Runic.Platform.Linux.Tests.dll --native
      - name: Verify native clipboard
        if: runner.os != 'Linux'
        timeout-minutes: 3
        run: dotnet tests/dotnet/Runic.Platform.${{ matrix.provider }}.Tests/bin/Release/net10.0/Runic.Platform.${{ matrix.provider }}.Tests.dll --native
      - name: Publish native clipboard conformance with NativeAOT
        timeout-minutes: 10
        run: dotnet publish tests/dotnet/Runic.Platform.${{ matrix.provider }}.Tests -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -p:TrimmerSingleWarn=false -o artifacts/clipboard-aot
      - name: Verify Windows system-sleep inhibition with JIT and NativeAOT
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: bash
        run: |
          dotnet tests/dotnet/Runic.Platform.Windows.Tests/bin/Release/net10.0/Runic.Platform.Windows.Tests.dll --native-inhibition --system-only
          ./artifacts/clipboard-aot/Runic.Platform.Windows.Tests.exe --native-inhibition --system-only
      - name: Verify NativeAOT GTK clipboard
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: GDK_BACKEND=x11 xvfb-run -a artifacts/clipboard-aot/Runic.Platform.Linux.Tests --native
      - name: Verify NativeAOT clipboard
        if: runner.os != 'Linux'
        timeout-minutes: 3
        shell: bash
        run: ./artifacts/clipboard-aot/Runic.Platform.${{ matrix.provider }}.Tests${{ matrix.extension }} --native
      - name: Publish and run platform runtime conformance with NativeAOT
        timeout-minutes: 10
        shell: bash
        run: |
          dotnet publish tests/dotnet/Runic.Platform.Runtime.Tests/Runic.Platform.Runtime.Tests.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/platform-runtime-aot
          ./artifacts/platform-runtime-aot/Runic.Platform.Runtime.Tests${{ matrix.extension }}
      - name: Prepare signed macOS sandbox fixture for manual permission evidence
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts/platform-sandbox/RunicPlatform.app/Contents/MacOS
          cp tests/native/platform-sandbox/Info.plist artifacts/platform-sandbox/RunicPlatform.app/Contents/Info.plist
          ditto artifacts/platform-runtime-aot artifacts/platform-sandbox/RunicPlatform.app/Contents/MacOS
          codesign --force --deep --sign - --entitlements tests/native/platform-sandbox/entitlements.plist artifacts/platform-sandbox/RunicPlatform.app
          codesign --verify --deep --strict artifacts/platform-sandbox/RunicPlatform.app
          tar -czf artifacts/platform-sandbox-${{ matrix.rid }}.tar.gz -C artifacts/platform-sandbox RunicPlatform.app
      - name: Retain macOS sandbox permission fixture
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: platform-sandbox-${{ matrix.rid }}-${{ github.run_id }}
          path: artifacts/platform-sandbox-${{ matrix.rid }}.tar.gz
          if-no-files-found: error
      - name: Verify WPF translation rendering
        if: runner.os == 'Windows'
        run: dotnet run --project tests/dotnet/Runic.Translations.Wpf.Tests/Runic.Translations.Wpf.Tests.csproj -c Release
      - name: Publish and exercise WebView2 with NativeAOT
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet publish tests/native/Runic.Desktop.WebViewSmoke -c Release -r win-x64 --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -p:TrimmerSingleWarn=false -o artifacts/webview-aot
          test ! -e artifacts/webview-aot/WebView2Loader.dll
          mkdir artifacts/webview-exe-only
          cp artifacts/webview-aot/Runic.Desktop.WebViewSmoke.exe artifacts/webview-exe-only/
          (cd artifacts/webview-exe-only && ./Runic.Desktop.WebViewSmoke.exe)
      - name: Publish Window and View application with NativeAOT
        shell: bash
        run: |
          dotnet publish examples/first-window/FirstWindow.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/views-aot
          if [[ "$RUNNER_OS" == Linux ]]; then
            GDK_BACKEND=x11 xvfb-run -a ./artifacts/views-aot/FirstWindow${{ matrix.extension }} --probe-factory-failure
            GDK_BACKEND=x11 RUNIC_FIRST_WINDOW_EXECUTABLE="$(node -p 'require("node:path").resolve("artifacts/views-aot/FirstWindow${{ matrix.extension }}")')" xvfb-run -a node examples/first-window/browser-smoke.mjs
          else
            ./artifacts/views-aot/FirstWindow${{ matrix.extension }} --probe-factory-failure
            RUNIC_FIRST_WINDOW_EXECUTABLE="$(node -p 'require("node:path").resolve("artifacts/views-aot/FirstWindow${{ matrix.extension }}")')" node examples/first-window/browser-smoke.mjs
          fi
      - name: Verify Windows View IDE launch and framework reload
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 10
        run: |
          npm --prefix examples/notes-reactive-views/Angular ci
          (cd examples/notes-reactive-views/Svelte && bun install --frozen-lockfile)
          dotnet build examples/notes-reactive-views/NotesReactiveViews.csproj -c Debug
          node examples/notes-reactive-views/ide-host-smoke.mjs
          RUNIC_HMR_FRONTEND=angular RUNIC_HMR_VIA_IDE=1 node examples/notes-reactive-views/hmr-smoke.mjs

  verify:
    name: verify
    if: always()
    needs: [build, managed, web, engineering, framework-consumers, views, editor, docs, packages, package-consumers, wpf-package-consumer, templates, native, ide-packaging, ide-windows-package]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every verification job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          IFS=',' read -ra results <<< "$RESULTS"
          for result in "${results[@]}"; do
            if [[ "$result" != success ]]; then
              echo "Verification is incomplete: $RESULTS"
              exit 1
            fi
          done
