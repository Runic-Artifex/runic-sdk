      # Each Notes frontend also renders the in-page menu bar with a headless library (Base UI, Reka UI, Bits UI,
      # CDK Menu); menu-bar-smoke drives it in Chromium against the mock host and the example's CS-WebUI host, and
      # scans it with axe-core.
      - name: Exercise the React and Vue Notes editor and menu bar variants
        run: |
          (cd examples/notes-view-first/React && bun install --frozen-lockfile && bun run --bun build)
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/React/dist" node examples/notes-view-first/browser-smoke.mjs
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/React/dist" node examples/notes-view-first/menu-bar-smoke.mjs
          RUNIC_MENU_BAR_HOST=cswebui RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/React/dist" node examples/notes-view-first/menu-bar-smoke.mjs
          (cd examples/notes-view-first/Vue && bun install --frozen-lockfile && bun run --bun build)
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Vue/dist" node examples/notes-view-first/browser-smoke.mjs
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Vue/dist" node examples/notes-view-first/menu-bar-smoke.mjs
          RUNIC_MENU_BAR_HOST=cswebui RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Vue/dist" node examples/notes-view-first/menu-bar-smoke.mjs
      - name: Exercise Svelte and Angular View outlets and menu bars
        run: |
          (cd examples/notes-view-first/Svelte && bun install --frozen-lockfile && bun run build)
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Svelte/dist" node examples/notes-view-first/browser-smoke.mjs
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Svelte/dist" node examples/notes-view-first/menu-bar-smoke.mjs
          RUNIC_MENU_BAR_HOST=cswebui RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Svelte/dist" node examples/notes-view-first/menu-bar-smoke.mjs
          npm --prefix examples/notes-view-first/Angular ci
          npm --prefix examples/notes-view-first/Angular run build
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Angular/dist/angular-composed/browser" node examples/notes-view-first/browser-smoke.mjs
          # The Angular Notes variants: fields bound in the template without forms, and Save ordered by dispatch.
          RUNIC_SMOKE_MODE=baseline RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Angular/dist/angular-composed/browser" node examples/notes-view-first/browser-smoke.mjs
          RUNIC_SMOKE_MODE=dispatch-probe RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Angular/dist/angular-composed/browser" node examples/notes-view-first/browser-smoke.mjs
          RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Angular/dist/angular-composed/browser" node examples/notes-view-first/menu-bar-smoke.mjs
          RUNIC_MENU_BAR_HOST=cswebui RUNIC_WEB_ROOT="$PWD/examples/notes-view-first/Angular/dist/angular-composed/browser" node examples/notes-view-first/menu-bar-smoke.mjs
          (cd examples/notes-reactive-views/Svelte && bun install --frozen-lockfile && bun run build)
          RUNIC_WEB_ROOT="$PWD/examples/notes-reactive-views/Svelte/dist" node examples/notes-reactive-views/browser-smoke.mjs
          npm --prefix examples/notes-reactive-views/Angular ci
          npm --prefix examples/notes-reactive-views/Angular run build
          RUNIC_WEB_ROOT="$PWD/examples/notes-reactive-views/Angular/dist/angular-reactive/browser" node examples/notes-reactive-views/browser-smoke.mjs
      # dotnet runic dev without a development server: the Runic Desktop host serves Frontend/dist live and reloads.
      - name: Exercise dotnet runic dev with a frontend watcher
        run: node tests/fixtures/application/dev-live-assets/dev-smoke.mjs
      - name: Exercise View development reload and IDE host
        run: |
          RUNIC_HMR_FRONTEND=svelte RUNIC_HMR_VIA_RUNIC_DEV=1 node examples/notes-reactive-views/hmr-smoke.mjs
          dotnet build examples/notes-reactive-views/NotesReactiveViews.csproj -c Debug
          node examples/notes-reactive-views/ide-host-smoke.mjs
          node examples/notes-reactive-views/dotnet-hot-reload-smoke.mjs
          RUNIC_HOT_RELOAD_SCENARIO=getter node examples/notes-reactive-views/dotnet-hot-reload-smoke.mjs
      # A trimmed JIT publish runs ILLink's IL rewriting, which the JIT and NativeAOT builds don't: ILLink 10.0 kept
      # X509Certificate2Collection's interfaces without its base's (dotnet/runtime#135913, a TypeLoadException when
      # Kestrel binds) and dropped a lock's release from an async finally (dotnet/runtime#136414, a hang on the second
      # call). Last in the job: the RID-specific publish restores the referenced projects for linux-x64.
      - name: Publish the Runic Desktop Views host self-contained and trimmed, and exercise it
        run: |
          dotnet publish examples/first-window-desktop/FirstWindowDesktop.csproj -c Release -r linux-x64 --self-contained true -p:PublishTrimmed=true -p:ILLinkTreatWarningsAsErrors=true -p:TrimmerSingleWarn=false -o artifacts/desktop-views-trimmed
          RUNIC_DESKTOP_VIEWS_EXECUTABLE="$PWD/artifacts/desktop-views-trimmed/FirstWindowDesktop" node examples/first-window-desktop/browser-smoke.mjs
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  package-consumers:
    needs: [plan, build]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'package-consumers') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
      - uses: ./.github/actions/install-browser
      - name: Verify isolated NuGet and npm consumers
        run: bun run verify-packages
      - name: Verify packaged Angular View outlet
        run: |
          version=$(bun -p 'JSON.parse(require("node:fs").readFileSync("eng/workspace.json", "utf8")).version')
          bun tests/web/angular-package-consumer/test-package-consumer.mjs "artifacts/packages/npm/runic-artifex-angular-$version.tgz"
      - name: Verify packaged Window factory, generated client, and browser
        run: |
          bun run --cwd packages/web/views --bun build
          node examples/first-window/package-smoke.mjs
          node examples/first-window-desktop/package-smoke.mjs
      - name: Verify the packaged navigation consumer with JIT and NativeAOT
        run: bun tests/fixtures/application/navigation-consumer/package-smoke.mjs
      - name: Verify packaged operation controls, selection and accepted-work shutdown
        run: bun tests/fixtures/application/operations-consumer/package-smoke.mjs
      - name: Verify WPF Bridge generation, single-project and split, from the packed packages
        run: bun tests/fixtures/application/wpf-bridge-consumer/package-smoke.mjs
      - name: Verify standalone Runic.Navigation without Runic.Application.Views, Node or a host
        run: bun tests/fixtures/navigation/standalone-consumer/package-smoke.mjs
      - name: Verify the ReactiveUI navigation adapters pull in no Runic.Application.Views
        run: bun tests/fixtures/navigation/reactiveui-consumer/package-smoke.mjs
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  wpf:
    name: WPF navigation / ${{ matrix.rid }}
    needs: [plan, build]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'wpf') }}
    # Both legs (wpfLegs in eng/ci/platforms.mjs) run the WPF hosts. Bridge generation and the
    # packed consumers do not depend on the architecture, so only win-x64 runs them.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.wpf) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # I-176: each embedded window creates a fresh WebView2 profile under TEMP, and its first request waits for the
      # profile's cookie database. On hosted windows-2025 x64, Windows servicing about 10 min after boot pushes C:'s
      # write latency to seconds, and that wait to 5-25 s. RUNNER_TEMP is on the runner's local disk (D:); a soak with
      # TEMP there had 1 window over 5 s in 5,240 against 19 in 1,560 with TEMP on C:. windows-11-arm has neither the
      # separate disk nor these episodes.
      - name: Temporary files on the runner's local disk
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: ./.github/actions/setup-sdk
        with:
          nuget: wpf
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
      # STA hosts, dialogs and dispatcher contexts need a real Windows desktop session.
      - name: Test the WPF navigation hosts
        run: dotnet run --project tests/dotnet/Runic.Navigation.Wpf.Tests -c Release
      - name: Test the WPF embedded Runic View host
        run: dotnet run --project tests/dotnet/Runic.Application.Views.Wpf.Windows.Tests -c Release
      - name: Test the hybrid WPF editor migration example
        run: |
          bun run --cwd packages/web/views --bun build
          dotnet run --project examples/wpf-hybrid-editor/WindowsSmoke/HybridNotes.WindowsSmoke.csproj -c Release
      # D09: what a screen reader reads in the hybrid editor and how Tab crosses between the WPF shell and the
      # WebView2 content, through UI Automation and real key presses (tests/native/wpf-ui-automation/README.md).
      - name: Check the hybrid WPF editor with UI Automation
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          dotnet build examples/wpf-hybrid-editor/App/HybridNotes.Wpf.csproj -c Release
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/native/wpf-ui-automation/wpf-ui-automation.ps1 `
            -Executable examples/wpf-hybrid-editor/App/bin/Release/net10.0-windows/HybridNotes.Wpf.exe `
            -ReceiptPath artifacts/wpf-ui-automation/receipt.json
      - name: Retain the UI Automation receipt and tree
        if: always() && matrix.rid == 'win-x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wpf-ui-automation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/wpf-ui-automation
          if-no-files-found: ignore
          retention-days: 14
      # #269 and #270 were reported on Windows: generate beside WPF stand-ins and
      # ASP.NET Core types, and from the packed packages, there too.
      - name: Test Bridge generation beside WPF and ASP.NET Core types
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          dotnet run --project tests/dotnet/Runic.Application.Testing.Tests -c Release -- --treenode-filter "/*/*/CodegenDiagnosticsTests/*Framework*"
          dotnet run --project tests/dotnet/Runic.Application.Testing.Tests -c Release --no-build -- --treenode-filter "/*/*/BridgeAttributeNamesTests/*"
      # A generator that stalls past the cases' timeout is dumped there (#348).
      - name: Retain dumps of stalled Bridge generators
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codegen-timeouts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/codegen-timeouts
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify WPF Bridge generation, single-project and split, from the packed packages
        if: matrix.rid == 'win-x64'
        run: bun tests/fixtures/application/wpf-bridge-consumer/package-smoke.mjs
      - name: Verify the packed WPF consumer pulls in only Runic.Navigation
        if: matrix.rid == 'win-x64'
        run: bun tests/fixtures/navigation/wpf-consumer/package-smoke.mjs
      # W240-007: the reference app and its scenario tests, built from the packed packages only.
      - name: Test the WPF navigation example from the packed packages
        if: matrix.rid == 'win-x64'
        run: bun examples/wpf-navigation/package-smoke.mjs
      # W250-037: the ReactiveUI variant of the same app, built from source with the ReactiveUI adapter.
      - name: Test the ReactiveUI WPF navigation example
        if: matrix.rid == 'win-x64'
        run: dotnet run --project examples/wpf-navigation/Tests.ReactiveUI -c Release
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  # Two lanes of two frameworks, with one named step per framework, and a SvelteKit lane on Node 26.
  templates:
    name: Templates / ${{ matrix.first }}+${{ matrix.second }}
    needs: [plan, build]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'templates') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Requires the Chromium Content-Security-Policy check of tests/templates/Test-Templates.sh.
      RUNIC_TEMPLATE_BROWSER_CHECK: "1"
    strategy:
      fail-fast: false
      matrix:
        # The guided creator check is framework-independent; the react step runs it once.
        # The vue step owns the --linux-gtk 4 variant and opens it and the default
        # Runic Desktop project under Xvfb.
        include:
          - first: react
            second: svelte
            creator: "1"
          - first: vue
            second: angular
            desktop-smoke: "1"
          # The starters' engines.node admits Node 24 and 26 (D031.3); this lane builds them on Node 26.
          - first: sveltekit
            node: "26.12.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.node
        with:
          node-version: ${{ matrix.node }}
      - name: Install the pinned package managers on Node ${{ matrix.node }}
        if: matrix.node
        run: |
          npm install --global npm@12.2.0 pnpm@12.9.1 --allow-scripts=pnpm
          node --version | grep "^v${{ matrix.node }}$"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: candidates
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
      - name: Install the Desktop template runtimes
        if: matrix.desktop-smoke == '1'
        uses: ./.github/actions/apt-install
        with:
          packages: libwebkit2gtk-4.1-0 libwebkitgtk-6.0-4 xvfb dbus-x11 at-spi2-core
      - name: Permit the WebKit sandbox on Ubuntu
        if: matrix.desktop-smoke == '1'
        run: eng/ci/permit-webkit-sandbox.sh
      # Every lane opens its frontends' production pages in Chromium and fails on a Content-Security-Policy violation.
      - uses: ./.github/actions/install-browser
      - name: Verify generated ${{ matrix.first }} template applications
        run: bun run verify:templates
        env:
          RUNIC_TEMPLATE_FRAMEWORKS: ${{ matrix.first }}
          RUNIC_TEMPLATE_CREATOR: ${{ matrix.creator || '0' }}
          RUNIC_TEMPLATE_DESKTOP_SMOKE: ${{ matrix.desktop-smoke || '0' }}
      # Also runs after the first framework failed, so one run reports both.
      - name: Verify generated ${{ matrix.second }} template applications
        if: ${{ !cancelled() && steps.candidates.outcome == 'success' && matrix.second }}
        run: bun run verify:templates
        env:
          RUNIC_TEMPLATE_FRAMEWORKS: ${{ matrix.second }}
          RUNIC_TEMPLATE_CREATOR: "0"
          RUNIC_TEMPLATE_DESKTOP_SMOKE: "0"
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  native:
    name: Native / ${{ matrix.rid }}
    needs: plan
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'native') }}
    # The planned legs of nativeLegs in eng/ci/platforms.mjs: both Linux legs, and the Windows
    # and macOS legs the change needs.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.native) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      # The real GNOME portal check's container (eng/ci/real-portal.sh).
      FEDORA_IMAGE: docker.io/library/fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only the Windows x64 View IDE check runs npm; the other legs only run node.
      - uses: ./.github/actions/setup-sdk
        with:
          nuget: native
          node: "true"
          package-managers: ${{ matrix.rid == 'win-x64' }}
      - uses: ./.github/actions/install-browser
      # Generated Views clients import the workspace runtime from its build output.
      - name: Build the shared Views runtime
        working-directory: packages/web/views
        run: bun run --bun build
      - name: Build managed desktop contracts
        run: dotnet build tests/dotnet/Runic.Desktop.Tests -c Release
      # --timeout bounds the whole session, including test-host startup and exit. MTP resolves a
      # relative results directory against the test binary, so the paths are absolute.
      - name: Test managed desktop contracts
        timeout-minutes: 5
        run: >-
          dotnet run --project tests/dotnet/Runic.Desktop.Tests -c Release --no-build --
          --timeout 3m --output detailed
          --diagnostic --diagnostic-output-directory ${{ github.workspace }}/artifacts/native-tests
          --results-directory ${{ github.workspace }}/artifacts/native-tests --report-trx --report-trx-filename desktop.trx
      # The managed job runs these cases on Linux. FileSystemWatcher uses ReadDirectoryChangesW on Windows
      # and FSEvents on macOS, whose symlink, rename and timing behavior differs from inotify.
      - name: Test file watching on Windows and macOS
        if: runner.os != 'Linux'
        timeout-minutes: 10
        run: >-
          dotnet run --project tests/dotnet/Runic.Application.Testing.Tests -c Release --
          --treenode-filter "/*/*/PathWatcherTests/*" --timeout 3m --output detailed
      # The managed job runs these cases on Linux. The development-directory source pins its root with a no-follow
      # handle on macOS (openat, F_GETPATH) but checks paths for reparse points on Windows, and its watcher uses
      # FSEvents and ReadDirectoryChangesW there. The trusted archive writer rejects reparse points on Windows and
      # must write the same bytes on every OS; the packer's RAS1005 warning must reach MSBuild there too.
      - name: Test development asset sources and archive writers on Windows and macOS
        if: runner.os != 'Linux'
        timeout-minutes: 10
        run: >-
          dotnet run --project tests/dotnet/Runic.Assets.Tests -c Release --
          --treenode-filter "/*/*/(DevelopmentDirectoryTests)|(ArchiveDirectoryTests)/*" --timeout 3m --output detailed
      # The managed job runs these cases on Linux; renames, attributes and path rules differ on Windows and macOS.
      - name: Test file transfers on Windows and macOS
        if: runner.os != 'Linux'
        timeout-minutes: 10
        run: >-
          dotnet run --project tests/dotnet/Runic.Platform.Runtime.Tests -c Release --
          --treenode-filter "/*/*/FileTransferTests/*" --timeout 3m --output detailed
      - name: Retain desktop contract diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-tests-${{ matrix.rid }}-${{ github.run_id }}
          path: artifacts/native-tests
          if-no-files-found: ignore
          overwrite: true
      - name: Install Linux native WebView prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          # hunspell-en-us: a dictionary for the spell-checking smoke (#662).
          packages: libwebkit2gtk-4.1-0 libwebkitgtk-6.0-4 xvfb dbus-x11 at-spi2-core xdotool hunspell-en-us
      # A window manager for the GTK 4 placement check (#663), without Openbox's recommended configuration tools.
      - name: Install Openbox for the X11 placement check
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: openbox
          install-recommends: "false"
      - name: Permit the WebKit sandbox on Ubuntu
        if: runner.os == 'Linux'
        run: eng/ci/permit-webkit-sandbox.sh
      - name: Build native window smoke
        run: dotnet build tests/native/Runic.Desktop.WebViewSmoke -c Release
      - name: Exercise native window close interception on Linux
        if: runner.os == 'Linux'
        # Real pointer drags through XTEST: a stuck drag must not hold the runner.
        timeout-minutes: 6
        run: GDK_BACKEND=x11 xvfb-run -a dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll
      - name: Exercise the Desktop event-loop entry point on Linux
        if: runner.os == 'Linux'
        run: GDK_BACKEND=x11 xvfb-run -a dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll --event-loop
      # Real key presses and wheel clicks through XTEST; see keyboard-driver.sh.
      - name: Exercise keyboard focus and zoom in the GTK 3 window
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: GDK_BACKEND=x11 xvfb-run -a tests/native/Runic.Desktop.WebViewSmoke/keyboard-driver.sh artifacts/keyboard/gtk3 dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll
      # SEC-04: DesktopWebContentPolicy with real clicks through XTEST; see WebContentSmoke.cs.
      - name: Exercise the web content policy in the GTK 3 window
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: GDK_BACKEND=x11 xvfb-run -a dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll --web-content
      - name: Check the WebKitGTK keyboard script in Chromium
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: bun test --timeout 60000 tests/native/Runic.Desktop.WebViewSmoke/keyboard-script.test.mjs
      # The drag regions of the macOS window chrome script (MacOsWindowChrome.js); WKWebView runs it in --window-chrome.
      - name: Check the macOS window chrome script in Chromium
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: bun test --timeout 60000 tests/native/Runic.Desktop.WebViewSmoke/window-chrome-script.test.mjs
      - name: Exercise direct portal protocol
        if: runner.os == 'Linux'
        # The explicit DBus cases need a session bus; the managed job runs the portable cases.
        run: dbus-run-session -- dotnet run --project tests/dotnet/Runic.Platform.Linux.Portal.Tests -c Release -- --treenode-filter "/*/*/*/*[Category=DBus]"
      - name: Exercise the D-Bus client and service API on a private bus
        if: runner.os == 'Linux'
        run: dbus-run-session -- dotnet run --project tests/dotnet/Runic.Platform.Linux.DBus.Tests -c Release -- --treenode-filter "/*/*/*/*[Category=DBus]"
      # B10: the Linux global menu's dbusmenu export and registrar watch, with a fake registrar on a private bus.
      - name: Exercise the Linux global menu on a private bus
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: dbus-run-session -- dotnet run --project tests/dotnet/Runic.Desktop.Tests -c Release --no-build -- --treenode-filter "/*/*/*/*[Category=DBus]" --timeout 3m --output detailed
      # The private session bus starts inside xvfb-run: services it activates, such as xdg-desktop-portal-gtk, inherit
      # the bus's environment rather than the client's, and exited with "cannot open display" without DISPLAY.
      - name: Exercise GTK4 native window and platform services
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release
          # The GTK runner has one lifetime per process; the entry-point check runs separately.
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --event-loop
          # SIGTERM closes the GTK window and disposes the host before the GTK loop ends.
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --signal
          # SEC-04: DesktopWebContentPolicy with real clicks through XTEST.
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --web-content
          # DesktopWindow.AnnounceAsync reaches AT-SPI as Object:Announcement with GTK 3 and GTK 4 (#318).
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --announcement gtk3
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --announcement gtk4
          # B10: the in-window menu bar, its shortcuts and context menus with GTK 3 and GTK 4, left to right and right to
          # left, with real keys and clicks through XTEST.
          for toolkit in gtk3 gtk4; do
            GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --menus "$toolkit"
            GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --menus "$toolkit" --rtl
            # The bar in the desktop's global menu: a fake registrar in the smoke, RegisterWindow and the _KDE_* properties.
            GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --global-menu "$toolkit"
          done
          # B17: GtkAlertDialog message boxes for a GTK 4 window, answered by activating their buttons and closing them.
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --message-boxes
          # #662: WebKitGTK's spell checker on with the application's languages, changed in an open window and off in a
          # window, with GTK 3 and GTK 4.
          for toolkit in gtk3 gtk4; do
            GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --spelling "$toolkit"
          done
          # Right-to-left (W315-019): an Arabic process locale reaches the page's navigator.language, GTK 4's own
          # direction is right to left without a translation, and the application can override it.
          sudo locale-gen ar_EG.UTF-8
          LC_ALL=ar_EG.UTF-8 LANG=ar_EG.UTF-8 LANGUAGE=ar GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --rtl
          # B12 (I-066, I-073): GDK's monitors, list and watch, open on and move to a monitor, LayoutDirection and Language
          # under the C locale, for GTK 3 and GTK 4. Xvfb has one monitor; the step tries xrandr --setmonitor for a
          # second and logs what GDK lists (two monitors otherwise need I-099's VM). Full screen needs a window
          # manager, which Xvfb lacks, so those checks are skipped here.
          # shellcheck disable=SC2016 # $0 expands in the inner shell.
          for toolkit in gtk3 gtk4; do
            LC_ALL=C LANG=C GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a -s '-screen 0 1600x600x24' dbus-run-session -- bash -c \
              'if command -v xrandr >/dev/null; then xrandr --setmonitor RunicA 800/211x600/158+0+0 screen && xrandr --setmonitor RunicB 800/211x600/158+800+0 none; xrandr --listmonitors; fi;
               exec dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --monitors "$0"' "$toolkit"
          done
          # #663: a restored placement's position under a window manager that places new windows itself (Openbox): the
          # GTK 4 window keeps it, also as the bounds a maximized window restores to, and reports it back unchanged.
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a -s '-screen 0 1600x900x24' dbus-run-session -- bash -c \
            'openbox & exec dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --placement --window-manager'
          # Controlled-portal journey: directory and SaveFile requests through the production provider.
          # A private runtime directory lets the isolated bus activate its own document portal, when
          # installed, for the document-view save; otherwise that variant reports a skip with its reason.
          journey_runtime=$(mktemp -d) && mkdir "$journey_runtime/data"
          XDG_RUNTIME_DIR="$journey_runtime" XDG_DATA_HOME="$journey_runtime/data" GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --directory
          # Without a display the entry point must fall back instead of letting gtk_init exit the process.
          env -u DISPLAY -u WAYLAND_DISPLAY GDK_BACKEND=x11 GSETTINGS_BACKEND=memory dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release --no-build -- --no-display
      - name: Verify GTK4 and portal NativeAOT consumers
        if: runner.os == 'Linux'
        run: |
          dotnet publish tests/native/Runic.Desktop.Gtk4.Smoke -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/gtk4-aot
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- artifacts/gtk4-aot/Runic.Desktop.Gtk4.Smoke
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- artifacts/gtk4-aot/Runic.Desktop.Gtk4.Smoke --event-loop
          LC_ALL=C GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- artifacts/gtk4-aot/Runic.Desktop.Gtk4.Smoke --monitors gtk4
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- artifacts/gtk4-aot/Runic.Desktop.Gtk4.Smoke --menus gtk4
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- artifacts/gtk4-aot/Runic.Desktop.Gtk4.Smoke --message-boxes
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- artifacts/gtk4-aot/Runic.Desktop.Gtk4.Smoke --global-menu gtk4
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- tests/native/Runic.Desktop.WebViewSmoke/keyboard-driver.sh artifacts/keyboard/gtk4-aot artifacts/gtk4-aot/Runic.Desktop.Gtk4.Smoke
          env -u DISPLAY -u WAYLAND_DISPLAY GDK_BACKEND=x11 GSETTINGS_BACKEND=memory artifacts/gtk4-aot/Runic.Desktop.Gtk4.Smoke --no-display
          dotnet publish tests/dotnet/Runic.Platform.Linux.Portal.Tests -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/portal-aot
          # The run without a filter keeps the portable cases covered under NativeAOT.
          dbus-run-session -- artifacts/portal-aot/Runic.Platform.Linux.Portal.Tests
          dbus-run-session -- artifacts/portal-aot/Runic.Platform.Linux.Portal.Tests --treenode-filter "/*/*/*/*[Category=DBus]"
          dotnet publish tests/dotnet/Runic.Platform.Linux.DBus.Tests -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/dbus-aot
          dbus-run-session -- artifacts/dbus-aot/Runic.Platform.Linux.DBus.Tests
          dbus-run-session -- artifacts/dbus-aot/Runic.Platform.Linux.DBus.Tests --treenode-filter "/*/*/*/*[Category=DBus]"
      # A real Secret Service: GNOME Keyring with an unlocked login keyring on a private session bus, from the JIT build
      # and the NativeAOT executable. The case requires the encrypted session and has secret-tool read what it stored.
      - name: Verify secret storage against GNOME Keyring with JIT and NativeAOT
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          eng/ci/apt-install.sh gnome-keyring libsecret-tools
          for tests in "dotnet tests/dotnet/Runic.Platform.Linux.Portal.Tests/bin/Release/net10.0/Runic.Platform.Linux.Portal.Tests.dll" artifacts/portal-aot/Runic.Platform.Linux.Portal.Tests; do
            RUNIC_TEST_SECRET_SERVICE=gnome-keyring dbus-run-session -- sh -c "printf runic | gnome-keyring-daemon --unlock --components=secrets >/dev/null && $tests --treenode-filter '/*/*/*/*[Category=SecretService]' --output detailed"
          done
      # W315-011: the real xdg-desktop-portal and its GNOME backend publish every appearance key only from portal 1.20
      # on (Ubuntu 24.04 has 1.18), so they run in Fedora. The container runs the published tests and needs no .NET.
      # The same container runs the Trash portal (W310-003), which xdg-desktop-portal implements itself.
      # It also runs the Secret portal with GNOME Keyring's backend (B15), with both builds (I-198).
      # The Fedora packages are downloaded with a time limit per attempt and cached (eng/ci/README.md, "Fedora packages").
      - name: Prepare the Fedora package cache
        id: dnf
        if: runner.os == 'Linux'
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /var/cache/runic-dnf
          prefix="dnf-$(printf '%s' "$FEDORA_IMAGE" | sha256sum | cut -c1-16)-$RUNNER_ARCH-$(sha256sum eng/ci/real-portal.sh | cut -c1-16)-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          # A monthly key lets main replace the cache with current updates.
          echo "key=$prefix$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/dependency-cache
        if: runner.os == 'Linux'
        with:
          path: /var/cache/runic-dnf
          key: ${{ steps.dnf.outputs.key }}
          restore-keys: ${{ steps.dnf.outputs.prefix }}
      - name: Verify appearance settings, the Trash portal and the Secret portal against the real GNOME portal with JIT and NativeAOT
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          RID: ${{ matrix.rid }}
        run: |
          dotnet publish tests/dotnet/Runic.Platform.Linux.Portal.Tests -c Release -r "$RID" --self-contained true -o artifacts/portal-jit
          eng/ci/retry.sh 2 90 docker pull -q "$FEDORA_IMAGE"
          docker run --rm --init -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v /var/cache/runic-dnf:/var/cache/libdnf5 -w "$GITHUB_WORKSPACE" \
            -e GITHUB_ACTIONS -e RUNIC_TEST_TIMEOUT_SCALE "$FEDORA_IMAGE" bash eng/ci/real-portal.sh artifacts/portal-jit/Runic.Platform.Linux.Portal.Tests artifacts/portal-aot/Runic.Platform.Linux.Portal.Tests
      - name: Verify privileged actions under NativeAOT
        if: runner.os == 'Linux'
        # The managed job runs the same cases under JIT; nixos/privileged-operations covers a real Polkit.
        run: |
          dotnet publish tests/dotnet/Runic.Platform.Linux.Polkit.Tests -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/polkit-aot
          artifacts/polkit-aot/Runic.Platform.Linux.Polkit.Tests
      - name: Exercise native window close interception on Windows and macOS
        if: runner.os != 'Linux'
        # The Windows file drop drives a real OLE drag with SendInput: a stuck drag must not hold the runner.
        timeout-minutes: 6
        run: dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll
      - name: Exercise the Desktop event-loop entry point on Windows and macOS
        if: runner.os != 'Linux'
        run: dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll --event-loop
      # B12 (I-066, I-073): the host lists and watches its monitors, a window opens on and moves to a monitor, enters
      # and leaves full screen, and a placement saved full-screen opens full-screen. Windows: a resolution change reaches
      # the watch, and a right-to-left window has a mirrored frame while WebView2 renders and hit-tests the page
      # unmirrored (#389) with the window's Language. macOS: the standard menus take StandardMenuTitles. One monitor per
      # runner; two monitors are I-099's VM check.
      - name: Exercise monitors, full screen and right-to-left windows on Windows and macOS
        if: runner.os != 'Linux'
        timeout-minutes: 6
        env:
          RUNIC_TEST_DISPLAY_SCALING: "1"
        run: dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll --monitors
      # DesktopWindowOptions.ColorScheme: for Dark and Light the page's prefers-color-scheme follows, and so does the
      # window (NSWindow.effectiveAppearance on macOS, the DWM dark title bar on Windows).
      - name: Apply the window color scheme on Windows and macOS
        if: runner.os != 'Linux'
        timeout-minutes: 4
        run: dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll --color-scheme
      # B10 (I-021): the declared menu bar of the WebView2 window (Windows order, access keys, shortcut text, check,
      # radio and disabled states, availability on WM_INITMENUPOPUP, WM_COMMAND with parameters), shortcuts the page
      # leaves alone or cancels, Alt and Alt+access key, context menus (chosen, Escape, replaced, cancelled, at the page
      # point), right-to-left menus, and Page and frameless windows. The arm64 runner delivers no SendInput.
      - name: Exercise the WebView2 menu bar, shortcuts and context menus
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll --menus
      # W315-018: Runic.Desktop.AccessibilityProbe reads and changes a page through AT-SPI (GTK 3 and GTK 4), UI
      # Automation (WebView2) or the macOS accessibility API (WKWebView) from its own process, as a screen reader does:
      # roles, range values, selection, their change events, focus, live regions and AnnounceAsync. On macOS VoiceOver
      # also runs and the probe checks what it says; the screen-readers job does so with NVDA and Orca. Expectations.cs
      # lists each host's known gaps.
      - name: Check what screen readers read in the embedded window
        timeout-minutes: 12
        shell: bash
        run: |
          mkdir -p artifacts/accessibility
          if [[ "$RUNNER_OS" == Windows ]]; then
            dotnet build tests/native/Runic.Desktop.AccessibilityProbe -c Release -f net10.0-windows
            probe="$PWD/tests/native/Runic.Desktop.AccessibilityProbe/bin/Release/net10.0-windows/Runic.Desktop.AccessibilityProbe.exe"
            dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll --accessibility \
              --probe "$probe" --receipt artifacts/accessibility/webview2.json
            exit
          fi
          dotnet build tests/native/Runic.Desktop.AccessibilityProbe -c Release -f net10.0
          probe=(dotnet "$PWD/tests/native/Runic.Desktop.AccessibilityProbe/bin/Release/net10.0/Runic.Desktop.AccessibilityProbe.dll")
          if [[ "$RUNNER_OS" == macOS ]]; then
            eng/ci/macos-voiceover.sh dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll \
              --accessibility --probe "${probe[@]}" --screen-reader voiceover --receipt artifacts/accessibility/wkwebview.json
            exit
          fi
          for toolkit in gtk3 gtk4; do
            GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dbus-run-session -- dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke \
              -c Release --no-build -- --accessibility "$toolkit" --probe "${probe[@]}" --receipt "artifacts/accessibility/$toolkit.json"
          done
      - name: Retain accessibility receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-${{ matrix.rid }}-${{ github.run_id }}
          path: artifacts/accessibility
          if-no-files-found: ignore
      # Runic.Platform.Administration.Windows supports Windows x64 only (eng/release/README.md).
      - name: Verify Windows administration native inspection
        if: runner.os == 'Windows' && runner.arch == 'X64'
        timeout-minutes: 5
        run: dotnet run --project tests/dotnet/Runic.Platform.Administration.Windows.Tests -c Release -p:RunicApplicationBuildMode=Verification
      - name: Publish Windows administration inspection with NativeAOT
        if: runner.os == 'Windows' && runner.arch == 'X64'
        timeout-minutes: 10
        run: dotnet publish tests/dotnet/Runic.Platform.Administration.Windows.Tests -c Release -r win-x64 --self-contained true -p:PublishAot=true -p:RunicApplicationBuildMode=Verification -p:IlcTreatWarningsAsErrors=true -o artifacts/administration-aot
      - name: Verify NativeAOT Windows administration inspection
        if: runner.os == 'Windows' && runner.arch == 'X64'
        timeout-minutes: 5
        run: ./artifacts/administration-aot/Runic.Platform.Administration.Windows.Tests.exe
      # The read-only console example (examples/dotnet/Runic.Administration.Console) builds against the package source
      # and its local commands run on the runner.
      - name: Run the Windows administration console example
        if: runner.os == 'Windows' && runner.arch == 'X64'
        timeout-minutes: 5
        shell: bash
        run: |
          dotnet build examples/dotnet/Runic.Administration.Console -c Release
          dotnet run --project examples/dotnet/Runic.Administration.Console -c Release --no-build -- system
          dotnet run --project examples/dotnet/Runic.Administration.Console -c Release --no-build -- services
      # Privileged actions (W300-025). The NativeElevation cases run the real pipe, its DACL, the client and server
      # checks and the helper's own process state with a stand-in started by CreateProcess. The RealElevation cases
      # start the NativeAOT smoke helper, installed under Program Files, with ShellExecuteExW and runas; the runner's
      # elevated session elevates without a prompt. The tests run through their apphost, which the stand-in restarts.
      - name: Verify privileged actions on Windows with JIT and NativeAOT
        if: runner.os == 'Windows'
        timeout-minutes: 20
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $uac = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
          $principal = [Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()
          Write-Host "Administrators enabled: $($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)); EnableLUA: $($uac.EnableLUA); ConsentPromptBehaviorAdmin: $($uac.ConsentPromptBehaviorAdmin)"
          dotnet publish tests/native/Runic.Elevation.Smoke -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/elevation-helper
          $helper = Join-Path $env:ProgramFiles 'Runic Elevation Smoke'
          New-Item -ItemType Directory -Force $helper | Out-Null
          Copy-Item artifacts/elevation-helper/Runic.Elevation.Smoke.exe $helper
          # As a per-machine installer leaves it: owned by Administrators, with Program Files' inherited entries.
          # What the runner's account copies would otherwise be its own, which the provider refuses.
          # A JIT build installed the same way, which the provider must refuse before the prompt.
          dotnet build tests/native/Runic.Elevation.Smoke -c Release
          $jit = Join-Path $env:ProgramFiles 'Runic Elevation Smoke JIT'
          New-Item -ItemType Directory -Force $jit | Out-Null
          Copy-Item tests/native/Runic.Elevation.Smoke/bin/Release/net10.0/* $jit -Recurse
          # And a self-contained single-file JIT publish, with nothing beside it: only its image's bundle marker shows
          # what it is. RunicWindowsElevatedHelper=false lets it publish without NativeAOT.
          dotnet publish tests/native/Runic.Elevation.Smoke -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:RunicWindowsElevatedHelper=false -o artifacts/elevation-singlefile
          $singleFile = Join-Path $env:ProgramFiles 'Runic Elevation Smoke SingleFile'
          New-Item -ItemType Directory -Force $singleFile | Out-Null
          Copy-Item artifacts/elevation-singlefile/Runic.Elevation.Smoke.exe $singleFile
          foreach ($installed in @($helper, $jit, $singleFile)) {
            icacls $installed /setowner '*S-1-5-32-544' /T /C
            icacls $installed /reset /T /C
          }
          icacls $helper
          icacls (Join-Path $helper 'Runic.Elevation.Smoke.exe')
          dotnet build tests/dotnet/Runic.Platform.Windows.Elevation.Tests -c Release
          dotnet publish tests/dotnet/Runic.Platform.Windows.Elevation.Tests -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/elevation-aot
          foreach ($tests in @('tests/dotnet/Runic.Platform.Windows.Elevation.Tests/bin/Release/net10.0/Runic.Platform.Windows.Elevation.Tests.exe', 'artifacts/elevation-aot/Runic.Platform.Windows.Elevation.Tests.exe')) {
            Write-Host "== $tests"
            & $tests --output detailed
            & $tests --treenode-filter '/*/*/*/*[Category=NativeElevation]' --output detailed
            & $tests --treenode-filter '/*/*/*/*[Category=RealElevation]' --test-parameter "helper-directory=$helper" --test-parameter "jit-helper-directory=$jit" --test-parameter "singlefile-helper-directory=$singleFile" --output detailed
          }
      - name: Build native clipboard conformance
        run: dotnet build tests/dotnet/Runic.Platform.${{ matrix.provider }}.Tests -c Release -p:TreatWarningsAsErrors=true
      - name: Verify native GTK clipboard
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: GDK_BACKEND=x11 xvfb-run -a dotnet tests/dotnet/Runic.Platform.Linux.Tests/bin/Release/net10.0/Runic.Platform.Linux.Tests.dll --treenode-filter "/*/*/*/*[Category=Native]"
      # B17: GtkMessageDialogs for a GTK 3 window, answered with the default response, gtk_window_close and clicks.
      - name: Verify native GTK message boxes
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dotnet tests/dotnet/Runic.Platform.Linux.Tests/bin/Release/net10.0/Runic.Platform.Linux.Tests.dll --treenode-filter "/*/*/*/*[Category=NativeMessageBoxes]"
      - name: Verify native GTK directory chooser lifecycle
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: |
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dotnet tests/dotnet/Runic.Platform.Linux.Tests/bin/Release/net10.0/Runic.Platform.Linux.Tests.dll --treenode-filter "/*/*/*/*[Category=DirectoryNative]"
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dotnet tests/dotnet/Runic.Platform.Linux.Tests/bin/Release/net10.0/Runic.Platform.Linux.Tests.dll --treenode-filter "/*/*/*/*[Category=DirectoryLoopStopped]"
      - name: Verify native clipboard
        if: runner.os != 'Linux'
        timeout-minutes: 3
        run: dotnet tests/dotnet/Runic.Platform.${{ matrix.provider }}.Tests/bin/Release/net10.0/Runic.Platform.${{ matrix.provider }}.Tests.dll --treenode-filter "/*/*/*/*[Category=Native]"
      - name: Publish native clipboard conformance with NativeAOT
        timeout-minutes: 10
        run: dotnet publish tests/dotnet/Runic.Platform.${{ matrix.provider }}.Tests -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -p:TrimmerSingleWarn=false -o artifacts/clipboard-aot
      - name: Verify Windows system-sleep inhibition with JIT and NativeAOT
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: bash
        run: |
          dotnet tests/dotnet/Runic.Platform.Windows.Tests/bin/Release/net10.0/Runic.Platform.Windows.Tests.dll --treenode-filter "/*/*/*/*[Category=NativeInhibition]" --test-parameter system-only=true
          ./artifacts/clipboard-aot/Runic.Platform.Windows.Tests.exe --treenode-filter "/*/*/*/*[Category=NativeInhibition]" --test-parameter system-only=true
      - name: Verify Windows login startup with JIT and NativeAOT
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: bash
        run: |
          dotnet tests/dotnet/Runic.Platform.Windows.Tests/bin/Release/net10.0/Runic.Platform.Windows.Tests.dll --treenode-filter "/*/*/*/*[Category=NativeLoginStartup]"
          ./artifacts/clipboard-aot/Runic.Platform.Windows.Tests.exe --treenode-filter "/*/*/*/*[Category=NativeLoginStartup]"
      - name: Verify Windows settings read with JIT and NativeAOT
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: bash
        run: |
          dotnet tests/dotnet/Runic.Platform.Windows.Tests/bin/Release/net10.0/Runic.Platform.Windows.Tests.dll --treenode-filter "/*/*/*/*[Category=NativeSettings]"
          ./artifacts/clipboard-aot/Runic.Platform.Windows.Tests.exe --treenode-filter "/*/*/*/*[Category=NativeSettings]"
      # A real notification-area icon on the runner's desktop session, driven through its window's messages, and a
      # minimized window brought forward or flashed.
      # The windows-11-arm image's Explorer has a taskbar but refuses Shell_NotifyIcon(NIM_ADD) with E_FAIL, also
      # from a plain P/Invoke outside Runic, so the status icon runs on Windows x64 only.
      - name: Verify the Windows status icon with JIT and NativeAOT
        if: runner.os == 'Windows' && runner.arch == 'X64'
        timeout-minutes: 3
        shell: bash
        run: |
          dotnet tests/dotnet/Runic.Platform.Windows.Tests/bin/Release/net10.0/Runic.Platform.Windows.Tests.dll --treenode-filter "/*/*/*/*[Category=NativeStatusIcon]" --output detailed
          ./artifacts/clipboard-aot/Runic.Platform.Windows.Tests.exe --treenode-filter "/*/*/*/*[Category=NativeStatusIcon]" --output detailed
      # RegisterHotKey on the runner's desktop session: bind, SendInput reaching the hot key, conflicts and release.
      - name: Verify Windows global shortcuts with JIT and NativeAOT
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: bash
        run: |
          dotnet tests/dotnet/Runic.Platform.Windows.Tests/bin/Release/net10.0/Runic.Platform.Windows.Tests.dll --treenode-filter "/*/*/*/*[Category=NativeGlobalShortcuts]" --output detailed
          ./artifacts/clipboard-aot/Runic.Platform.Windows.Tests.exe --treenode-filter "/*/*/*/*[Category=NativeGlobalShortcuts]" --output detailed
      - name: Verify Windows window presentation with JIT and NativeAOT
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: bash
        run: |
          dotnet tests/dotnet/Runic.Platform.Windows.Tests/bin/Release/net10.0/Runic.Platform.Windows.Tests.dll --treenode-filter "/*/*/*/*[Category=NativePresentation]" --output detailed
          ./artifacts/clipboard-aot/Runic.Platform.Windows.Tests.exe --treenode-filter "/*/*/*/*[Category=NativePresentation]" --output detailed
      # Task dialogs owned by a window on a thread of the test, answered with the messages Return, Esc, the close button and
      # a click send; the case also reports which Common Controls 6 activation sources work in each runtime.
      - name: Verify Windows message boxes with JIT and NativeAOT
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: bash
        run: |
          dotnet tests/dotnet/Runic.Platform.Windows.Tests/bin/Release/net10.0/Runic.Platform.Windows.Tests.dll --treenode-filter "/*/*/*/*[Category=NativeMessageBoxes]" --output detailed
          ./artifacts/clipboard-aot/Runic.Platform.Windows.Tests.exe --treenode-filter "/*/*/*/*[Category=NativeMessageBoxes]" --output detailed
      # Badges and progress on the taskbar button of a shown window through ITaskbarList3; what the taskbar draws stays a
      # manual check.
      - name: Verify the Windows taskbar badge and progress with JIT and NativeAOT
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: bash
        run: |
          dotnet tests/dotnet/Runic.Platform.Windows.Tests/bin/Release/net10.0/Runic.Platform.Windows.Tests.dll --treenode-filter "/*/*/*/*[Category=NativeTaskbar]" --output detailed
          ./artifacts/clipboard-aot/Runic.Platform.Windows.Tests.exe --treenode-filter "/*/*/*/*[Category=NativeTaskbar]" --output detailed
      # The runner's connectivity hint and network path, read and watched without asserting the runner's network.
      - name: Verify network status with JIT and NativeAOT
        if: runner.os != 'Linux'
        timeout-minutes: 3
        shell: bash
        run: |
          dotnet tests/dotnet/Runic.Platform.${{ matrix.provider }}.Tests/bin/Release/net10.0/Runic.Platform.${{ matrix.provider }}.Tests.dll --treenode-filter "/*/*/*/*[Category=NativeNetwork]" --output detailed
          ./artifacts/clipboard-aot/Runic.Platform.${{ matrix.provider }}.Tests${{ matrix.extension }} --treenode-filter "/*/*/*/*[Category=NativeNetwork]" --output detailed
      - name: Verify NativeAOT GTK clipboard
        if: runner.os == 'Linux'
        timeout-minutes: 3
        # The run without a filter keeps the portable checks covered under NativeAOT.
        run: |
          artifacts/clipboard-aot/Runic.Platform.Linux.Tests
          GDK_BACKEND=x11 xvfb-run -a artifacts/clipboard-aot/Runic.Platform.Linux.Tests --treenode-filter "/*/*/*/*[Category=Native]"
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a artifacts/clipboard-aot/Runic.Platform.Linux.Tests --treenode-filter "/*/*/*/*[Category=NativeMessageBoxes]"
      - name: Verify NativeAOT clipboard
        if: runner.os != 'Linux'
        timeout-minutes: 3
        shell: bash
        run: ./artifacts/clipboard-aot/Runic.Platform.${{ matrix.provider }}.Tests${{ matrix.extension }} --treenode-filter "/*/*/*/*[Category=Native]"
      # The runner's Recycle Bin and Trash, with items unique to each run that the cases remove afterwards.
      - name: Verify the trash with JIT and NativeAOT
        if: runner.os != 'Linux'
        timeout-minutes: 3
        shell: bash
        run: |
          dotnet tests/dotnet/Runic.Platform.${{ matrix.provider }}.Tests/bin/Release/net10.0/Runic.Platform.${{ matrix.provider }}.Tests.dll --treenode-filter "/*/*/*/*[Category=NativeTrash]" --output detailed
          ./artifacts/clipboard-aot/Runic.Platform.${{ matrix.provider }}.Tests${{ matrix.extension }} --treenode-filter "/*/*/*/*[Category=NativeTrash]" --output detailed
      # The shell's thumbnail providers and Quick Look, on an image each case writes to a temporary directory.
      - name: Verify thumbnails with JIT and NativeAOT
        if: runner.os != 'Linux'
        timeout-minutes: 3
        shell: bash
        run: |
          dotnet tests/dotnet/Runic.Platform.${{ matrix.provider }}.Tests/bin/Release/net10.0/Runic.Platform.${{ matrix.provider }}.Tests.dll --treenode-filter "/*/*/*/*[Category=NativeThumbnails]" --output detailed
          ./artifacts/clipboard-aot/Runic.Platform.${{ matrix.provider }}.Tests${{ matrix.extension }} --treenode-filter "/*/*/*/*[Category=NativeThumbnails]" --output detailed
      # W310-004: disk images that the case creates, attaches and removes, with names unique to the run: a VHD through
      # diskpart on Windows (hosted runners run as an administrator, as diskpart needs) and DMGs through hdiutil on
      # macOS. The runner's own disks are only listed.
      - name: Verify volumes on disk images with JIT and NativeAOT
        if: runner.os != 'Linux'
        timeout-minutes: 10
        shell: bash
        env:
          RUNIC_TEST_VOLUMES_IMAGES: "1"
        run: |
          dotnet tests/dotnet/Runic.Platform.${{ matrix.provider }}.Tests/bin/Release/net10.0/Runic.Platform.${{ matrix.provider }}.Tests.dll --treenode-filter "/*/*/*/*[Category=NativeVolumes]" --output detailed
          ./artifacts/clipboard-aot/Runic.Platform.${{ matrix.provider }}.Tests${{ matrix.extension }} --treenode-filter "/*/*/*/*[Category=NativeVolumes]" --output detailed
      # Credential Manager and the runner's login keychain, under a service unique to each run.
      - name: Verify secret storage with JIT and NativeAOT
        if: runner.os != 'Linux'
        timeout-minutes: 3
        shell: bash
        run: |
          dotnet tests/dotnet/Runic.Platform.${{ matrix.provider }}.Tests/bin/Release/net10.0/Runic.Platform.${{ matrix.provider }}.Tests.dll --treenode-filter "/*/*/*/*[Category=NativeSecrets]" --output detailed
          ./artifacts/clipboard-aot/Runic.Platform.${{ matrix.provider }}.Tests${{ matrix.extension }} --treenode-filter "/*/*/*/*[Category=NativeSecrets]" --output detailed
      # The runner's associations read-only, then a type, extension and URL scheme unique to the run whose handlers the
      # case owns (a per-user registration of the test executable on Windows; two app bundles registered with Launch
      # Services on macOS), launched and removed afterwards.
      - name: Verify desktop applications with JIT and NativeAOT
        if: runner.os != 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          dotnet tests/dotnet/Runic.Platform.${{ matrix.provider }}.Tests/bin/Release/net10.0/Runic.Platform.${{ matrix.provider }}.Tests.dll --treenode-filter "/*/*/*/*[Category=NativeApplications]" --output detailed
          ./artifacts/clipboard-aot/Runic.Platform.${{ matrix.provider }}.Tests${{ matrix.extension }} --treenode-filter "/*/*/*/*[Category=NativeApplications]" --output detailed
      # Privileged actions: the XPC protocol, both code-signing checks, posix_spawn and Authorization Services with the
      # daemon served in the test process; then the NativeAOT executable as a root launch daemon in the system domain,
      # with real rights and a temporary administrator (the runner's passwordless sudo). SMAppService registration
      # needs a signed bundle and the user's approval, which CI cannot give.
      - name: Verify macOS privileged actions with JIT and NativeAOT
        if: runner.os == 'macOS'
        timeout-minutes: 10
        shell: bash
        # The daemon requires its clients to run with the hardened runtime; the linker's ad hoc signature has none.
        run: |
          codesign --force --sign - --options=runtime artifacts/clipboard-aot/Runic.Platform.MacOS.Tests
          status=0
          dotnet tests/dotnet/Runic.Platform.MacOS.Tests/bin/Release/net10.0/Runic.Platform.MacOS.Tests.dll --treenode-filter "/*/*/*/*[Category=NativePrivileged]" --output detailed || status=1
          ./artifacts/clipboard-aot/Runic.Platform.MacOS.Tests --treenode-filter "/*/*/*/*[Category=NativePrivileged]" --output detailed || status=1
          ./artifacts/clipboard-aot/Runic.Platform.MacOS.Tests --treenode-filter "/*/*/*/*[Category=NativePrivilegedRoot]" --output detailed || status=1
          exit $status
      - name: Publish and run platform runtime conformance with NativeAOT
        timeout-minutes: 10
        shell: bash
        run: |
          dotnet publish tests/dotnet/Runic.Platform.Runtime.Tests/Runic.Platform.Runtime.Tests.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/platform-runtime-aot
          ./artifacts/platform-runtime-aot/Runic.Platform.Runtime.Tests${{ matrix.extension }}
      # A real NSStatusItem without a window, its menu and actions, the unbundled login item, window presentation and
      # Carbon global shortcuts. The detailed output keeps the hot key findings the case reports without requiring them.
      - name: Verify macOS status item, login item and window presentation with JIT and NativeAOT
        if: runner.os == 'macOS'
        timeout-minutes: 8
        shell: bash
        run: |
          dotnet run --project tests/dotnet/Runic.Platform.Runtime.Tests -c Release -- --treenode-filter "/*/*/*/*[Category=NativeAppKit]" --output detailed
          ./artifacts/platform-runtime-aot/Runic.Platform.Runtime.Tests --treenode-filter "/*/*/*/*[Category=NativeAppKit]" --output detailed
      # W315-011: accent colour, Increase contrast and Reduce motion written before each process starts, and dark mode
      # switched through System Events while one runs. The script restores the preferences.
      - name: Verify macOS appearance preferences with JIT and NativeAOT
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: |
          eng/ci/macos-appearance.sh "dotnet tests/dotnet/Runic.Platform.Runtime.Tests/bin/Release/net10.0/Runic.Platform.Runtime.Tests.dll"
          eng/ci/macos-appearance.sh ./artifacts/platform-runtime-aot/Runic.Platform.Runtime.Tests
      # Open requests: odoc and GURL Apple events the test process sends itself, synthetic universal links through the
      # application delegate and NSURL bookmarks, then a bundle around the NativeAOT executable that registers itself
      # with LSRegisterURL and that LaunchServices launches with a document and with a URL (eng/ci/macos-open-probe.sh).
      - name: Verify macOS open events with JIT and NativeAOT
        if: runner.os == 'macOS'
        timeout-minutes: 8
        shell: bash
        run: |
          # macOS has no timeout(1); an alarm ends a run that hangs instead of the step's whole budget.
          deadline() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          dotnet build tests/dotnet/Runic.Platform.Runtime.Tests -c Release
          deadline 120 tests/dotnet/Runic.Platform.Runtime.Tests/bin/Release/net10.0/Runic.Platform.Runtime.Tests --treenode-filter "/*/*/*/*[Category=NativeOpenEvents]" --output detailed
          deadline 120 ./artifacts/platform-runtime-aot/Runic.Platform.Runtime.Tests --treenode-filter "/*/*/*/*[Category=NativeOpenEvents]" --output detailed
          deadline 240 eng/ci/macos-open-probe.sh artifacts/platform-runtime-aot
      # Files and URLs opened through the desktop's own registration reach the running instance, with a scheme unique
      # to the run: a desktop entry opened with gio in an isolated session without a display (Linux), and a per-user
      # URL protocol opened by the shell (Windows). CI runners only.
      - name: Verify open requests through desktop registration with JIT and NativeAOT
        if: runner.os != 'macOS'
        timeout-minutes: 8
        shell: bash
        env:
          RUNIC_TEST_OPEN_REGISTRATION: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then eng/ci/apt-install.sh libglib2.0-bin; fi
          dotnet build tests/dotnet/Runic.Platform.Runtime.Tests -c Release
          for tests in tests/dotnet/Runic.Platform.Runtime.Tests/bin/Release/net10.0/Runic.Platform.Runtime.Tests${{ matrix.extension }} artifacts/platform-runtime-aot/Runic.Platform.Runtime.Tests${{ matrix.extension }}; do
            if [ "$RUNNER_OS" = Linux ]; then
              session=$(mktemp -d)
              mkdir -p "$session/home" "$session/data" "$session/config" "$session/system-data" "$session/system-config" "$session/run"
              chmod 700 "$session/run"
              env -u DISPLAY -u WAYLAND_DISPLAY -u DBUS_SESSION_BUS_ADDRESS HOME="$session/home" XDG_DATA_HOME="$session/data" \
                XDG_CONFIG_HOME="$session/config" XDG_DATA_DIRS="$session/system-data" XDG_CONFIG_DIRS="$session/system-config" \
                XDG_RUNTIME_DIR="$session/run" dbus-run-session -- "$tests" --treenode-filter "/*/*/*/*[Category=NativeOpen]" --output detailed
              rm -rf "$session"
            else
              "$tests" --treenode-filter "/*/*/*/*[Category=NativeOpen]" --output detailed
            fi
          done
      # Real key events posted to the AppKit queue: the page sees each Command key before the View menu zooms;
      # Command and A, C, V copy and paste through the Edit menu, and Command and Q asks the close guard.
      - name: Exercise page zoom, Edit and Quit keys in the macOS window
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll --zoom
      # M1: Runic's application delegate (launched once), the Dock menu, reopen, and the quit Apple event refused by
      # ConfirmQuitAsync, refused by a close guard and accepted with no window open, after which Run returns.
      - name: Exercise the macOS application lifecycle and quit path
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll --lifecycle
      # M5: the represented file and edited state of the window, the recent documents, and Open Recent, whose chosen
      # document arrives as an open request.
      - name: Exercise macOS document conventions
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll --documents

      # M4: a Hidden title bar keeps its traffic lights, a mouse-down in a drag region drags the window and elsewhere
      # reaches the page, and a frameless window that cannot be resized becomes key and takes typed keys.
      - name: Exercise the macOS window chrome and drag regions
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll --window-chrome

      # D046.2: DesktopEventLoop.InvokeOnMainThreadAsync without a window: the main thread, a result, an exception,
      # cancellation, a call before the loop, and work while a context menu tracks.
      - name: Run windowless work on the macOS main thread
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll --main-thread
      # SEC-04: the WKWebView's navigation and UI delegate apply DesktopWebContentPolicy (external links, window.open,
      # downloads, isInspectable).
      - name: Apply the web content policy in the macOS window
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll --web-content
      - name: Prepare signed macOS sandbox fixture for manual permission evidence
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts/platform-sandbox/RunicPlatform.app/Contents/MacOS
          cp tests/native/platform-sandbox/Info.plist artifacts/platform-sandbox/RunicPlatform.app/Contents/Info.plist
          ditto artifacts/platform-runtime-aot artifacts/platform-sandbox/RunicPlatform.app/Contents/MacOS
          codesign --force --deep --sign - --entitlements tests/native/platform-sandbox/entitlements.plist artifacts/platform-sandbox/RunicPlatform.app
          codesign --verify --deep --strict artifacts/platform-sandbox/RunicPlatform.app
          tar -czf artifacts/platform-sandbox-${{ matrix.rid }}.tar.gz -C artifacts/platform-sandbox RunicPlatform.app
      # Security-scoped bookmarks in the App Sandbox: a file in the container round trips, moves and is deleted; a file
      # outside the container, which the user never chose, gets no bookmark (MacBookmarksNativeTests.RunSandboxProbe).
      - name: Verify security-scoped bookmarks in the macOS sandbox fixture
        if: runner.os == 'macOS'
        timeout-minutes: 3
        shell: bash
        run: |
          deadline() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          outside="$HOME/runic-bookmark-outside-$GITHUB_RUN_ID.txt"
          echo probe > "$outside"
          status=0
          deadline 90 artifacts/platform-sandbox/RunicPlatform.app/Contents/MacOS/Runic.Platform.Runtime.Tests --bookmark-probe "$outside" || status=$?
          rm -f "$outside"
          exit $status
      - name: Retain macOS sandbox permission fixture
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-sandbox-${{ matrix.rid }}-${{ github.run_id }}
          path: artifacts/platform-sandbox-${{ matrix.rid }}.tar.gz
          if-no-files-found: error
      - name: Publish and exercise WebView2 with NativeAOT
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet publish tests/native/Runic.Desktop.WebViewSmoke -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -p:TrimmerSingleWarn=false -o artifacts/webview-aot
          test ! -e artifacts/webview-aot/WebView2Loader.dll
          mkdir artifacts/webview-exe-only
          cp artifacts/webview-aot/Runic.Desktop.WebViewSmoke.exe artifacts/webview-exe-only/
          (cd artifacts/webview-exe-only && ./Runic.Desktop.WebViewSmoke.exe)
      # W315-017: the WebView2 window follows a live change of the monitor scale (100, 150, 175 %) through
      # WM_DPICHANGED, as when it moves to a monitor with another scale. The runner has one virtual monitor.
      # The monitors smoke (B12) runs again under NativeAOT here, for its display-configuration and window interop.
      - name: Exercise per-monitor DPI changes in the WebView2 window with JIT and NativeAOT, and monitors under NativeAOT
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: bash
        env:
          RUNIC_TEST_DISPLAY_SCALING: "1"
        run: |
          dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll --dpi
          (cd artifacts/webview-exe-only && ./Runic.Desktop.WebViewSmoke.exe --dpi)
          (cd artifacts/webview-exe-only && ./Runic.Desktop.WebViewSmoke.exe --monitors)
      # FirstWindow and the probes use the CS-WebUI host; menu-bar-probe drives the probe's in-page menu bar routes from Chromium.
      - name: Publish Window and View application with NativeAOT
        if: matrix.cswebui
        shell: bash
        run: |
          dotnet publish examples/first-window/FirstWindow.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/views-aot
          dotnet publish tests/fixtures/application/cswebui-window-probes/CsWebUiWindowProbes.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/views-probes-aot
          if [[ "$RUNNER_OS" == Linux ]]; then
            GDK_BACKEND=x11 xvfb-run -a ./artifacts/views-probes-aot/CsWebUiWindowProbes${{ matrix.extension }} --probe-factory-failure
            GDK_BACKEND=x11 xvfb-run -a ./artifacts/views-probes-aot/CsWebUiWindowProbes${{ matrix.extension }} --probe-window-close
            GDK_BACKEND=x11 xvfb-run -a ./artifacts/views-probes-aot/CsWebUiWindowProbes${{ matrix.extension }} --probe-close-guard
            GDK_BACKEND=x11 xvfb-run -a ./artifacts/views-probes-aot/CsWebUiWindowProbes${{ matrix.extension }} --probe-missing-bridge
            GDK_BACKEND=x11 xvfb-run -a ./artifacts/views-probes-aot/CsWebUiWindowProbes${{ matrix.extension }} --probe-show-failure
            GDK_BACKEND=x11 RUNIC_PROBE_EXECUTABLE="$(node -p 'require("node:path").resolve("artifacts/views-probes-aot/CsWebUiWindowProbes${{ matrix.extension }}")')" xvfb-run -a node tests/fixtures/application/cswebui-window-probes/menu-bar-probe.mjs
            GDK_BACKEND=x11 RUNIC_FIRST_WINDOW_EXECUTABLE="$(node -p 'require("node:path").resolve("artifacts/views-aot/FirstWindow${{ matrix.extension }}")')" xvfb-run -a node examples/first-window/browser-smoke.mjs
          else
            ./artifacts/views-probes-aot/CsWebUiWindowProbes${{ matrix.extension }} --probe-factory-failure
            ./artifacts/views-probes-aot/CsWebUiWindowProbes${{ matrix.extension }} --probe-window-close
            ./artifacts/views-probes-aot/CsWebUiWindowProbes${{ matrix.extension }} --probe-close-guard
            ./artifacts/views-probes-aot/CsWebUiWindowProbes${{ matrix.extension }} --probe-missing-bridge
            ./artifacts/views-probes-aot/CsWebUiWindowProbes${{ matrix.extension }} --probe-show-failure
            RUNIC_PROBE_EXECUTABLE="$(node -p 'require("node:path").resolve("artifacts/views-probes-aot/CsWebUiWindowProbes${{ matrix.extension }}")')" node tests/fixtures/application/cswebui-window-probes/menu-bar-probe.mjs
            RUNIC_FIRST_WINDOW_EXECUTABLE="$(node -p 'require("node:path").resolve("artifacts/views-aot/FirstWindow${{ matrix.extension }}")')" node examples/first-window/browser-smoke.mjs
          fi
      # Development tooling, independent of the architecture: Windows x64 runs it.
      - name: Verify Windows View IDE launch and framework reload
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: bash
        timeout-minutes: 10
        run: |
          npm --prefix examples/notes-reactive-views/Angular ci
          (cd examples/notes-reactive-views/Svelte && bun install --frozen-lockfile)
          dotnet build examples/notes-reactive-views/NotesReactiveViews.csproj -c Debug
          node examples/notes-reactive-views/ide-host-smoke.mjs
          RUNIC_HMR_FRONTEND=angular RUNIC_HMR_VIA_IDE=1 node examples/notes-reactive-views/hmr-smoke.mjs
      # The RID-specific and NativeAOT publishes download runtime and ILCompiler packs.
      - name: Check PackageDownload packages against their pinned hashes
        shell: bash
        run: bun eng/dependencies/package-downloads.mjs check

  # The native checks for the musl RIDs, in Alpine. GitHub cannot run JavaScript actions in an
  # Alpine container on arm64 runners, so the runner checks out and caches, and
  # eng/ci/native-musl.sh installs the toolchain and runs the checks in `docker run`.
  native-musl:
    name: Native / ${{ matrix.rid }}
    needs: plan
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'native-musl') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-musl-x64
          - os: ubuntu-24.04-arm
            rid: linux-musl-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      # Alpine 3.22, the oldest Alpine release that .NET 10 supports beyond November 2026.
      ALPINE_IMAGE: docker.io/library/alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-timeout-scale
      - uses: ./.github/actions/dependency-cache
        with:
          path: .cache/nuget
          key: nuget-native-musl-${{ matrix.rid }}-${{ hashFiles('**/packages.lock.json', '**/packages.*.lock.json', '**/Directory.Packages.props', 'global.json', 'NuGet.config') }}
          restore-keys: nuget-native-musl-${{ matrix.rid }}-
      # Ubuntu denies unconfined processes, such as the container's, capabilities in new user
      # namespaces; WebKitGTK's bubblewrap sandbox needs them. The container keeps Docker's
      # namespaces and drops only the seccomp filter that blocks unshare.
      # act passes no container engine socket into its jobs; eng/ci/README.md gives the local command.
      - name: Run the native checks in Alpine
        if: ${{ !env.ACT }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker run --rm --init --security-opt seccomp=unconfined --security-opt apparmor=unconfined --shm-size 1g \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -e NUGET_PACKAGES -e GITHUB_ACTIONS -e RUNIC_TEST_TIMEOUT_SCALE \
            "$ALPINE_IMAGE" sh eng/ci/native-musl.sh "$RID"
        env:
          RID: ${{ matrix.rid }}

  # W315-014, I-059: dotnet runic package (tools/dotnet-runic/Packaging) packages tests/native/Runic.Packaging.Probe on
  # each OS without the maintainers' signing credentials: an MSIX signed with a test certificate, an ad-hoc signed .app
  # with the hardened runtime in a disk image, and an unsigned Flatpak, AppImage, deb and rpm (built on Ubuntu,
  # installed in Fedora). Each package is installed and opened through its URL scheme, and the probe's receipt shows
  # what the package gives the application (eng/ci/packaging-probe-check.mjs): in the MSIX also its protocol
  # activation, its startup task turned on and off, and two files opened at once.
  packaging:
    name: Packaging / ${{ matrix.target }}
    needs: plan
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'packaging') }}
    # The planned legs of packagingLegs in eng/ci/platforms.mjs.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.packaging) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PROBE: tests/native/Runic.Packaging.Probe/Runic.Packaging.Probe.csproj
      TOOL: tools/dotnet-runic/Runic.Application.Tool.csproj
      # The Fedora image of the native job, which installs the rpm.
      FEDORA_IMAGE: docker.io/library/fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # node encodes the receipt URLs; nothing here runs npm or pnpm.
      - uses: ./.github/actions/setup-sdk
        with:
          nuget: packaging
          node: "true"
          package-managers: "false"
          install: "false"
      # dotnet runic package from this checkout; with --format json its payload is the only standard output.
      - name: Build dotnet runic
        run: dotnet build "$TOOL" -c Release -p:CI=true
        shell: bash
      # Windows installs only signed packages: a self-signed certificate whose subject is the probe's
      # RunicApplicationPublisher, trusted on this runner only, stands in for a code-signing certificate.
      - name: Package, install and open the MSIX
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $password = 'runic-packaging-test'
          $certificate = New-SelfSignedCertificate -Type Custom -Subject 'CN=Runic Packaging Test' -KeyUsage DigitalSignature `
            -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          Export-PfxCertificate -Cert $certificate -FilePath "$env:RUNNER_TEMP\packaging-test.pfx" `
            -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $certificate -FilePath "$env:RUNNER_TEMP\packaging-test.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\packaging-test.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $env:RUNIC_SIGNING_PASSWORD = $password
          dotnet run --no-build -c Release --project $env:TOOL -- package windows --project $env:PROBE --output-directory artifacts/package/windows `
            --certificate "$env:RUNNER_TEMP\packaging-test.pfx" --format json > "$env:RUNNER_TEMP\package.json"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP\package.json"; throw 'dotnet runic package windows failed' }
          $result = Get-Content "$env:RUNNER_TEMP\package.json" -Raw | ConvertFrom-Json
          if ($result.payloadType -ne 'runic.application.tool.package/1' -or $result.payload.packages.Count -ne 1 -or
              $result.payload.packages[0].format -ne 'msix' -or $result.payload.packages[0].signing -ne 'test' -or
              $result.payload.identity.id -ne 'org.runic.tests.PackagingProbe') { Get-Content "$env:RUNNER_TEMP\package.json"; throw 'Unexpected package payload' }
          if ((Get-Content "$env:RUNNER_TEMP\package.json" -Raw).Contains($password)) { throw 'The payload holds the signing password' }

          # The published WinExe outside the package: diagnostics reach a redirected standard error and the log.
          $receipt = "$env:RUNNER_TEMP\unpackaged.json"
          $probe = Start-Process -FilePath artifacts\package\windows\msix\Runic.Packaging.Probe.exe -Wait -PassThru `
            -ArgumentList "runic-packaging-probe://receipt?path=$([uri]::EscapeDataString($receipt))" -RedirectStandardError "$env:RUNNER_TEMP\stderr.txt"
          if ($probe.ExitCode -ne 0) { throw "The unpackaged probe exited with $($probe.ExitCode)" }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\stderr.txt" -Pattern 'packaging-probe' -Quiet)) { throw 'The WinExe wrote no diagnostic to the redirected standard error' }
          bun eng/ci/packaging-probe-check.mjs $receipt windows unpackaged
          if ($LASTEXITCODE -ne 0) { throw 'The unpackaged receipt failed' }

          $msix = Get-ChildItem artifacts\package\windows\*.msix | Select-Object -First 1
          Add-AppxPackage -Path $msix.FullName
          try {
            $receipt = "$env:RUNNER_TEMP\packaged.json"
            Start-Process "runic-packaging-probe://receipt?path=$([uri]::EscapeDataString($receipt))"
            for ($i = 0; $i -lt 60 -and -not (Test-Path $receipt); $i++) { Start-Sleep -Seconds 1 }
            if (-not (Test-Path $receipt)) { throw 'Opening the URL scheme did not start the packaged probe' }
            bun eng/ci/packaging-probe-check.mjs $receipt windows
            if ($LASTEXITCODE -ne 0) { throw 'The packaged receipt failed' }

            # Two files opened together, as Explorer opens a multiple selection: the shell's open verb on both items at
            # once (FolderItems.InvokeVerbEx). With MultiSelectModel="Player" one process gets both through GetLaunch.
            # (IApplicationActivationManager.ActivateForFile refuses full-trust applications.)
            $files = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\files" -Force
            'first' | Set-Content "$files\first.runicprobe"; 'second' | Set-Content "$files\second.runicprobe"
            $items = (New-Object -ComObject Shell.Application).NameSpace($files.FullName).Items()
            $items.Filter(0x40, '*.runicprobe')
            if ($items.Count -ne 2) { throw "The shell lists $($items.Count) probe files" }
            $items.InvokeVerbEx('open')
            $receipt = "$files\files-receipt.json"
            for ($i = 0; $i -lt 60 -and -not (Test-Path $receipt); $i++) { Start-Sleep -Seconds 1 }
            if (-not (Test-Path $receipt)) { throw 'Opening two files of the package did not start the probe' }
            # A second process, one per file, would rewrite the receipt with one file.
            Start-Sleep -Seconds 5
            bun eng/ci/packaging-probe-check.mjs $receipt windows files
            if ($LASTEXITCODE -ne 0) { throw 'The file activation receipt failed' }
          } finally {
            Get-AppxPackage -Name org.runic.tests.PackagingProbe | Remove-AppxPackage
          }
      - name: Package and open the .app and its disk image
        if: matrix.target == 'macos'
        shell: bash
        run: |
          # G-7: a library, a helper executable and data files beside the probe, also in a subdirectory, which the
          # package lays out (code in Contents/MacOS, the rest in Contents/Resources linked back) and signs inside out.
          extra="$RUNNER_TEMP/probe-extra"
          mkdir -p "$extra/plugins"
          printf 'int runic_probe(void) { return 1; }\n' | clang -dynamiclib -x c - -o "$extra/libprobe.dylib"
          printf 'int main(void) { return 0; }\n' | clang -x c - -o "$extra/probe-helper"
          cp "$extra/libprobe.dylib" "$extra/plugins/libplugin.dylib"
          echo probe > "$extra/probe-data.txt"
          echo '{}' > "$extra/plugins/plugin.json"
          RunicPackagingProbeExtraFiles="$extra" dotnet run --no-build -c Release --project "$TOOL" -- package macos --project "$PROBE" \
            --output-directory artifacts/package/macos --format json > "$RUNNER_TEMP/package.json"
          node -e '
            const { payload } = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const kinds = payload.packages.map(item => item.format + ":" + item.signing).join(",");
            if (payload.identity.id !== "org.runic.tests.PackagingProbe" || kinds !== "app:adhoc,dmg:none"
              || payload.warnings.map(item => item.code).join(",") !== "RAPPPKG2002")
              throw new Error("Unexpected package payload " + JSON.stringify(payload));' "$RUNNER_TEMP/package.json"
          app="artifacts/package/macos/Runic Packaging Probe.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Ad hoc, with the hardened runtime that notarization requires, also each nested library and executable,
          # which the linker had signed without it.
          codesign --display --verbose=2 "$app" 2>&1 | grep -E '^CodeDirectory .*flags=0x[0-9a-f]+\(adhoc,runtime\)'
          for code in libprobe.dylib probe-helper plugins/libplugin.dylib; do
            test -f "$app/Contents/MacOS/$code" && test ! -L "$app/Contents/MacOS/$code"
            codesign --verify --strict "$app/Contents/MacOS/$code"
            codesign --display --verbose=2 "$app/Contents/MacOS/$code" 2>&1 | grep -E '^CodeDirectory .*flags=0x[0-9a-f]+\(adhoc,runtime\)'
          done
          plutil -lint "$app/Contents/Info.plist"
          test -f "$app/Contents/Resources/icon.icns"
          test -f "$app/Contents/Resources/www/index.html"
          test ! -e "$app/Contents/MacOS/www"
          for data in probe-data.txt plugins/plugin.json; do
            test -f "$app/Contents/Resources/$data" && test -L "$app/Contents/MacOS/$data"
          done
          # Only Mach-O files (and links) in Contents/MacOS.
          test -z "$(find "$app/Contents/MacOS" -type f -exec sh -c 'file -b "$1" | grep -q Mach-O || echo "$1"' _ {} \;)"
          # The probe's .runicprobe type is its own, exported with the Owner rank.
          test "$(plutil -extract CFBundleDocumentTypes.0.LSHandlerRank raw "$app/Contents/Info.plist")" = Owner
          test "$(plutil -extract UTExportedTypeDeclarations.0.UTTypeIdentifier raw "$app/Contents/Info.plist")" = org.runic.tests.PackagingProbe.runicprobe
          mount="$RUNNER_TEMP/probe-dmg"
          eng/ci/hdiutil-attach.sh "artifacts/package/macos/Runic Packaging Probe-1.2.3.dmg" -mountpoint "$mount" -nobrowse -readonly
          test -d "$mount/Runic Packaging Probe.app" && test -L "$mount/Applications"
          codesign --verify --strict "$mount/Runic Packaging Probe.app"
          hdiutil detach "$mount"
          receipt="$RUNNER_TEMP/packaged.json"
          open -W -n "$app" --args "runic-packaging-probe://receipt?path=$(node -p 'encodeURIComponent(process.argv[1])' "$receipt")"
          bun eng/ci/packaging-probe-check.mjs "$receipt" macos
      # G-8: dotnet run on macOS starts the probe from its development bundle (Runic.Platform.MacOS's targets), an
      # ad-hoc signed .app in obj/ with the project's Info.plist that links the build output, so the process has its
      # bundle identifier. Its links point out of the bundle, so the signature is verified without --strict.
      - name: Run the probe from its development bundle
        if: matrix.target == 'macos'
        timeout-minutes: 10
        shell: bash
        run: |
          receipt="$RUNNER_TEMP/development.json"
          dotnet run -c Release -p:CI=true --project "$PROBE" -- "runic-packaging-probe://receipt?path=$(node -p 'encodeURIComponent(process.argv[1])' "$receipt")"
          bundle=tests/native/Runic.Packaging.Probe/obj/Release/net10.0/runic-macos/Runic.Packaging.Probe.app
          test -f "$bundle/Contents/MacOS/Runic.Packaging.Probe" && test ! -L "$bundle/Contents/MacOS/Runic.Packaging.Probe"
          test -L "$bundle/Contents/MacOS/Runic.Packaging.Probe.dll"
          plutil -lint "$bundle/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$bundle/Contents/Info.plist")" = org.runic.tests.PackagingProbe
          test "$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw "$bundle/Contents/Info.plist")" = runic-packaging-probe
          test "$(plutil -extract CFBundleDocumentTypes.0.LSHandlerRank raw "$bundle/Contents/Info.plist")" = Alternate
          codesign --verify --verbose=2 "$bundle"
          codesign --display --verbose=2 "$bundle" 2>&1 | tee "$RUNNER_TEMP/development-signature.txt"
          grep -qx 'Identifier=org.runic.tests.PackagingProbe' "$RUNNER_TEMP/development-signature.txt"
          grep -qE '^Info\.plist entries=[0-9]+' "$RUNNER_TEMP/development-signature.txt"
          bun eng/ci/packaging-probe-check.mjs "$receipt" macos development
          # RunicMacDevelopmentBundle=false starts the build output itself, without a bundle identifier.
          receipt="$RUNNER_TEMP/unbundled.json"
          dotnet run -c Release -p:CI=true -p:RunicMacDevelopmentBundle=false --project "$PROBE" -- \
            "runic-packaging-probe://receipt?path=$(node -p 'encodeURIComponent(process.argv[1])' "$receipt")"
          node -e 'const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (r.packageIdentity !== null) throw new Error("unbundled identity " + r.packageIdentity);' "$receipt"
      # D045.5, D045.6: the sandboxed Runic Desktop fixture (tests/native/Runic.Sandbox.Probe), packaged for the App
      # Sandbox (RunicMacSandbox) with its installer package. Both stay ad-hoc signed and unsigned: the maintainers'
      # Apple certificates and provisioning profiles are not in CI (I-101). The bundle's executable runs in the sandbox,
      # opens a window whose page answers over the loopback bridge, saves and bookmarks a file in its container, prints
      # the capability snapshot, and cannot write or bookmark a file outside the container. Then a document of the
      # container opens from its bookmark, saves three times through the item replacement directory and reopens from
      # the lease's bookmark in a second launch (A1).
      - name: Package and run the sandboxed Runic Desktop fixture
        if: matrix.target == 'macos'
        timeout-minutes: 15
        shell: bash
        env:
          SANDBOX_PROBE: tests/native/Runic.Sandbox.Probe/Runic.Sandbox.Probe.csproj
        run: |
          dotnet run --no-build -c Release --project "$TOOL" -- package macos --project "$SANDBOX_PROBE" --output-directory artifacts/package/sandbox \
            --pkg --format json > "$RUNNER_TEMP/sandbox-package.json"
          node -e '
            const { payload } = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const kinds = payload.packages.map(item => item.format + ":" + item.signing).join(",");
            if (payload.identity.id !== "org.runic.tests.SandboxProbe" || kinds !== "app:adhoc,dmg:none,pkg:none"
              || payload.warnings.map(item => item.code).join(",") !== "RAPPPKG2002,RAPPPKG2001")
              throw new Error("Unexpected package payload " + JSON.stringify(payload));' "$RUNNER_TEMP/sandbox-package.json"
          app="artifacts/package/sandbox/Runic Sandbox Probe.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --entitlements - --xml "$app" > "$RUNNER_TEMP/sandbox-entitlements.plist"
          for key in app-sandbox network.server network.client files.user-selected.read-write files.bookmarks.app-scope; do
            test "$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.$key" "$RUNNER_TEMP/sandbox-entitlements.plist")" = true
          done
          test "$(plutil -extract LSApplicationCategoryType raw "$app/Contents/Info.plist")" = public.app-category.developer-tools
          # The 1024 px icon (512 px at 2x) that the Mac App Store requires.
          iconutil -c iconset "$app/Contents/Resources/icon.icns" -o "$RUNNER_TEMP/sandbox-icon.iconset"
          test -f "$RUNNER_TEMP/sandbox-icon.iconset/icon_512x512@2x.png"
          # The product archive installs the same signed bundle in /Applications.
          pkgutil --expand-full "artifacts/package/sandbox/Runic Sandbox Probe-1.2.3.pkg" "$RUNNER_TEMP/sandbox-pkg"
          grep -q 'install-location="/Applications"' "$RUNNER_TEMP"/sandbox-pkg/*.pkg/PackageInfo
          codesign --verify --strict "$(echo "$RUNNER_TEMP"/sandbox-pkg/*.pkg/Payload/"Runic Sandbox Probe.app")"
          # macOS has no timeout(1); an alarm ends a run that hangs.
          deadline() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          outside="$HOME/runic-sandbox-outside-$GITHUB_RUN_ID.txt"
          echo probe > "$outside"
          status=0
          deadline 150 "$app/Contents/MacOS/Runic.Sandbox.Probe" --sandbox-probe "$outside" | tee "$RUNNER_TEMP/sandbox-probe.txt" || status=$?
          content=$(cat "$outside")
          rm -f "$outside"
          test "$status" = 0
          test "$content" = probe
          grep -qx SANDBOX_PROBE_OK "$RUNNER_TEMP/sandbox-probe.txt"
          deadline 150 "$app/Contents/MacOS/Runic.Sandbox.Probe" --document-probe | tee "$RUNNER_TEMP/document-probe.txt"
          grep -qx DOCUMENT_PROBE_OK "$RUNNER_TEMP/document-probe.txt"
          deadline 150 "$app/Contents/MacOS/Runic.Sandbox.Probe" --document-reopen | tee "$RUNNER_TEMP/document-reopen.txt"
          grep -qx DOCUMENT_REOPEN_OK "$RUNNER_TEMP/document-reopen.txt"
      # The GNOME runtime and SDK come from Flathub, cached by their branch.
      # flatpak-builder composes the AppStream data with appstream-compose, which reads the SVG icon through
      # librsvg's image loader.
      - name: Install flatpak-builder
        if: matrix.target == 'flatpak' || matrix.target == 'flathub'
        uses: ./.github/actions/apt-install
        with:
          packages: flatpak flatpak-builder appstream appstream-compose librsvg2-common desktop-file-utils
          install-recommends: "false"
      - name: Prepare Flatpak
        if: matrix.target == 'flatpak' || matrix.target == 'flathub'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      # The flathub leg adds the .NET and Node.js SDK extensions to the GNOME runtime and SDK.
      - uses: ./.github/actions/dependency-cache
        if: matrix.target == 'flatpak' || matrix.target == 'flathub'
        with:
          path: |
            ~/.local/share/flatpak/runtime
            ~/.local/share/flatpak/repo
          key: flatpak-gnome-50-${{ matrix.target == 'flathub' && 'flathub-' || '' }}${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/Runic.Application.Templates/content/runic-app/packaging/linux/flatpak.yml') }}
          restore-keys: flatpak-gnome-50-${{ matrix.target == 'flathub' && 'flathub-' || '' }}${{ runner.os }}-${{ runner.arch }}-
      - name: Package, install and open the Flatpak
        if: matrix.target == 'flatpak'
        run: |
          dotnet run --no-build -c Release --project "$TOOL" -- package flatpak --project "$PROBE" --output-directory artifacts/package/flatpak
          flatpak install --user -y --noninteractive --bundle artifacts/package/flatpak/org.runic.tests.PackagingProbe.flatpak
          entry=~/.local/share/flatpak/exports/share/applications/org.runic.tests.PackagingProbe.desktop
          desktop-file-validate "$entry"
          grep -qx 'MimeType=x-scheme-handler/runic-packaging-probe;application/x-packagingprobe-runicprobe;' "$entry"
          grep -qx 'DBusActivatable=true' "$entry"
          # The file type's MIME definition and the D-Bus service file are exported with the entry.
          grep -q 'glob pattern="\*.runicprobe"' ~/.local/share/flatpak/exports/share/mime/packages/org.runic.tests.PackagingProbe.xml
          grep -qx 'Name=org.runic.tests.PackagingProbe' ~/.local/share/flatpak/exports/share/dbus-1/services/org.runic.tests.PackagingProbe.service
          test -f ~/.local/share/flatpak/exports/share/icons/hicolor/scalable/apps/org.runic.tests.PackagingProbe.svg
          receipts="$RUNNER_TEMP/receipts"
          mkdir -p "$receipts"
          flatpak run --user --filesystem="$receipts" org.runic.tests.PackagingProbe \
            "runic-packaging-probe://receipt?path=$(node -p 'encodeURIComponent(process.argv[1])' "$receipts/packaged.json")"
          bun eng/ci/packaging-probe-check.mjs "$receipts/packaged.json" flatpak
          flatpak uninstall --user -y --noninteractive org.runic.tests.PackagingProbe
      # The AppImage leg: appimagetool and the type2 runtime, pinned by release and SHA-256, so packaging downloads
      # nothing. The AppImage uses the host's GTK and WebKitGTK (D039.15); appimagetool validates the metainfo with
      # appstreamcli. Both AppImages run with APPIMAGE_EXTRACT_AND_RUN, because the runner has no FUSE 2.
      - name: Install the AppImage tools
        if: matrix.target == 'appimage'
        uses: ./.github/actions/apt-install
        with:
          packages: appstream desktop-file-utils libgtk-3-0t64 libwebkit2gtk-4.1-0
          install-recommends: "false"
      - name: Download appimagetool and the AppImage runtime
        if: matrix.target == 'appimage'
        env:
          APPIMAGETOOL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          APPIMAGE_RUNTIME: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          tools="$RUNNER_TEMP/appimage-tools"
          mkdir -p "$tools"
          eng/ci/retry.sh 3 120 curl -fsSL -o "$tools/appimagetool" "$APPIMAGETOOL"
          eng/ci/retry.sh 3 120 curl -fsSL -o "$tools/runtime-x86_64" "$APPIMAGE_RUNTIME"
          printf '%s  %s\n' "$APPIMAGETOOL_SHA256" "$tools/appimagetool" "$APPIMAGE_RUNTIME_SHA256" "$tools/runtime-x86_64" | sha256sum -c -
          chmod +x "$tools/appimagetool"
          echo "$tools" >> "$GITHUB_PATH"
      - name: Package and open the AppImage
        if: matrix.target == 'appimage'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          dotnet run --no-build -c Release --project "$TOOL" -- package appimage --project "$PROBE" --output-directory artifacts/package/appimage
          appimage="$PWD/artifacts/package/appimage/Runic_Packaging_Probe-1.2.3-x86_64.AppImage"
          test -x "$appimage"
          # The desktop entry and icon at the AppDir's root; an AppImage is not D-Bus activatable.
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract >/dev/null)
          root="$RUNNER_TEMP/squashfs-root"
          desktop-file-validate "$root/org.runic.tests.PackagingProbe.desktop"
          grep -qx 'MimeType=x-scheme-handler/runic-packaging-probe;application/x-packagingprobe-runicprobe;' "$root/org.runic.tests.PackagingProbe.desktop"
          if grep -q '^DBusActivatable' "$root/org.runic.tests.PackagingProbe.desktop"; then exit 1; fi
          test -f "$root/org.runic.tests.PackagingProbe.png" && test -x "$root/AppRun"
          test -f "$root/usr/share/metainfo/org.runic.tests.PackagingProbe.appdata.xml"
          receipts="$RUNNER_TEMP/receipts"
          mkdir -p "$receipts"
          "$appimage" --appimage-extract-and-run \
            "runic-packaging-probe://receipt?path=$(node -p 'encodeURIComponent(process.argv[1])' "$receipts/appimage.json")"
          bun eng/ci/packaging-probe-check.mjs "$receipts/appimage.json" appimage
      # The deb leg installs the package's dependencies through the bounded apt path first, so dpkg -i checks that its
      # Depends names exist and are satisfied on Ubuntu 24.04.
      - name: Install the deb dependencies
        if: matrix.target == 'deb'
        uses: ./.github/actions/apt-install
        with:
          packages: desktop-file-utils xdg-utils libgtk-3-0t64 libwebkit2gtk-4.1-0
          install-recommends: "false"
      - name: Package, install and open the deb
        if: matrix.target == 'deb'
        run: |
          dotnet run --no-build -c Release --project "$TOOL" -- package deb --project "$PROBE" --output-directory artifacts/package/deb
          deb=artifacts/package/deb/runic.packaging.probe_1.2.3_amd64.deb
          test "$(dpkg-deb -f "$deb" Depends)" = 'libc6, libgtk-3-0t64 | libgtk-3-0, libwebkit2gtk-4.1-0'
          sudo dpkg -i "$deb"
          entry=/usr/share/applications/org.runic.tests.PackagingProbe.desktop
          desktop-file-validate "$entry"
          grep -qx 'MimeType=x-scheme-handler/runic-packaging-probe;application/x-packagingprobe-runicprobe;' "$entry"
          grep -qx 'DBusActivatable=true' "$entry"
          grep -qx 'Exec=/usr/bin/Runic.Packaging.Probe' /usr/share/dbus-1/services/org.runic.tests.PackagingProbe.service
          test -f /usr/share/icons/hicolor/scalable/apps/org.runic.tests.PackagingProbe.svg
          sudo update-desktop-database /usr/share/applications
          test "$(xdg-mime query default x-scheme-handler/runic-packaging-probe)" = org.runic.tests.PackagingProbe.desktop
          receipts="$RUNNER_TEMP/receipts"
          mkdir -p "$receipts"
          # The registered handler's Exec line with the URL for %U, as a desktop starts it without D-Bus activation (gio
          # would activate it over D-Bus, which the probe does not serve; xdg-open needs a display).
          url="runic-packaging-probe://receipt?path=$(node -p 'encodeURIComponent(process.argv[1])' "$receipts/deb.json")"
          exec_line=$(sed -n 's/^Exec=//p' "$entry")
          test "$exec_line" = 'Runic.Packaging.Probe %U'
          "${exec_line% %U}" "$url"
          for _ in $(seq 60); do test -f "$receipts/deb.json" && break; sleep 1; done
          bun eng/ci/packaging-probe-check.mjs "$receipts/deb.json" deb
          sudo dpkg -r runic.packaging.probe
      # The rpm leg builds on Ubuntu with rpmbuild and installs in the Fedora container, whose packages download with a
      # time limit and are cached (eng/ci/README.md, "Fedora packages").
      - name: Install rpmbuild
        if: matrix.target == 'rpm'
        uses: ./.github/actions/apt-install
        with:
          packages: rpm desktop-file-utils
          install-recommends: "false"
      - name: Package the rpm
        if: matrix.target == 'rpm'
        run: |
          dotnet run --no-build -c Release --project "$TOOL" -- package rpm --project "$PROBE" --output-directory artifacts/package/rpm
          rpm=artifacts/package/rpm/runic.packaging.probe-1.2.3-1.x86_64.rpm
          # Only WebKitGTK: automatic dependencies are off, because the NativeAOT binary loads GTK with dlopen.
          test "$(rpm -qp --requires "$rpm" | grep -v '^rpmlib(')" = webkit2gtk4.1
      - name: Prepare the Fedora package cache
        id: dnf
        if: matrix.target == 'rpm'
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /var/cache/runic-dnf
          prefix="dnf-packaging-$(printf '%s' "$FEDORA_IMAGE" | sha256sum | cut -c1-16)-$RUNNER_ARCH-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/dependency-cache
        if: matrix.target == 'rpm'
        with:
          path: /var/cache/runic-dnf
          key: ${{ steps.dnf.outputs.key }}
          restore-keys: ${{ steps.dnf.outputs.prefix }}
      - name: Install and open the rpm in Fedora
        if: matrix.target == 'rpm'
        timeout-minutes: 10
        run: |
          receipts="$RUNNER_TEMP/receipts"
          mkdir -p "$receipts"
          eng/ci/retry.sh 2 90 docker pull -q "$FEDORA_IMAGE"
          docker run --rm --init -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$receipts:$receipts" -v /var/cache/runic-dnf:/var/cache/libdnf5 \
            -w "$GITHUB_WORKSPACE" "$FEDORA_IMAGE" bash eng/ci/packaging-rpm.sh artifacts/package/rpm/runic.packaging.probe-1.2.3-1.x86_64.rpm \
            "runic-packaging-probe://receipt?path=$(node -p 'encodeURIComponent(process.argv[1])' "$receipts/rpm.json")"
          bun eng/ci/packaging-probe-check.mjs "$receipts/rpm.json" rpm
      # The flathub leg: a git repository of tests/fixtures/flathub, whose manifest dotnet runic package flathub writes
      # with sources from its committed lock files (D039.17) and builds as Flathub does: the runtime and SDK extensions,
      # then every source, then the build without network access. The bundle is installed and opened.
      - name: Generate, build offline, install and open the Flathub manifest
        if: matrix.target == 'flathub'
        run: |
          source="$RUNNER_TEMP/flathub-source"
          cp -R tests/fixtures/flathub "$source"
          cp -R tools/Runic.Application.Templates/content/runic-app/icons "$source/App/icons"
          git -C "$source" init -q
          git -C "$source" add -A
          git -C "$source" -c user.name=CI -c user.email=ci@invalid commit -qm "Flathub fixture"
          output="$RUNNER_TEMP/flathub"
          dotnet run --no-build -c Release --project "$TOOL" -- package flathub --project "$source/App" --git-url "file://$source" \
            --git-commit "$(git -C "$source" rev-parse HEAD)" --build --output-directory "$output" --format json > "$RUNNER_TEMP/flathub.json"
          node -e '
            const { payload } = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const kinds = payload.packages.map(item => item.format + ":" + item.signing).join(",");
            if (payload.identity.id !== "org.runic.tests.FlathubProbe" || kinds !== "flathub-manifest:none,flatpak:none")
              throw new Error("Unexpected package payload " + JSON.stringify(payload));' "$RUNNER_TEMP/flathub.json"
          grep -q 'microsoft.dotnet.ilcompiler' "$output/nuget-sources.json"
          grep -q 'is-number-7.0.0' "$output/npm-sources.json"
          flatpak install --user -y --noninteractive --bundle "$output/org.runic.tests.FlathubProbe.flatpak"
          receipts="$RUNNER_TEMP/receipts"
          mkdir -p "$receipts"
          flatpak run --user --filesystem="$receipts" org.runic.tests.FlathubProbe \
            "runic-flathub-probe://receipt?path=$(node -p 'encodeURIComponent(process.argv[1])' "$receipts/flathub.json")"
          node -e '
            const receipt = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (receipt.applicationId !== "org.runic.tests.FlathubProbe" || receipt.contentRoot !== "/app/lib/FlathubProbe/www"
              || !receipt.contentRootHasIndex || !receipt.frontendDependency || !receipt.url.startsWith("runic-flathub-probe://receipt"))
              throw new Error("The Flathub receipt failed: " + JSON.stringify(receipt));
            console.log("PACKAGING_OK|flathub|package|" + receipt.applicationId);' "$receipts/flathub.json"
          flatpak uninstall --user -y --noninteractive org.runic.tests.FlathubProbe

  # I-074: what NVDA (WebView2, and a WPF RunicWebView since I-203) and Orca (WebKitGTK, GTK 3 and GTK 4) say while the
  # accessibility probe reads and changes the accessibility fixture, as the native job's macOS leg checks VoiceOver. The
  # probe starts the screen reader before the page opens and quits it (Runic.Desktop.AccessibilityProbe/SpeechScenario.cs);
  # Expectations.cs lists what each one is known not to say. NVDA logs its speech with the silence synthesizer; Orca speaks through a Speech Dispatcher
  # whose output module writes each utterance to a file. Narrator stays a manual check.
  screen-readers:
    name: Screen reader / ${{ matrix.reader }}
    needs: plan
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'screen-readers') }}
    # The planned legs of screenReaderLegs in eng/ci/platforms.mjs.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.screen-readers) }}
    runs-on: ${{ matrix.os }}
    # The checks take a few minutes; apt-install.sh may retry a stalled mirror for up to half an hour.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          nuget: native
          install: "false"
      - name: Install Orca and the native WebView prerequisites
        if: matrix.reader == 'orca'
        run: |
          eng/ci/apt-install.sh libwebkit2gtk-4.1-0 libwebkitgtk-6.0-4 xvfb dbus-x11 at-spi2-core orca
          eng/ci/permit-webkit-sandbox.sh
          dpkg-query -W orca speech-dispatcher libwebkit2gtk-4.1-0 libwebkitgtk-6.0-4
      - name: Install a portable NVDA
        if: matrix.reader == 'nvda'
        timeout-minutes: 5
        shell: pwsh
        run: eng/ci/windows-nvda.ps1 -Destination "$env:RUNNER_TEMP\nvda"
      - name: Build the accessibility fixture and probe
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            dotnet build tests/native/Runic.Desktop.WebViewSmoke -c Release
            dotnet build tests/native/Runic.Desktop.AccessibilityProbe -c Release -f net10.0-windows
            dotnet build tests/dotnet/Runic.Application.Views.Wpf.Windows.Tests -c Release
          else
            dotnet build tests/native/Runic.Desktop.Gtk4.Smoke -c Release
            dotnet build tests/native/Runic.Desktop.AccessibilityProbe -c Release -f net10.0
          fi
      - name: Check what the screen reader says in the embedded window
        timeout-minutes: 12
        shell: bash
        run: |
          mkdir -p artifacts/screen-reader
          if [[ "$RUNNER_OS" == Windows ]]; then
            dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll --accessibility \
              --probe "$PWD/tests/native/Runic.Desktop.AccessibilityProbe/bin/Release/net10.0-windows/Runic.Desktop.AccessibilityProbe.exe" \
              --screen-reader nvda --nvda "$RUNNER_TEMP/nvda/nvda.exe" --receipt artifacts/screen-reader/webview2.json
            # The same page in a WPF window's RunicWebView, which announces through WpfPlatformServices (I-203).
            dotnet run --project tests/dotnet/Runic.Application.Views.Wpf.Windows.Tests -c Release --no-build -- \
              --treenode-filter "/*/*/*/*[Category=ScreenReader]" --output detailed \
              --test-parameter probe="$PWD/tests/native/Runic.Desktop.AccessibilityProbe/bin/Release/net10.0-windows/Runic.Desktop.AccessibilityProbe.exe" \
              --test-parameter nvda="$RUNNER_TEMP/nvda/nvda.exe" --test-parameter receipt="$PWD/artifacts/screen-reader/wpf/wpf.json"
            exit
          fi
          probe=(dotnet "$PWD/tests/native/Runic.Desktop.AccessibilityProbe/bin/Release/net10.0/Runic.Desktop.AccessibilityProbe.dll")
          for toolkit in gtk3 gtk4; do
            GDK_BACKEND=x11 GSETTINGS_BACKEND=memory dbus-run-session -- xvfb-run -a dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke \
              -c Release --no-build -- --accessibility "$toolkit" --probe "${probe[@]}" --screen-reader orca \
              --receipt "artifacts/screen-reader/$toolkit/$toolkit.json"
          done
      - name: Retain screen reader receipts and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screen-reader-${{ matrix.reader }}-${{ github.run_id }}
          path: artifacts/screen-reader
          if-no-files-found: ignore

  verify:
    name: verify
    if: always()
    needs: [plan, native-libraries, build, managed, web, node-26, engineering, views, package-consumers, wpf, templates, native, native-musl, packaging, screen-readers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: eng/ci/gate.mjs
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Require every planned verification job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIP: ${{ needs.plan.outputs.skip }}
          PLATFORMS: ${{ needs.plan.outputs.platforms }}
          WHY: ${{ needs.plan.outputs.why }}
        run: bun eng/ci/gate.mjs
      # Marks this base and tree as passed, so a merge queue entry testing the same code reuses this
      # run (the plan job's Reuse note). Fork pull requests and other events leave no marker. A failed
      # upload only means the queue entry runs its full plan, so it does not fail the check.
      - name: Mark the tested base and tree as passed
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.plan.outputs.tested-tree != '' }}
        env:
          RUN_ID: ${{ github.run_id }}
        run: echo "$RUN_ID" > "$RUNNER_TEMP/ci-passed"
      - name: Upload the passed marker
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.plan.outputs.tested-tree != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-passed-${{ needs.plan.outputs.tested-base }}-${{ needs.plan.outputs.tested-tree }}
          path: ${{ runner.temp }}/ci-passed
          if-no-files-found: error
          overwrite: true
          retention-days: 7
          compression-level: 0
