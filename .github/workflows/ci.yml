name: SDK CI
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue's entries (eng/ci/README.md, "Merge queue"); `verify` is the required check.
  merge_group:
    types: [checks_requested]
  # Nightly, every job on every platform; eng/release/ci-run.mjs accepts such a run for a release.
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a pull request cancels its running CI. Pushes to main queue; each merge
# queue entry has its own ref (gh-readonly-queue/main/pr-<n>-<sha>), so entries neither cancel
# each other nor pull request runs. A scheduled or manual run has its own group, so a later
# push cannot replace it while it waits.
concurrency:
  group: sdk-ci-${{ github.workflow }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CONFIGURATION: Release
  NUGET_PACKAGES: ${{ github.workspace }}/.cache/nuget
jobs:
  # Pull requests and merge queue entries run the jobs whose inputs changed and the Windows and
  # macOS legs those changes need (eng/ci/plan.mjs, eng/ci/platforms.mjs). Pushes to main run every Linux job
  # and the legs their before..after diff needs; scheduled and manual runs, and pull requests
  # labelled ci:all-platforms, run everything. A merge queue entry that a passed pull request run
  # already tested (same base, same tree) runs nothing, not even build and engineering. Planned
  # skips still report, and `verify` accepts a skipped job only when this plan skipped it.
  plan:
    name: Plan affected jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # The labels are read when the plan runs, so rerunning all jobs sees a label added since.
      pull-requests: read
      # A merge queue entry looks up the passed pull request run it can reuse.
      actions: read
    outputs:
      managed: ${{ steps.plan.outputs.managed }}
      web: ${{ steps.plan.outputs.web }}
      frameworks: ${{ steps.plan.outputs.frameworks }}
      native: ${{ steps.plan.outputs.native }}
      wpf: ${{ steps.plan.outputs.wpf }}
      packaging: ${{ steps.plan.outputs.packaging }}
      screen-readers: ${{ steps.plan.outputs.screen-readers }}
      platforms: ${{ steps.plan.outputs.platforms }}
      why: ${{ steps.plan.outputs.why }}
      skip: ${{ steps.plan.outputs.skip }}
      # A same-repository pull request run's merge commit: its base parent and tree, which name the
      # marker `verify` uploads when it passes. Empty for other runs.
      tested-base: ${{ steps.plan.outputs.tested-base }}
      tested-tree: ${{ steps.plan.outputs.tested-tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request merge commit and its base parent, the pushed or queued commit and its parent.
          fetch-depth: 2
      - uses: ./.github/actions/setup-sdk
        with:
          dotnet: "false"
          install: "false"
      # A pull_request checkout is GitHub's merge commit; its first parent is the base
      # branch, so the diff is exactly what the pull request changes. A push compares the
      # commit main was at before it. A merge queue entry compares its merge group's base
      # (main, or the entry ahead of it in the queue) and, having no labels, plans like an
      # unlabelled pull request. The base checkout's planner, component map and platform
      # rules decide what is affected, so a change cannot narrow its own plan; this
      # checkout then enumerates the suites and legs. Without a usable diff, or when the
      # labels cannot be read, everything runs.
      # Reuse: a squash queue entry on base B has the same tree as the pull request's merge
      # commit on B. When a pull request run passed `verify` for that base and tree (its marker
      # artifact ci-passed-<base>-<tree>), the entry tests identical code and runs nothing. The
      # artifact only names candidates: the run it belongs to must be a ci.yml pull_request run
      # from this repository whose `verify` job succeeded. A failed lookup plans as usual, so it
      # can only run more, never skip more. The push run on main after the merge is unchanged.
      - name: Plan jobs from the changed files
        id: plan
        # shell: bash adds pipefail, so a failed git diff cannot become an empty change list.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          LABEL: ci:all-platforms
        run: |
          base=
          options=()
          reused=
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            if git rev-parse --verify --quiet HEAD^2 > /dev/null; then
              base=HEAD^1
              # Fork pull requests leave no marker.
              if [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
                echo "tested-base=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
                echo "tested-tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
              fi
            fi
            if ! labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST/labels" --jq '.[].name'); then
              options=(--all-platforms "the pull request's labels could not be read")
            elif grep -qxF "$LABEL" <<< "$labels"; then
              options=(--all-platforms "label $LABEL")
            fi
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            options=(--all-linux)
            if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]] \
              && { [[ "$(git rev-parse HEAD^1 2> /dev/null)" == "$BEFORE" ]] || git fetch --quiet --no-tags --depth=1 origin "$BEFORE"; }; then
              base=$BEFORE
            fi
          elif [[ "$GITHUB_EVENT_NAME" == merge_group ]]; then
            if [[ "$QUEUE_BASE" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$QUEUE_HEAD" ]] \
              && { [[ "$(git rev-parse HEAD^1 2> /dev/null)" == "$QUEUE_BASE" ]] || git fetch --quiet --no-tags --depth=1 origin "$QUEUE_BASE"; }; then
              base=$QUEUE_BASE
              if tree=$(git rev-parse --verify 'HEAD^{tree}') \
                && runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-passed-$base-$tree&per_page=100" \
                  --jq '.artifacts[] | select(.expired | not) | .workflow_run.id'); then
                for run in $runs; do
                  if [[ "$run" =~ ^[0-9]+$ ]] \
                    && info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
                      --jq '.event, (.path | sub("@.*$"; "")), (.head_repository.full_name // ""), .html_url') \
                    && { read -r event; read -r path; read -r repository; read -r url; } <<< "$info" \
                    && [[ "$event" == pull_request && "$path" == .github/workflows/ci.yml && "$repository" == "$GITHUB_REPOSITORY" ]] \
                    && verified=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" \
                      --jq '.jobs[] | select(.name == "verify") | .conclusion') \
                    && [[ "$verified" == success ]]; then
                    reused=$url
                    break
                  fi
                done
              fi
            fi
          fi
          if [[ -n "$reused" ]]; then
            bun eng/ci/plan.mjs --reused "$reused" >> "$GITHUB_OUTPUT"
          elif [[ -n "$base" ]] && git worktree add --detach "$RUNNER_TEMP/base" "$base" \
            && affected=$(git diff --name-only --no-renames -z "$base" HEAD | bun "$RUNNER_TEMP/base/eng/ci/plan.mjs" --affected); then
            bun eng/ci/plan.mjs --plan "$affected" "${options[@]}" >> "$GITHUB_OUTPUT"
          else
            reason="$GITHUB_EVENT_NAME run"
            if [[ "$GITHUB_EVENT_NAME" =~ ^(push|pull_request|merge_group)$ ]]; then reason+=" without a usable diff"; fi
            bun eng/ci/plan.mjs --all "$reason" >> "$GITHUB_OUTPUT"
          fi
  # build and engineering run in every plan except a merge queue entry's reuse of a passed pull
  # request run (eng/ci/plan.mjs, reusedSkip).
  # The native Desktop server's libraries for every runtime identifier, which the packages carry
  # (Runic.Desktop.NativeServer, Runic.Desktop.NativeServer.Static.<rid>). Cached by the crate's tree, so an unchanged
  # server costs one cache restore per runtime identifier.
  native-libraries:
    name: Native server libraries
    needs: plan
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'native-libraries') }}
    uses: ./.github/workflows/native-libraries.yml
  build:
    name: Build shared SDK inputs
    needs: [plan, native-libraries]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'build') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - name: Restore managed dependencies
        run: dotnet restore RunicSdk.Core.slnx --locked-mode
      - name: Build managed SDK, tools and test executables
        run: bun eng/run.mjs build-core
      - name: Build web packages
        run: bun eng/run.mjs build-web
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
      - name: Archive reusable Linux build outputs
        run: bun eng/ci/build-artifact.mjs create
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-build-${{ github.run_id }}
          path: artifacts/ci-build
          if-no-files-found: error
          overwrite: true
          retention-days: 30
          # The archive is already zstd-compressed.
          compression-level: 0
      # Package candidates come from the same build, after its outputs are archived, independently
      # of test results. Package consumers, templates and the WPF lane download them.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runic-server-*
          path: artifacts/native/runic-server
      - name: Lay out the native server libraries by runtime identifier
        run: |
          cd artifacts/native/runic-server
          for directory in runic-server-*; do mv "$directory" "${directory#runic-server-}"; done
      - name: Pack the verified build inputs
        env:
          # Every runtime identifier's native server library, or the pack fails.
          RUNIC_NATIVE_SERVER_REQUIRE_ALL_RUNTIMES: "true"
        run: bun eng/run.mjs pack-built
      # PackageDownload packages (the validation baselines, the WindowsDesktop targeting pack) are
      # outside the NuGet lock files; eng/dependencies/package-downloads.json pins their content hashes.
      - name: Check PackageDownload packages against their pinned hashes
        run: bun eng/dependencies/package-downloads.mjs check
      - name: Verify shipped template lock integrity
        run: bun eng/release/verify-template-locks.mjs
      - name: Check generated files and lockfile after packing
        run: bun eng/ci/source-state.mjs check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  # One job runs the planned managed groups (managedGroups in eng/ci/plan.mjs) as named steps. A
  # group also runs after another one failed, so one run reports every failing group.
  managed:
    name: Managed tests
    needs: [plan, build]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'managed') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - uses: ./.github/actions/restore-build
        id: restore
      # TRX reports and Cobertura coverage of the TUnit suites (CONTRIBUTING.md), per group. The TRX
      # extension also copies the HTML and Cobertura reports into a _<machine>_<time> attachments folder.
      - name: Run the platform managed suites
        id: platform
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && contains(fromJSON(needs.plan.outputs.managed), 'platform') }}
        timeout-minutes: 25
        run: bun eng/ci/test-managed.mjs platform
      - name: Retain platform test results
        if: ${{ always() && steps.platform.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-test-results-platform-${{ github.run_id }}
          path: |
            artifacts/test-results/platform
            !artifacts/test-results/platform/*/_*
          if-no-files-found: ignore
          overwrite: true
      - name: Run the assets managed suites
        id: assets
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && contains(fromJSON(needs.plan.outputs.managed), 'assets') }}
        timeout-minutes: 25
        run: bun eng/ci/test-managed.mjs assets
      - name: Retain assets test results
        if: ${{ always() && steps.assets.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-test-results-assets-${{ github.run_id }}
          path: |
            artifacts/test-results/assets
            !artifacts/test-results/assets/*/_*
          if-no-files-found: ignore
          overwrite: true
      - name: Run the navigation managed suites
        id: navigation
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && contains(fromJSON(needs.plan.outputs.managed), 'navigation') }}
        timeout-minutes: 25
        run: bun eng/ci/test-managed.mjs navigation
      - name: Retain navigation test results
        if: ${{ always() && steps.navigation.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-test-results-navigation-${{ github.run_id }}
          path: |
            artifacts/test-results/navigation
            !artifacts/test-results/navigation/*/_*
          if-no-files-found: ignore
          overwrite: true
      - name: Run the application managed suites
        id: application
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && contains(fromJSON(needs.plan.outputs.managed), 'application') }}
        timeout-minutes: 25
        run: bun eng/ci/test-managed.mjs application
      - name: Retain application test results
        if: ${{ always() && steps.application.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-test-results-application-${{ github.run_id }}
          path: |
            artifacts/test-results/application
            !artifacts/test-results/application/*/_*
          if-no-files-found: ignore
          overwrite: true
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  # One job runs the planned web packages' tests (webTests in eng/ci/plan.mjs) and the framework
  # consumers as named steps. A step also runs after another one failed, so one run reports every failure.
  web:
    name: Web packages and framework consumers
    needs: [plan, build]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'web') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Web package tests, Svelte checks and npm consumers do not run managed code. vite-plugin-runic
      # and the npm consumers need real Node and npm/pnpm.
      - uses: ./.github/actions/setup-sdk
        with:
          nuget: none
          node: "true"
      - uses: ./.github/actions/restore-build
        id: restore
        with:
          nuget: "false"
      # vite-plugin-runic's dock, the Views menu bar and the framework text fields have Chromium tests.
      - uses: ./.github/actions/install-browser
        if: ${{ contains(fromJSON(needs.plan.outputs.web), 'vite-plugin-runic') || contains(fromJSON(needs.plan.outputs.web), 'views') || contains(fromJSON(needs.plan.outputs.web), 'angular') || contains(fromJSON(needs.plan.outputs.web), 'react') || contains(fromJSON(needs.plan.outputs.web), 'vue') || contains(fromJSON(needs.plan.outputs.web), 'svelte') }}
      - name: Test angular
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && contains(fromJSON(needs.plan.outputs.web), 'angular') }}
        working-directory: packages/web/angular
        run: bun run --bun test
      - name: Test vite-plugin-runic
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && contains(fromJSON(needs.plan.outputs.web), 'vite-plugin-runic') }}
        working-directory: packages/web/vite-plugin-runic
        run: bun run --bun test
      - name: Test svelte
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && contains(fromJSON(needs.plan.outputs.web), 'svelte') }}
        working-directory: packages/web/svelte
        run: bun run --bun test
      - name: Test sveltekit
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && contains(fromJSON(needs.plan.outputs.web), 'sveltekit') }}
        working-directory: packages/web/sveltekit
        run: bun run --bun test
      - name: Test views
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && contains(fromJSON(needs.plan.outputs.web), 'views') }}
        working-directory: packages/web/views
        run: bun run --bun test
      - name: Test views-effect
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && contains(fromJSON(needs.plan.outputs.web), 'views-effect') }}
        working-directory: packages/web/views-effect
        run: bun run --bun test
      - name: Test react
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && contains(fromJSON(needs.plan.outputs.web), 'react') }}
        working-directory: packages/web/react
        run: bun run --bun test
      - name: Test vue
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && contains(fromJSON(needs.plan.outputs.web), 'vue') }}
        working-directory: packages/web/vue
        run: bun run --bun test
      - name: Check Svelte integration types
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && fromJSON(needs.plan.outputs.frameworks) }}
        working-directory: packages/web/svelte
        run: bun run --bun check
      - name: Check SvelteKit integration types
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && fromJSON(needs.plan.outputs.frameworks) }}
        working-directory: packages/web/sveltekit
        run: bun run --bun check
      - name: Exercise isolated npm framework consumers
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && fromJSON(needs.plan.outputs.frameworks) }}
        run: bun tests/web/svelte-package-consumers/package-consumers.mjs
      # The adapters' tests at the lowest framework version each peer range accepts (eng/ci/README.md).
      - name: Test framework adapters at their lowest peers
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && (contains(fromJSON(needs.plan.outputs.web), 'react') || contains(fromJSON(needs.plan.outputs.web), 'vue') || contains(fromJSON(needs.plan.outputs.web), 'svelte') || contains(fromJSON(needs.plan.outputs.web), 'views-effect') || contains(fromJSON(needs.plan.outputs.web), 'vite-plugin-runic') || contains(fromJSON(needs.plan.outputs.web), 'sveltekit') || contains(fromJSON(needs.plan.outputs.web), 'angular')) }}
        env:
          RUNIC_LOWEST_PEER_PACKAGES: ${{ needs.plan.outputs.web }}
        run: bun tests/web/lowest-peers/lowest-peers.mjs
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  # engines.node of the npm packages that run in Node admits Node 24 and 26 (D031.3). The other jobs
  # run .node-version (Node 24); this one runs those packages' tests on Node 26 (eng/ci/plan.mjs nodePackages).
  node-26:
    name: npm packages / Node 26
    needs: [plan, build]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'node-26') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          nuget: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.12.1
      - name: Install compatibility package managers
        run: npm install --global npm@12.2.0 pnpm@12.9.1 --allow-scripts=pnpm
      - uses: ./.github/actions/restore-build
        id: restore
        with:
          nuget: "false"
      - uses: ./.github/actions/install-browser
        if: ${{ contains(fromJSON(needs.plan.outputs.web), 'vite-plugin-runic') }}
      # Without --bun, the scripts' tsc and vitest and the packed-consumer checks run on this Node.
      - name: Test vite-plugin-runic on Node 26
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && contains(fromJSON(needs.plan.outputs.web), 'vite-plugin-runic') }}
        working-directory: packages/web/vite-plugin-runic
        run: |
          node --version | grep '^v26\.'
          bun run test
      - name: Test sveltekit on Node 26
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && contains(fromJSON(needs.plan.outputs.web), 'sveltekit') }}
        working-directory: packages/web/sveltekit
        run: |
          node --version | grep '^v26\.'
          bun run test
  engineering:
    needs: [plan, build]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'engineering') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: ./.github/actions/restore-build
      - name: Verify workspace, runtime and CI contracts
        run: bun test --timeout 180000 ./eng/*.test.mjs ./eng/ci/*.test.mjs ./eng/release/*.test.mjs ./eng/reliability/*.test.mjs ./tests/engineering/*.test.mjs
      - name: Check embedded CLI compatibility metadata and README support table
        run: bun tools/dotnet-runic/metadata/generate.mjs --check
      - name: Check generated packing project inventory
        run: bun eng/generate-shipping-projects.mjs --check
      # The flake provides the same actionlint version for local runs.
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  views:
    name: Window and View journeys
    needs: [plan, build]
    if: ${{ !contains(fromJSON(needs.plan.outputs.skip), 'views') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: ./.github/actions/restore-build
      - uses: ./.github/actions/install-browser
      - name: Exercise first Window generated client
        run: |
          node examples/first-window/browser-smoke.mjs
          node examples/first-window/navigation-smoke.mjs
      - name: Exercise Runic Desktop Views host and ReactiveUI client
        run: |
          node examples/first-window-desktop/browser-smoke.mjs
          xvfb-run -a dotnet run --project examples/first-window-desktop/FirstWindowDesktop.csproj -c Release --no-build -- --probe-owner
      - name: Check composed View lifetime and window scopes
        run: |
          dotnet run --no-build -c Release --project examples/notes-view-first/NotesViewFirst.csproj -- --check-view-lifetime
          dotnet run --no-build -c Release --project examples/notes-view-first/NotesViewFirst.csproj -- --check-view-lifetime --splat
