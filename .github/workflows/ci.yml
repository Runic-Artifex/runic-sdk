name: SDK CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: sdk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CONFIGURATION: Release
  NUGET_PACKAGES: ${{ github.workspace }}/.cache/nuget
  RUNIC_BRIDGE_INSPECTOR: ${{ github.workspace }}/tools/Runic.Application.Bridge.Inspector/bin/Release/net10.0/Runic.Application.Bridge.Inspector.dll
jobs:
  build:
    name: Build shared SDK inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      web: ${{ steps.plan.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - name: Discover web test suites
        id: plan
        run: bun eng/ci/plan.mjs >> "$GITHUB_OUTPUT"
      - name: Restore managed dependencies
        run: dotnet restore RunicSdk.Core.slnx
      - name: Build managed SDK, tools and test executables
        run: bun eng/run.mjs build-core
      - name: Build web packages
        run: bun eng/run.mjs build-web
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
      - name: Archive reusable Linux build outputs
        run: bun eng/ci/build-artifact.mjs create
      - uses: actions/upload-artifact@v7
        with:
          name: sdk-build-${{ github.run_id }}
          path: artifacts/ci-build
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  managed:
    name: Managed / ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [application, assets, command-line, translations]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - uses: ./.github/actions/restore-build
      - uses: ./.github/actions/install-browser
        if: matrix.suite == 'application'
      - name: Install the C++20 conformance compiler
        if: matrix.suite == 'translations'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang
      - name: Run managed conformance suite
        run: bun eng/ci/test-managed.mjs "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}
      - name: Exercise the counter application
        if: matrix.suite == 'application'
        run: dotnet run --project examples/counter/Counter.csproj -c Release --no-build
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  web:
    name: Web / ${{ matrix.package }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.build.outputs.web) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: ${{ matrix.node && 'true' || 'false' }}
      - uses: ./.github/actions/restore-build
      - uses: ./.github/actions/install-browser
        if: matrix.package == 'vite-plugin-runic'
      - name: Run package tests
        working-directory: packages/web/${{ matrix.package }}
        run: bun run --bun test
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  engineering:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: ./.github/actions/restore-build
      - name: Verify workspace, runtime and CI contracts
        run: bun test --timeout 180000 ./eng/*.test.mjs ./eng/ci/*.test.mjs ./eng/release/*.test.mjs ./eng/reliability/*.test.mjs
      - name: Verify current engineering acceptance
        run: bun eng/ci/test-acceptance.mjs
      - name: Check embedded CLI compatibility metadata
        run: bun tools/dotnet-runic/metadata/generate.mjs --check
      - name: Check generated packing project inventory
        run: bun eng/generate-shipping-projects.mjs --check
      - name: Verify document candidate export boundaries
        run: python3 examples/document-migration/eng/test-candidate.py
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  framework-consumers:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: ./.github/actions/restore-build
      - name: Check Svelte integration types
        working-directory: packages/web/svelte
        run: bun run --bun check
      - name: Check SvelteKit integration types
        working-directory: packages/web/sveltekit
        run: bun run --bun check
      - name: Exercise isolated npm framework consumers
        run: bun tests/web/svelte-package-consumers/package-consumers.mjs
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  bridge:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - uses: ./.github/actions/restore-build
      - name: Verify generated bridge artifacts and template contracts
        run: bun eng/bridge/verify-artifacts.mjs
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  editor:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - uses: ./.github/actions/restore-build
      - name: Build the Translations Editor
        run: dotnet build apps/translations-editor/Runic.Translations.Editor.csproj -c Release
      - name: Verify editor frontend and production output
        working-directory: apps/translations-editor/Frontend
        run: bun run --bun verify:built
        env:
          RUNIC_TRANSLATIONS_MANIFEST: ${{ github.workspace }}/apps/translations-editor/obj/Release/net10.0/translations/editor.esm/web-module-manifest-v1.json
      - name: Run editor smoke scenarios
        run: dotnet apps/translations-editor/bin/Release/net10.0/Runic.Translations.Editor.dll --smoke-test
      - name: Validate the example translation workspace
        run: dotnet apps/translations-editor/bin/Release/net10.0/Runic.Translations.Editor.dll validate apps/translations-editor/ExampleWorkspace
      - uses: ./.github/actions/install-browser
      - name: Verify real hosted editor TOML editing and recovery
        run: bun apps/translations-editor/tests/HostedBrowserE2E/run-hosted-toml-ui.mjs apps/translations-editor/bin/Release/net10.0/Runic.Translations.Editor.dll
        env:
          RUNIC_EDITOR_HOSTED_E2E_REPORT_DIR: ${{ github.workspace }}/artifacts/editor-hosted-toml-ui
      - name: Retain hosted editor browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editor-hosted-toml-ui
          path: artifacts/editor-hosted-toml-ui
          if-no-files-found: ignore
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          dotnet: "false"
      - name: Check documentation types
        working-directory: docs
        run: bun run --bun check
      - name: Build and test documentation and release data
        working-directory: docs
        run: bun run --bun test
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  customers:
    name: Customer migration / ${{ matrix.journey }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        journey: [browser, dev]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - uses: ./.github/actions/restore-build
      - uses: ./.github/actions/install-browser
      - name: Build the customer application
        run: dotnet build examples/customer-migration/Host/CustomerDesktop.csproj -c Release
      - name: Verify feature behavior
        if: matrix.journey == 'browser'
        working-directory: examples/customer-migration/Host/Frontend
        run: bun run --bun test
      - name: Check generated customer contracts
        if: matrix.journey == 'browser'
        working-directory: examples/customer-migration/Host/Frontend
        run: bun run --bun contract:check
      - name: Exercise the live bridge and lifecycle
        if: matrix.journey == 'browser'
        working-directory: examples/customer-migration/Host/Frontend
        run: bun run --bun test:browser
      - name: Build the document migration application
        if: matrix.journey == 'browser'
        run: dotnet build examples/document-migration/Host/DocumentDesktop.csproj -c Release
      - name: Verify document draft behavior
        if: matrix.journey == 'browser'
        working-directory: examples/document-migration/Host/Frontend
        run: bun run --bun test
      - name: Exercise document bridge and dirty-close behavior
        if: matrix.journey == 'browser'
        working-directory: examples/document-migration/Host/Frontend
        run: bun run --bun test:browser
      - name: Build the document migration application with CS-WebUI
        if: matrix.journey == 'browser'
        run: dotnet build examples/document-migration/Host/DocumentDesktop.csproj -c Release -p:RunicHost=cswebui
      - name: Exercise document CS-WebUI bridge and dirty-close behavior
        if: matrix.journey == 'browser'
        working-directory: examples/document-migration/Host/Frontend
        run: bun run --bun test:browser
      - name: Exercise both hosts with frontend HMR
        if: matrix.journey == 'dev'
        working-directory: examples/customer-migration/Host/Frontend
        run: bun run --bun test:dev
      - name: Retain development logs
        if: always() && matrix.journey == 'dev'
        uses: actions/upload-artifact@v7
        with:
          name: host-dev-${{ github.run_id }}
          path: artifacts/host-dev
          if-no-files-found: ignore
          overwrite: true
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  packages:
    name: Materialize package candidates
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
      - uses: ./.github/actions/restore-build
      - name: Pack the verified build inputs
        run: bun eng/run.mjs pack-built
      - name: Verify shipped template lock integrity
        run: bun eng/release/verify-template-locks.mjs
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
      - uses: actions/upload-artifact@v7
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  package-consumers:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: actions/download-artifact@v8
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
      - name: Verify isolated NuGet and npm consumers
        run: bun run verify-packages
      - name: Verify generated CommandLine package consumer with NativeAOT
        shell: pwsh
        run: |
          $version = (Get-Content eng/workspace.json -Raw | ConvertFrom-Json).version
          ./tests/fixtures/command-line/package-consumer/Runic.CommandLine.PackageConsumer/Invoke-PackageConsumer.ps1 -PackageVersion $version -PackageDirectory artifacts/packages/nuget -RuntimeIdentifier linux-x64 -Configuration Release
      - name: Verify Angular library and application package consumption
        run: |
          version=$(bun -p 'JSON.parse(require("node:fs").readFileSync("eng/workspace.json", "utf8")).version')
          bun tests/web/angular-package-consumer/test-package-consumer.mjs "artifacts/packages/npm/runic-artifex-application-bridge-$version.tgz" "artifacts/packages/npm/runic-artifex-angular-$version.tgz"
      - uses: ./.github/actions/install-browser
      - name: Verify package-only document migration in both hosts
        run: python3 examples/document-migration/eng/verify-candidate.py --version 0.2.0-preview.1 --nuget-feed artifacts/packages/nuget --npm-feed artifacts/packages/npm --report artifacts/document-package-acceptance/linux-x64
      - name: Retain package-only document evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: document-package-acceptance-${{ github.run_id }}
          path: artifacts/document-package-acceptance
          if-no-files-found: ignore
          overwrite: true
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  templates:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: "true"
      - uses: actions/download-artifact@v8
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
      - name: Verify generated template applications
        run: bun run verify:templates
      - name: Check generated files and lockfile
        run: bun eng/ci/source-state.mjs check
  native:
    name: Native / ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            provider: Linux
            extension: ""
          - os: windows-latest
            rid: win-x64
            provider: Windows
            extension: .exe
          - os: macos-26
            rid: osx-arm64
            provider: MacOS
            extension: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/install-browser
      - name: Build Desktop browser fixture
        shell: bash
        run: |
          bun run --cwd packages/web/desktop --bun build
          bun build packages/web/desktop/test/browser-entry.ts --target browser --outfile artifacts/browser/runic-desktop-test.js
      - name: Build managed desktop contracts
        run: dotnet build tests/dotnet/Runic.Desktop.Tests -c Release
      - name: Test managed desktop contracts
        timeout-minutes: 5
        run: >-
          dotnet test tests/dotnet/Runic.Desktop.Tests -c Release --no-build
          --settings eng/ci/desktop.runsettings --diag artifacts/native-tests/vstest.log
          --logger "console;verbosity=normal" --logger "trx;LogFileName=desktop.trx"
          --results-directory artifacts/native-tests
          --blame-hang-timeout 2m --blame-hang-dump-type none
      - name: Retain desktop contract diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-tests-${{ matrix.rid }}-${{ github.run_id }}
          path: artifacts/native-tests
          if-no-files-found: ignore
          overwrite: true
      - name: Install Linux native WebView prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-0 libwebkitgtk-6.0-4 xvfb dbus-x11
      - name: Build native window smoke
        run: dotnet build tests/native/Runic.Desktop.WebViewSmoke -c Release
      - name: Exercise native window close interception on Linux
        if: runner.os == 'Linux'
        run: GDK_BACKEND=x11 xvfb-run -a dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll
      - name: Exercise direct portal protocol
        if: runner.os == 'Linux'
        run: dbus-run-session -- dotnet run --project tests/dotnet/Runic.Platform.Linux.Portal.Tests -c Release -- --dbus
      - name: Exercise GTK4 native window and platform services
        if: runner.os == 'Linux'
        run: GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a dotnet run --project tests/native/Runic.Desktop.Gtk4.Smoke -c Release
      - name: Verify GTK4 and portal NativeAOT consumers
        if: runner.os == 'Linux'
        run: |
          dotnet publish tests/native/Runic.Desktop.Gtk4.Smoke -c Release -r linux-x64 --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/gtk4-aot
          GDK_BACKEND=x11 GSETTINGS_BACKEND=memory xvfb-run -a artifacts/gtk4-aot/Runic.Desktop.Gtk4.Smoke
          dotnet publish tests/dotnet/Runic.Platform.Linux.Portal.Tests -c Release -r linux-x64 --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/portal-aot
          dbus-run-session -- artifacts/portal-aot/Runic.Platform.Linux.Portal.Tests --dbus
      - name: Exercise native window close interception on Windows and macOS
        if: runner.os != 'Linux'
        run: dotnet tests/native/Runic.Desktop.WebViewSmoke/bin/Release/net10.0/Runic.Desktop.WebViewSmoke.dll
      - name: Build platform lifetime and native picker conformance
        run: dotnet build tests/dotnet/Runic.Platform.Prototype.Tests -c Release
      - name: Verify live CS-WebUI presentation service lifetime on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: GDK_BACKEND=x11 xvfb-run -a dotnet tests/dotnet/Runic.Platform.Prototype.Tests/bin/Release/net10.0/Runic.Platform.Prototype.Tests.dll --live-cswebui
      - name: Verify live CS-WebUI presentation service lifetime
        if: runner.os != 'Linux'
        timeout-minutes: 2
        run: dotnet tests/dotnet/Runic.Platform.Prototype.Tests/bin/Release/net10.0/Runic.Platform.Prototype.Tests.dll --live-cswebui
      - name: Verify GTK picker ownership and presentation shutdown
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: GDK_BACKEND=x11 xvfb-run -a dotnet tests/dotnet/Runic.Platform.Prototype.Tests/bin/Release/net10.0/Runic.Platform.Prototype.Tests.dll --native
      - name: Verify native picker ownership and presentation shutdown
        if: runner.os != 'Linux'
        timeout-minutes: 3
        run: dotnet tests/dotnet/Runic.Platform.Prototype.Tests/bin/Release/net10.0/Runic.Platform.Prototype.Tests.dll --native
      - name: Publish platform lifetime and picker conformance with NativeAOT
        timeout-minutes: 10
        run: dotnet publish tests/dotnet/Runic.Platform.Prototype.Tests -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -p:TrimmerSingleWarn=false -o artifacts/platform-aot
      - name: Exercise NativeAOT GTK picker lifecycle
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: GDK_BACKEND=x11 xvfb-run -a artifacts/platform-aot/Runic.Platform.Prototype.Tests --native
      - name: Exercise NativeAOT picker lifecycle
        if: runner.os != 'Linux'
        timeout-minutes: 3
        shell: bash
        run: ./artifacts/platform-aot/Runic.Platform.Prototype.Tests${{ matrix.extension }} --native
      - name: Build native clipboard conformance
        run: dotnet build tests/dotnet/Runic.Platform.${{ matrix.provider }}.Tests -c Release -p:TreatWarningsAsErrors=true
      - name: Verify native GTK clipboard
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: GDK_BACKEND=x11 xvfb-run -a dotnet tests/dotnet/Runic.Platform.Linux.Tests/bin/Release/net10.0/Runic.Platform.Linux.Tests.dll --native
      - name: Verify native clipboard
        if: runner.os != 'Linux'
        timeout-minutes: 3
        run: dotnet tests/dotnet/Runic.Platform.${{ matrix.provider }}.Tests/bin/Release/net10.0/Runic.Platform.${{ matrix.provider }}.Tests.dll --native
      - name: Publish native clipboard conformance with NativeAOT
        timeout-minutes: 10
        run: dotnet publish tests/dotnet/Runic.Platform.${{ matrix.provider }}.Tests -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -p:TrimmerSingleWarn=false -o artifacts/clipboard-aot
      - name: Verify NativeAOT GTK clipboard
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: GDK_BACKEND=x11 xvfb-run -a artifacts/clipboard-aot/Runic.Platform.Linux.Tests --native
      - name: Verify NativeAOT clipboard
        if: runner.os != 'Linux'
        timeout-minutes: 3
        shell: bash
        run: ./artifacts/clipboard-aot/Runic.Platform.${{ matrix.provider }}.Tests${{ matrix.extension }} --native
      - name: Prepare signed macOS sandbox fixture for manual permission evidence
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts/platform-sandbox/RunicPlatform.app/Contents/MacOS
          cp tests/native/platform-sandbox/Info.plist artifacts/platform-sandbox/RunicPlatform.app/Contents/Info.plist
          ditto artifacts/platform-aot artifacts/platform-sandbox/RunicPlatform.app/Contents/MacOS
          codesign --force --deep --sign - --entitlements tests/native/platform-sandbox/entitlements.plist artifacts/platform-sandbox/RunicPlatform.app
          codesign --verify --deep --strict artifacts/platform-sandbox/RunicPlatform.app
          tar -czf artifacts/platform-sandbox-${{ matrix.rid }}.tar.gz -C artifacts/platform-sandbox RunicPlatform.app
      - name: Retain macOS sandbox permission fixture
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: platform-sandbox-${{ matrix.rid }}-${{ github.run_id }}
          path: artifacts/platform-sandbox-${{ matrix.rid }}.tar.gz
          if-no-files-found: error
      - name: Compile the original WPF migration example
        if: runner.os == 'Windows'
        run: dotnet build examples/customer-migration/Wpf/CustomerWpf.csproj -c Release
      - name: Publish and exercise WebView2 with NativeAOT
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet publish tests/native/Runic.Desktop.WebViewSmoke -c Release -r win-x64 --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -p:TrimmerSingleWarn=false -o artifacts/webview-aot
          test ! -e artifacts/webview-aot/WebView2Loader.dll
          mkdir artifacts/webview-exe-only
          cp artifacts/webview-aot/Runic.Desktop.WebViewSmoke.exe artifacts/webview-exe-only/
          (cd artifacts/webview-exe-only && ./Runic.Desktop.WebViewSmoke.exe)
      - name: Publish generated member bridge with NativeAOT
        shell: bash
        run: |
          dotnet publish tests/native/Runic.Application.Bridge.MemberAotSmoke -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:IlcTreatWarningsAsErrors=true -o artifacts/native
          ./artifacts/native/Runic.Application.Bridge.MemberAotSmoke${{ matrix.extension }}

  footprint:
    name: Footprint / ${{ matrix.rid }}
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-26
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v8
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
      - name: Restore and build verification tools
        shell: bash
        run: |
          bun run bootstrap
          dotnet build tools/dotnet-runic -c Release
      - name: Build frontend verification dependencies
        run: bun eng/run.mjs build-web
      - name: Test CS-WebUI startup readiness
        run: dotnet run --project tests/dotnet/Runic.Application.CsWebUi.Tests -c Release
      - uses: ./.github/actions/install-browser
      - name: Build Desktop browser fixture
        run: bun build packages/web/desktop/test/browser-entry.ts --target browser --outfile artifacts/browser/runic-desktop-test.js
      - name: Build minimal Desktop conformance
        run: dotnet build tests/dotnet/Runic.Desktop.Tests -c Release -p:RunicDesktopMinimalHost=true
      - name: Verify minimal Desktop conformance
        timeout-minutes: 5
        run: >-
          dotnet test tests/dotnet/Runic.Desktop.Tests -c Release --no-build -p:RunicDesktopMinimalHost=true
          --settings eng/ci/desktop.runsettings --diag artifacts/host-footprint/minimal-tests/vstest.log
          --logger "console;verbosity=normal" --logger "trx;LogFileName=desktop-minimal.trx"
          --results-directory artifacts/host-footprint/minimal-tests
          --blame-hang-timeout 2m --blame-hang-dump-type none
      - name: Publish, measure and verify all three package consumers
        run: bun run verify:footprint
        env:
          RUNIC_SIZE_RID: ${{ matrix.rid }}
      - name: Retain measurements and actual published distributions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-footprint-${{ matrix.rid }}-${{ github.run_id }}
          path: artifacts/host-footprint
          if-no-files-found: warn
          overwrite: true

  verify:
    name: verify
    if: always()
    needs: [build, managed, web, engineering, framework-consumers, bridge, editor, docs, customers, packages, package-consumers, templates, native, footprint]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every verification job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          IFS=',' read -ra results <<< "$RESULTS"
          for result in "${results[@]}"; do
            if [[ "$result" != success ]]; then
              echo "Verification is incomplete: $RESULTS"
              exit 1
            fi
          done
