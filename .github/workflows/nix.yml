name: Nix packaging
# buildRunicApplication, its modules and the runic-app template's flake; see nix/README.md. Path-filtered, so not
# a required check.
on:
  push:
    branches: [main]
    paths: ['flake.nix', 'flake.lock', 'nix/**', 'nixos/packaging/**', 'tests/templates/Test-NixTemplate.sh', 'tools/Runic.Application.Templates/**', 'packages/dotnet/Runic.Application.Views/build/**', 'packages/dotnet/Runic.Platform.Linux.Polkit/**', 'packages/dotnet/Runic.Platform.Linux.Portal/**', 'examples/status-icon/**', 'tests/native/Runic.Privileged.Smoke/**', '.github/workflows/nix.yml']
  pull_request:
    paths: ['flake.nix', 'flake.lock', 'nix/**', 'nixos/packaging/**', 'tests/templates/Test-NixTemplate.sh', 'tools/Runic.Application.Templates/**', 'packages/dotnet/Runic.Application.Views/build/**', 'packages/dotnet/Runic.Platform.Linux.Polkit/**', 'packages/dotnet/Runic.Platform.Linux.Portal/**', 'examples/status-icon/**', 'tests/native/Runic.Privileged.Smoke/**', '.github/workflows/nix.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The status-icon example under JIT and NativeAOT, the privileged-actions smoke and the Home Manager module.
  flake-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - run: nix flake check -L

  # Installs the packaged applications through the NixOS module in a VM.
  nixos-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix build .#packaging-nixos -L

  # `dotnet new runic-app --nix` with each package manager, against the latest published Runic packages.
  template:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      # WebKitGTK sandboxes its web process with the bubblewrap from the Nix store, which Ubuntu's AppArmor
      # profile for /usr/bin/bwrap (eng/ci/permit-webkit-sandbox.sh) does not cover.
      - name: Permit unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the template's flakes and open their windows
        env:
          RUNIC_NIX_TEMPLATE_WINDOW: '1'
        run: |
          version="$(curl -fsSL https://registry.npmjs.org/@runic-artifex/views | jq -r '."dist-tags".preview')"
          nix develop .#packaging -c bash tests/templates/Test-NixTemplate.sh "$version" npm pnpm bun aot
