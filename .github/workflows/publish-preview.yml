name: Publish preview
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version committed in eng/workspace.json (0.y.z, x.y.z-rc.N or a stable x.y.z from 1.0.0)
        required: true
        type: string
      dry-run:
        description: Check the CI artifact, registries and release without publishing
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publish-preview
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'Runic-Artifex/runic-sdk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      ci-run-id: ${{ steps.ci.outputs.run-id }}
      artifact-id: ${{ steps.ci.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          committed=$(node -p 'require("./eng/workspace.json").version')
          # Any SemVer version without build metadata: a 0.y.z preview, a prerelease such as
          # 1.0.0-rc.1, or a stable release from 1.0.0 (eng/release/README.md).
          if [[ "$committed" != "$VERSION" || ! "$committed" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Commit the requested version before publishing" >&2
            exit 1
          fi
      - name: Find the successful CI run for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node eng/release/ci-run.mjs
  # Read-only: verifies the CI packages, describes the release (bundle, SBOM,
  # checksums) and checks registries, tag and release. In a dry run this is the
  # last job; it never holds OIDC, attestation or write permissions.
  candidate:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      # sha256sum lines of every candidate file; publish checks its download against them.
      release-sha256: ${{ steps.describe.outputs.sha256 }}
    env:
      CI_RUN_ID: ${{ needs.preflight.outputs.ci-run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Release scripts use only built-in modules: no dependency install.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact-id }}
          path: artifacts/packages
          run-id: ${{ needs.preflight.outputs.ci-run-id }}
          github-token: ${{ github.token }}
      - name: Inspect tested packages
        id: prepare
        run: |
          mkdir -p artifacts/release
          bun eng/release/cli.mjs prepare artifacts/packages "$GITHUB_SHA" "$CI_RUN_ID" artifacts/release/packages.json
      # Standard library only: the SBOM generator installs and executes nothing from the packages.
      - name: Describe the release (package bundle, CycloneDX SBOM, checksums)
        id: describe
        run: |
          bun eng/release/github.mjs describe artifacts/packages artifacts/release
          {
            echo 'sha256<<SHA256'
            (cd artifacts/release && sha256sum -- *)
            echo SHA256
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      # Also fails for a NuGet package ID the trusted-publishing key could not push (eng/release/nuget-policy.json).
      - name: Check registry state and the NuGet push policy without publishing
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bun eng/release/cli.mjs publish artifacts/packages artifacts/release/packages.json --dry-run
      - name: Check tag and release without creating them
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun eng/release/github.mjs release artifacts/release --dry-run
      - name: Check npm latest without moving it
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bun eng/release/cli.mjs tag-latest artifacts/release/packages.json --dry-run
  publish:
    needs: [preflight, candidate]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: preview
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    env:
      CI_RUN_ID: ${{ needs.preflight.outputs.ci-run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency install or lifecycle scripts in the job that holds OIDC:
      # the release scripts use only built-in modules.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # npm 11.5 or newer publishes and moves dist-tags through trusted publishing (OIDC).
      - name: Install the pinned npm
        run: npm install --global npm@12.2.0 --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact-id }}
          path: artifacts/packages
          run-id: ${{ needs.preflight.outputs.ci-run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          path: artifacts/release
      - name: Check the candidate files against the candidate job
        working-directory: artifacts/release
        env:
          RELEASE_SHA256: ${{ needs.candidate.outputs.release-sha256 }}
        run: |
          test -n "$RELEASE_SHA256"
          printf '%s\n' "$RELEASE_SHA256" | sha256sum --check --strict
      - name: Verify packages against the candidate inventory
        run: bun eng/release/cli.mjs verify artifacts/packages artifacts/release/packages.json
      # Attest the verified bytes before anything is published: every package and release asset.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/packages/nuget/*.nupkg
            artifacts/packages/npm/*.tgz
            artifacts/release/runic-sdk-${{ inputs.version }}-packages.tar.gz
            artifacts/release/runic-sdk-${{ inputs.version }}.cdx.json
            artifacts/release/SHA256SUMS
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/packages/nuget/*.nupkg
            artifacts/packages/npm/*.tgz
            artifacts/release/runic-sdk-${{ inputs.version }}-packages.tar.gz
          sbom-path: artifacts/release/runic-sdk-${{ inputs.version }}.cdx.json
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish tested packages
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: bun eng/release/cli.mjs publish artifacts/packages artifacts/release/packages.json
      # A prerelease before 1.0 and for every x.y.z-rc.N; a stable version from 1.0.0 is a full release.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun eng/release/github.mjs release artifacts/release
      # Only a stable version or a 0.y.z preview moves latest; 1.0.0-rc.N stays on the preview dist-tag.
      - name: Move npm latest to this release
        run: bun eng/release/cli.mjs tag-latest artifacts/release/packages.json
      - name: Note the documentation catalog step
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Published $VERSION. Refresh the docs catalog from runic-site: bun run docs:release $VERSION (see eng/release/README.md)." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain release diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostics-${{ github.run_id }}
          path: artifacts/release
          retention-days: 30
          overwrite: true
  # dotnet restore reports NU1102 until nuget.org lists a pushed version (#337). This job
  # ends when every NuGet package of the release restores; push the post-release commit
  # after it. It holds no token, and the release and npm latest do not wait for it.
  indexed:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          path: artifacts/release
      - name: Wait until nuget.org lists every published package
        run: bun eng/release/cli.mjs wait-indexed artifacts/release/packages.json
      - name: Note the post-release commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "nuget.org lists every NuGet package of $VERSION; the post-release commit can be pushed (eng/release/README.md)." >> "$GITHUB_STEP_SUMMARY"
