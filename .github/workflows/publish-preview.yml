name: Publish preview
on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview version committed in eng/workspace.json
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-preview
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'Runic-Artifex/runic-sdk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Check requested preview version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bun -e 'import w from "./eng/workspace.json"; if (w.version !== process.env.VERSION || !/^\d+\.\d+\.\d+-[0-9A-Za-z.-]+$/.test(w.version)) throw Error("Commit the requested preview version before publishing")'
  checks:
    needs: preflight
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: preview
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-sdk
        with:
          node: 'true'
      - uses: actions/download-artifact@v8
        with:
          name: runic-sdk-${{ github.run_id }}
          path: artifacts/packages
      - name: Inspect tested packages
        run: |
          mkdir -p artifacts/release
          bun eng/release/cli.mjs prepare artifacts/packages "$GITHUB_SHA" "$GITHUB_RUN_ID" artifacts/release/packages.json
      - uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish tested packages
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: bun eng/release/cli.mjs publish artifacts/packages artifacts/release/packages.json
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun eng/release/github.mjs artifacts/packages artifacts/release
      - name: Retain release diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-diagnostics-${{ github.run_id }}
          path: artifacts/release
          retention-days: 30
          overwrite: true
