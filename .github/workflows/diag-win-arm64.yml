# Temporary diagnostics for #373 and #391 (W319-004); not for merging.
name: win-arm64 diagnostics
on:
  push:
    branches: [v021/win-arm64-evidence]
permissions:
  contents: read
concurrency:
  group: diag-win-arm64
  cancel-in-progress: true
jobs:
  diag:
    name: diag / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Session and image
        run: |
          "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          $v = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          "Windows $($v.DisplayVersion) build $($v.CurrentBuild).$($v.UBR) $($v.EditionID)"
          qwinsta
          Get-Process explorer, ShellExperienceHost, StartMenuExperienceHost, sihost -ErrorAction SilentlyContinue | Format-Table Id, SessionId, StartTime, Path -AutoSize
          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          "cdb: $($cdb -join '; ')"
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          $pick = $cdb | Where-Object { $_ -like "*\$arch\cdb.exe" } | Select-Object -First 1
          "DIAG_CDB=$pick" >> $env:GITHUB_ENV
          New-Item -ItemType Directory "$env:RUNNER_TEMP\diag" | Out-Null
          Copy-Item eng/ci/diag-win-arm64/WinArm64Diag.cs "$env:RUNNER_TEMP\diag\"
          Set-Location "$env:RUNNER_TEMP\diag"
          dotnet build WinArm64Diag.cs -c Release -v q
      - name: "373: Shell_NotifyIcon(NIM_ADD) without Runic"
        continue-on-error: true
        working-directory: ${{ runner.temp }}/diag
        run: dotnet run --no-build -c Release WinArm64Diag.cs -- notify
      - name: Windows on the desktop
        continue-on-error: true
        working-directory: ${{ runner.temp }}/diag
        run: dotnet run --no-build -c Release WinArm64Diag.cs -- probe
      - name: "391: DoDragDrop without Runic, as the image starts"
        continue-on-error: true
        timeout-minutes: 15
        working-directory: ${{ runner.temp }}/diag
        env:
          DIAG_CASES: plain ole form
        run: |
          $dumps = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\dumps"
          foreach ($case in $env:DIAG_CASES -split ',') {
            "=== drag $case"
            $env:DIAG_DUMP = Join-Path $dumps "$($case -replace ' ', '-').dmp"
            $log = Join-Path $dumps "$($case -replace ' ', '-').log"
            $p = Start-Process dotnet -ArgumentList (@('run', '--no-build', '-c', 'Release', 'WinArm64Diag.cs', '--', 'drag') + ($case -split ' ')) -NoNewWindow -PassThru -RedirectStandardOutput $log
            if (-not $p.WaitForExit(90000)) { taskkill /T /F /PID $p.Id; "=== killed after 90 s" } else { "=== exit $($p.ExitCode)" }
            Get-Content $log
            if ((Test-Path $env:DIAG_DUMP) -and $env:DIAG_CDB -and -not $stacked) {
              $stacked = $true
              $out = Join-Path $dumps "$($case -replace ' ', '-').stacks.txt"
              $p = Start-Process $env:DIAG_CDB -ArgumentList @('-z', "`"$env:DIAG_DUMP`"", '-y', 'srv*C:\symcache*https://msdl.microsoft.com/download/symbols', '-c', '"~*kn 40; q"') -RedirectStandardOutput $out -NoNewWindow -PassThru
              if (-not $p.WaitForExit(240000)) { $p.Kill(); "cdb timed out" }
              "----- stacks ($case) -----"
              Get-Content $out | Where-Object { $_ -match '^\s*[0-9a-f]{2} |^\s*[#.]?\s*\d+\s+Id:' }
              "----- end of stacks -----"
            }
            Start-Sleep 2
          }
          $global:LASTEXITCODE = 0
      - name: Dismiss the CoreWindow over the desktop
        continue-on-error: true
        working-directory: ${{ runner.temp }}/diag
        run: |
          dotnet run --no-build -c Release WinArm64Diag.cs -- dismiss
          Start-Sleep 3
          dotnet run --no-build -c Release WinArm64Diag.cs -- probe
      - name: "391: DoDragDrop variants after dismissing it"
        continue-on-error: true
        timeout-minutes: 15
        working-directory: ${{ runner.temp }}/diag
        env:
          DIAG_CASES: plain ole form,plain ole desktop,shell ole form,shcreate sh form,plain sh form
        run: |
          $dumps = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\dumps"
          foreach ($case in $env:DIAG_CASES -split ',') {
            "=== drag $case"
            $env:DIAG_DUMP = Join-Path $dumps "$($case -replace ' ', '-').dmp"
            $log = Join-Path $dumps "$($case -replace ' ', '-').log"
            $p = Start-Process dotnet -ArgumentList (@('run', '--no-build', '-c', 'Release', 'WinArm64Diag.cs', '--', 'drag') + ($case -split ' ')) -NoNewWindow -PassThru -RedirectStandardOutput $log
            if (-not $p.WaitForExit(90000)) { taskkill /T /F /PID $p.Id; "=== killed after 90 s" } else { "=== exit $($p.ExitCode)" }
            Get-Content $log
            if ((Test-Path $env:DIAG_DUMP) -and $env:DIAG_CDB -and -not $stacked2) {
              $stacked2 = $true
              $out = Join-Path $dumps "$($case -replace ' ', '-').stacks.txt"
              $p = Start-Process $env:DIAG_CDB -ArgumentList @('-z', "`"$env:DIAG_DUMP`"", '-y', 'srv*C:\symcache*https://msdl.microsoft.com/download/symbols', '-c', '"~*kn 40; q"') -RedirectStandardOutput $out -NoNewWindow -PassThru
              if (-not $p.WaitForExit(240000)) { $p.Kill(); "cdb timed out" }
              "----- stacks ($case) -----"
              Get-Content $out | Where-Object { $_ -match '^\s*[0-9a-f]{2} |^\s*[#.]?\s*\d+\s+Id:' }
              "----- end of stacks -----"
            }
            Start-Sleep 2
          }
          $global:LASTEXITCODE = 0
      - name: "373: NIM_ADD after dismissing it"
        continue-on-error: true
        working-directory: ${{ runner.temp }}/diag
        run: dotnet run --no-build -c Release WinArm64Diag.cs -- notify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: diag-dumps-${{ matrix.os }}
          path: ${{ runner.temp }}/dumps
          if-no-files-found: ignore
          retention-days: 7
      - name: "373: NIM_ADD after restarting Explorer"
        continue-on-error: true
        working-directory: ${{ runner.temp }}/diag
        run: |
          Stop-Process -Name explorer -Force
          Start-Sleep 5
          if (-not (Get-Process explorer -ErrorAction SilentlyContinue)) { Start-Process explorer.exe; "started explorer" }
          Start-Sleep 20
          Get-Process explorer | Format-Table Id, SessionId, StartTime -AutoSize
          dotnet run --no-build -c Release WinArm64Diag.cs -- notify
