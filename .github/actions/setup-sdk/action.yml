name: Set up SDK tools
description: Shared tool versions and dependency setup for GitHub and act.
inputs:
  dotnet:
    description: Install the pinned .NET SDK
    default: "true"
  node:
    description: Install real Node and npm/pnpm for compatibility checks
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      if: inputs.dotnet == 'true'
      with:
        global-json-file: global.json
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2
    - name: Snapshot source and lockfiles
      shell: bash
      run: bun eng/ci/source-state.mjs capture
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: inputs.node == 'true'
      with:
        node-version-file: .node-version
    - name: Install compatibility package managers
      if: inputs.node == 'true'
      shell: bash
      run: npm install --global npm@12.2.0 pnpm@12.9.1 --allow-scripts=pnpm
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.dotnet == 'true'
      with:
        path: .cache/nuget
        key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.props', '**/*.targets', '**/*.csproj', 'global.json', 'NuGet.config') }}
    - name: Install workspace dependencies
      shell: bash
      run: bun install --frozen-lockfile
