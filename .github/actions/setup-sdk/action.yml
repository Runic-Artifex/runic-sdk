name: Set up SDK tools
description: Shared tool versions and dependency setup for GitHub and act.
inputs:
  dotnet:
    description: Install the pinned .NET SDK
    default: "true"
  additional-dotnet:
    description: >-
      Also install the certified newer-major .NET SDK next to the pinned one, in a directory of its own that comes
      first on PATH. The repository still builds with the global.json SDK; projects outside it, which have no
      global.json, use the newer SDK and run on the pinned SDK's runtime.
    default: "false"
  nuget:
    description: >-
      NuGet package cache to restore: core (the locked RunicSdk.Core.slnx restore),
      another name for a job whose restores differ (native, dynamicdata), or none
    default: core
  node:
    description: Install real Node and npm/pnpm for compatibility checks
    default: "false"
  package-managers:
    description: With node, also install the pinned npm and pnpm (not needed to only run node)
    default: "true"
  install:
    description: Install the Bun workspace dependencies
    default: "true"
  train-feed:
    description: >-
      The train feed (eng/ci/train-feed.mjs): the unpublished Runic Command Line and Runic Translations releases of
      this train, which restores then add and run unlocked. "true": the plan job's train-feed output, download its
      artifact; "prepare": a workflow without that job prepares it here (it needs actions: read); "false": none.
    default: "false"
runs:
  using: composite
  steps:
    # Every job that runs tests sets up the SDK; native-musl, which does not, uses the action itself.
    - uses: ./.github/actions/test-timeout-scale
    # The pinned SDK goes into its own directory, which setup-dotnet puts first on PATH and in DOTNET_ROOT.
    # In the image's directory, a newer preinstalled SDK (11.0.100 since ubuntu-24.04 20261111.370.1) is what
    # projects outside the repo resolve, such as the template and consumer projects, which have no global.json.
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      if: inputs.dotnet == 'true'
      env:
        DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/runic-dotnet
      with:
        global-json-file: global.json
    - name: Check that projects outside the repository resolve the pinned SDK
      if: inputs.dotnet == 'true'
      shell: bash
      run: |
        pinned=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' global.json)
        resolved=$(cd "$RUNNER_TEMP" && dotnet --version)
        if [ "$resolved" != "$pinned" ]; then
          echo "::error title=Unpinned .NET SDK::A project outside the repository resolves SDK $resolved, not the pinned $pinned."
          exit 1
        fi
        echo "Outside the repository, dotnet resolves the pinned SDK $pinned."
    # The certified additional SDKs of eng/toolchain.mjs are the dotnet-version of this step. Both SDKs share one
    # directory, so the newer one finds the pinned SDK's runtime, which net10.0 applications need.
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      if: inputs.dotnet == 'true' && inputs.additional-dotnet == 'true'
      env:
        DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/runic-dotnet-additional
      with:
        global-json-file: global.json
        dotnet-version: 11.0.100
    - name: Check that projects outside the repository resolve the additional SDK
      if: inputs.dotnet == 'true' && inputs.additional-dotnet == 'true'
      shell: bash
      run: |
        pinned=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' global.json)
        additional=$(ls "$RUNNER_TOOL_CACHE/runic-dotnet-additional/sdk" | sort -V | tail -n 1)
        repository=$(dotnet --version)
        resolved=$(cd "$RUNNER_TEMP" && dotnet --version)
        if [ "$repository" != "$pinned" ] || [ "$resolved" != "$additional" ]; then
          echo "::error title=Additional .NET SDK::The repository resolves SDK $repository (expected $pinned); a project outside it resolves $resolved (expected $additional)."
          exit 1
        fi
        echo "Outside the repository, dotnet resolves SDK $resolved; the repository keeps $pinned."
        dotnet --list-runtimes
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4
    - name: Snapshot source and lockfiles
      shell: bash
      run: bun eng/ci/source-state.mjs capture
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: inputs.node == 'true'
      with:
        node-version-file: .node-version
    - name: Install compatibility package managers
      if: inputs.node == 'true' && inputs.package-managers == 'true'
      shell: bash
      run: npm install --global npm@12.2.0 pnpm@12.9.1 --allow-scripts=pnpm
    # Windows unpacks the many small files of the Bun cache slower than Bun downloads them: on
    # windows-11-arm the restore and install took 40 s against 29 s for an install without it, and
    # on windows-latest 23 s against 27 s.
    - uses: ./.github/actions/dependency-cache
      if: inputs.install == 'true' && runner.os != 'Windows'
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
    # The train feed: outside the workspace, so the source-state check never sees it. RUNIC_TRAIN_FEED adds it to every
    # restore in the repository (eng/build/nuget-lock.targets) and to the NuGet.config of the consumers outside it.
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      if: inputs.train-feed == 'true'
      with:
        name: train-feed
        path: ${{ runner.temp }}/train-feed
    - name: Prepare the train feed
      id: train-feed
      if: inputs.train-feed == 'prepare'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bun eng/ci/train-feed.mjs prepare --output "$RUNNER_TEMP/train-feed"
    - name: Use the train feed
      if: inputs.train-feed == 'true' || steps.train-feed.outputs.active == 'true'
      shell: bash
      run: |
        echo "RUNIC_TRAIN_FEED=$RUNNER_TEMP/train-feed/nuget" >> "$GITHUB_ENV"
        echo "::notice title=Train feed::Built against unpublished Runic Command Line or Runic Translations candidates ($(jq -r '[.upstreams[] | "\(.repository) \(.version) run \(.run.id)"] | join(", ")' "$RUNNER_TEMP/train-feed/train-feed.json")); Publish preview refuses this run."
    # NuGet lock files pin the core restore. Jobs whose restores differ, such as
    # RID-specific and NativeAOT publishes, use a separate cache name so a smaller
    # package set is never saved under the core key. A partial match seeds a changed restore.
    # A train-feed run caches under nuget-train-*: its candidates have the versions nuget.org will publish with other
    # bytes, and must never seed a later locked restore.
    - uses: ./.github/actions/dependency-cache
      if: inputs.dotnet == 'true' && inputs.nuget != 'none'
      with:
        path: .cache/nuget
        key: nuget-${{ env.RUNIC_TRAIN_FEED && 'train-' || '' }}${{ inputs.nuget }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/packages.lock.json', '**/packages.*.lock.json', '**/Directory.Packages.props', 'global.json', 'NuGet.config') }}
        restore-keys: nuget-${{ env.RUNIC_TRAIN_FEED && 'train-' || '' }}${{ inputs.nuget }}-${{ runner.os }}-${{ runner.arch }}-
    # dotnet tool restore reads only NuGet.config. Restored once from the feed, the repository's tools are in the package
    # folder, and every later `dotnet tool restore` of the manifest finds them there.
    - name: Restore the repository's tools from the train feed
      if: env.RUNIC_TRAIN_FEED && inputs.dotnet == 'true'
      shell: bash
      run: dotnet tool restore --add-source "$RUNIC_TRAIN_FEED"
    # On Windows, Bun 1.4.2 sometimes fails to link a package's bins into a fresh
    # node_modules with EBUSY (#291), while the same lockfile installs on the rerun.
    # Only that failure is retried, once, as a full reinstall.
    - name: Install workspace dependencies
      if: inputs.install == 'true'
      shell: bash
      run: |
        log="$RUNNER_TEMP/bun-install.log"
        if bun install --frozen-lockfile 2>&1 | tee "$log"; then exit 0; fi
        grep -q 'EBUSY: failed to link binaries' "$log" || exit 1
        echo "::warning::bun install could not link binaries (EBUSY, #291); reinstalling once."
        bun install --frozen-lockfile --force
