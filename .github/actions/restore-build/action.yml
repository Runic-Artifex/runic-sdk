name: Restore SDK build outputs
description: Restore the exact Linux SDK build produced in this workflow run.
inputs:
  nuget:
    description: Restore the locked NuGet packages that managed build outputs run against
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: sdk-build-${{ github.run_id }}
        path: artifacts/ci-build
    - name: Validate and restore build outputs
      shell: bash
      run: bun eng/ci/build-artifact.mjs restore
    # The archive carries obj/project.assets.json, so this restore is a no-op once the
    # cached package folder holds every locked package; it downloads only what is missing.
    - name: Restore external NuGet dependencies
      if: inputs.nuget == 'true'
      shell: bash
      run: dotnet restore RunicSdk.Core.slnx --locked-mode
