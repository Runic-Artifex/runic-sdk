name: Restore SDK build outputs
description: Restore the exact Linux SDK build produced in this workflow run.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: sdk-build-${{ github.run_id }}
        path: artifacts/ci-build
    - name: Validate and restore build outputs
      shell: bash
      run: bun eng/ci/build-artifact.mjs restore
    - name: Restore external NuGet dependencies
      shell: bash
      run: dotnet restore RunicSdk.Core.slnx
