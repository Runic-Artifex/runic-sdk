name: Restore a dependency cache
description: >-
  Restore a dependency cache, and save it at the end of the job only on main. Pull requests
  and other branches restore without saving, so their entries cannot evict main's caches
  from the repository's cache quota.
inputs:
  path:
    description: Files and directories to cache, as for actions/cache
    required: true
  key:
    description: Exact cache key
    required: true
  restore-keys:
    description: Key prefixes for a partial match, one per line
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: github.ref == 'refs/heads/main'
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: github.ref != 'refs/heads/main'
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
