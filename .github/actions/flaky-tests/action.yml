name: Flaky tests
description: >-
  The recorded single retry and the quarantine (eng/ci/README.md, "Recorded retries" and "Quarantine"). With mode
  start, before the tests: names the record file in RUNIC_RETRIED_TESTS, without which no [RecordedRetry] test is
  retried, and the quarantine list in RUNIC_QUARANTINE, so the tests it lists are skipped. With mode report, as the
  job's last step (if: always()): runs this job and leg's quarantined tests without failing the job, then a warning
  and a job summary line for each retry and each quarantined test that failed, and the record as the artifact
  flaky-tests-<job>-<leg>-<attempt>, which eng/ci/flakes.mjs counts as a sighting of each test.
inputs:
  mode:
    description: start or report
    required: true
  leg:
    description: The job's leg in the artifact name and the record (an OS and architecture, a screen reader)
    required: true
runs:
  using: composite
  steps:
    - name: Name the retried-tests record
      if: inputs.mode == 'start'
      shell: bash
      env:
        LEG: ${{ inputs.leg }}
      run: |
        echo "RUNIC_RETRIED_TESTS=$RUNNER_TEMP/retried-tests.jsonl" >> "$GITHUB_ENV"
        echo "RUNIC_RETRIED_TESTS_LEG=$LEG" >> "$GITHUB_ENV"
        echo "RUNIC_QUARANTINE=$GITHUB_WORKSPACE/eng/ci/flakes.json" >> "$GITHUB_ENV"
    # The quarantined tests run here, after the job's own steps, on the same leg; their failure is recorded, not fatal.
    - name: Run the quarantined tests
      if: inputs.mode == 'report' && !cancelled()
      continue-on-error: true
      shell: bash
      env:
        LEG: ${{ inputs.leg }}
      run: node eng/ci/quarantine.mjs run --job "$GITHUB_JOB" --leg "$LEG"
    - name: Report retried tests
      id: report
      if: inputs.mode == 'report'
      shell: bash
      run: node eng/ci/retried-tests.mjs report "$RUNIC_RETRIED_TESTS"
    # A diagnostic upload (continue-on-error): the warnings above already name every retry in the run's annotations.
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: inputs.mode == 'report' && steps.report.outputs.retried == 'true'
      continue-on-error: true
      with:
        name: flaky-tests-${{ github.job }}-${{ inputs.leg }}-${{ github.run_attempt }}
        path: ${{ env.RUNIC_RETRIED_TESTS }}
        retention-days: 30
