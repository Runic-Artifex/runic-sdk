name: Install the conformance browser
description: Install pinned Playwright Chromium and its platform dependencies.
runs:
  using: composite
  steps:
    - name: Resolve the pinned Playwright version
      id: playwright
      shell: bash
      run: bun -e 'console.log("version=" + require("playwright-core/package.json").version)' >> "$GITHUB_OUTPUT"
    # Playwright's default browser directory differs per OS. The key also names
    # the OS and architecture, so a cache never crosses platforms.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
    - shell: bash
      run: |
        # Only Linux needs system packages; they are not part of the cached directory.
        # A stalled apt or browser download has hung jobs for over 30 minutes, while
        # a normal install takes under three, so each attempt is time-limited.
        deps=()
        if [[ "$RUNNER_OS" == Linux ]]; then deps=(--with-deps); fi
        eng/ci/retry.sh 3 300 bunx --bun playwright-core install "${deps[@]}" chromium
        bun -e 'import {chromium} from "playwright-core"; const path = chromium.executablePath(); console.log("PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=" + path); console.log("WEBUI_BROWSER_PATH=" + path)' >> "$GITHUB_ENV"
    - name: Check the installed browser can start
      shell: bash
      run: |
        bun --input-type=module -e '
          import { chromium } from "playwright-core";
          const started = Date.now();
          const browser = await chromium.launch({ executablePath: process.env.PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH, headless: true, timeout: 120000 });
          try {
            const page = await browser.newPage();
            await page.setContent("<title>Runic browser readiness</title>");
            if (await page.title() !== "Runic browser readiness") throw new Error("Browser renderer did not respond");
            console.log(`Chromium ready in ${Date.now() - started} ms`);
          } finally { await browser.close(); }
        '
