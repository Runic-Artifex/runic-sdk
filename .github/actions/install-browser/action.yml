name: Install the conformance browser
description: Install pinned Playwright Chromium and its platform dependencies.
runs:
  using: composite
  steps:
    - name: Resolve the pinned Playwright version
      id: playwright
      shell: bash
      run: bun -e 'console.log("version=" + require("playwright-core/package.json").version)' >> "$GITHUB_OUTPUT"
    # Playwright's default browser directory differs per OS. The key also names
    # the OS and architecture, so a cache never crosses platforms.
    - uses: ./.github/actions/dependency-cache
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
    # Linux needs system packages, which are not part of the cached directory. Playwright's own
    # --with-deps runs apt-get without a time limit or mirror fallback, so its list for this Ubuntu
    # release, minus what the image already has, goes through eng/ci/apt-install.sh instead.
    - name: List the browser's missing Ubuntu packages
      id: deps
      if: runner.os == 'Linux'
      shell: bash
      run: |
        status=0
        out=$(bunx --bun playwright-core install-deps --dry-run chromium 2>&1) || status=$?
        if grep -q '^All system dependencies are installed' <<<"$out"; then
          packages=
        elif grep -q '^Missing system dependencies' <<<"$out"; then
          packages=$(sed -n '/^Missing system dependencies/,$ { s/^  \([^[:space:]]\+\)$/\1/p }' <<<"$out" | paste -sd' ' -)
        else
          printf '%s\n' "$out"
          echo "::error title=Browser dependencies unknown::playwright-core install-deps --dry-run exited with $status without a package list; see its output above."
          exit 1
        fi
        echo "Missing: ${packages:-none}"
        echo "packages=$packages" >> "$GITHUB_OUTPUT"
    - if: runner.os == 'Linux' && steps.deps.outputs.packages != ''
      uses: ./.github/actions/apt-install
      with:
        packages: ${{ steps.deps.outputs.packages }}
        install-recommends: "false"
    - name: Download Chromium
      shell: bash
      run: |
        # A stalled browser download has hung jobs for over 30 minutes, while a normal
        # download takes under a minute, so each attempt is time-limited.
        eng/ci/retry.sh 3 300 bunx --bun playwright-core install chromium
        bun -e 'import {chromium} from "playwright-core"; const path = chromium.executablePath(); console.log("PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=" + path)' >> "$GITHUB_ENV"
    - name: Check the installed browser can start
      shell: bash
      run: |
        # browser.close() has hung for 48 minutes on win-arm64 after the browser answered, so
        # closing is time-limited and the whole check has a deadline. Exiting kills the browser.
        bun --input-type=module -e '
          import { chromium } from "playwright-core";
          const started = Date.now();
          setTimeout(() => { console.error("::error title=Browser check timed out::Chromium did not start and answer within 180 s."); process.exit(1); }, 180000);
          const browser = await chromium.launch({ executablePath: process.env.PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH, headless: true, timeout: 120000 });
          try {
            const page = await browser.newPage();
            await page.setContent("<title>Runic browser readiness</title>");
            if (await page.title() !== "Runic browser readiness") throw new Error("Browser renderer did not respond");
            console.log(`Chromium ready in ${Date.now() - started} ms`);
          } finally {
            const closed = await Promise.race([browser.close().then(() => true), new Promise(resolve => setTimeout(resolve, 30000, false))]);
            if (!closed) console.log("::warning title=Browser close timed out::Chromium answered but did not close within 30 s; the check exits instead.");
          }
          process.exit(0);
        '
