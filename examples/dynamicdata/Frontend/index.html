<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DynamicData on Runic</title><style>
*{box-sizing:border-box}body{margin:0;background:#11171e;color:#e3eaf0;font:16px system-ui,sans-serif}
main{max-width:850px;margin:40px auto;padding:0 24px}h1{font-size:28px;margin-bottom:8px}p{color:#a9bacb;line-height:1.6}
button{background:#8fc5d3;color:#101820;border:0;padding:12px 18px;border-radius:6px;cursor:pointer;font:inherit}
#status{margin:18px 0;font-variant-numeric:tabular-nums}#scroll{height:512px;overflow:auto;border:1px solid #354554;border-radius:8px}
#spacer{position:relative}#rows{position:absolute;left:0;right:0;top:0}.row{height:32px;padding:5px 16px;display:flex;justify-content:space-between;border-bottom:1px solid #253341}
</style></head><body><main><h1>DynamicData on Runic</h1><p>100,000 cached rows. Each window owns its viewport. Only the visible rows and overscan cross the bridge.</p>
<button id="update">Update 100 rows</button><div id="status" aria-live="polite">Connecting…</div>
<div id="scroll" aria-label="Rows" tabindex="0"><div id="spacer"><div id="rows"></div></div></div>
</main><script src="webui.js"></script><script src="runic-desktop-views.js"></script><script type="module" src="main.js"></script></body></html>
