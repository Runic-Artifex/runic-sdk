<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'">
    <title>Invoice</title>
    <script src="webui.js"></script>
    <script src="runic-views.js"></script>
    <script type="module" src="app.js"></script>
    <style>
      :root { font-family: system-ui, sans-serif; color-scheme: light dark; }
      body { max-width: 46rem; margin: 2rem auto; padding: 0 1.5rem; }
      fieldset { display: grid; grid-template-columns: 1fr 8rem 1fr; gap: .5rem 1rem; border: 1px solid #8884; padding: 1rem; }
      label { display: grid; gap: .25rem; font-size: .9rem; }
      input { padding: .35rem; font: inherit; min-width: 0; }
      input[aria-invalid="true"] { outline: 2px solid #c03; }
      table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
      th, td { text-align: left; padding: .25rem .35rem; vertical-align: top; }
      td.number input { width: 6rem; text-align: right; }
      .cell-error { color: #c03; font-size: .8rem; }
      .conflict { font-size: .8rem; }
      .total { text-align: right; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
      button { padding: .35rem .8rem; font: inherit; }
    </style>
  </head>
  <body>
    <h1>Invoice</h1>
    <fieldset>
      <legend>Billing address</legend>
      <label style="grid-column: 1 / -1">Street <input id="street" autocomplete="street-address"></label>
      <label>Postal code <input id="postal-code" autocomplete="postal-code"></label>
      <label style="grid-column: span 2">City <input id="city" autocomplete="address-level2"></label>
    </fieldset>
    <table>
      <thead><tr><th>Product</th><th>Quantity</th><th>Price</th><th></th></tr></thead>
      <tbody id="lines"></tbody>
    </table>
    <p><button id="add">Add line</button></p>
    <p class="total">Total <strong id="total">…</strong></p>
    <p id="status" role="status">Connecting…</p>
  </body>
</html>
