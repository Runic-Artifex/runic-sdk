<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'">
    <title>Document tabs</title>
    <script src="webui.js"></script>
    <script src="runic-views.js"></script>
    <script type="module" src="app.js"></script>
    <style>
      :root { font-family: system-ui, sans-serif; color-scheme: light dark; }
      body { max-width: 48rem; margin: 2rem auto; padding: 0 1.5rem; }
      button, input, textarea { font: inherit; }
      [role="tablist"] { display: flex; flex-wrap: wrap; gap: .25rem; align-items: center; border-bottom: 1px solid #8886; padding-bottom: .25rem; }
      .tab { display: inline-flex; border: 1px solid #8886; border-radius: .4rem; }
      .tab button { border: 0; background: none; padding: .35rem .6rem; cursor: pointer; }
      .tab[data-selected] { background: #8883; font-weight: 600; }
      label { display: block; margin: .75rem 0; }
      input, textarea { display: block; width: 100%; box-sizing: border-box; padding: .4rem; }
      .actions { display: flex; gap: .5rem; align-items: center; }
    </style>
  </head>
  <body>
    <div id="app"><p role="status">Connecting…</p></div>
  </body>
</html>
