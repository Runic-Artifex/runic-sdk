<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reactive Notes · Svelte</title>
  <script src="/webui.js"></script>
  <script src="/runic-cswebui.js"></script>
  <style>
    :root { font: 16px system-ui, sans-serif; color:#182b28; background:#f1f4f0; }
    * { box-sizing:border-box; } body { margin:0; } button,input,textarea { font:inherit; } button { cursor:pointer; padding:.55rem .85rem; border:1px solid #9db2a8; border-radius:.45rem; color:#173f36; background:white; } button:hover { background:#e5efe8; } button:disabled { opacity:.5; cursor:default; }
    header { padding:.8rem 1.4rem; background:#143b33; color:#f1f8f1; display:flex; align-items:center; justify-content:space-between; gap:1rem; } header strong { letter-spacing:.03em; } header span { font-size:.82rem; color:#cce0d0; }
    .layout { display:grid; grid-template-columns:15rem minmax(0,1fr); min-height:calc(100vh - 3.5rem); } aside { background:#e6eee7; border-right:1px solid #c5d6ca; padding:1.4rem; } aside h2 { font:500 1.4rem Georgia,serif; margin:0 0 1rem; } aside nav { display:grid; gap:.5rem; } aside nav button { text-align:left; width:100%; } aside nav button[aria-current=page] { background:#205445; color:white; }
    main { padding:clamp(1.2rem,3vw,2.4rem); max-width:72rem; width:100%; } h1 { font:500 clamp(2rem,4vw,3rem) Georgia,serif; margin:.2rem 0 1rem; } p { line-height:1.55; } .muted { color:#596c64; } .card { background:#fff; border:1px solid #cbd8cf; border-radius:.8rem; padding:1.4rem; } .tabs { display:flex; gap:.5rem; margin:1.2rem 0; } .tabs button[aria-current=page] { background:#205445; color:white; } label { display:block; margin:1rem 0; font-weight:650; } input,textarea { display:block; width:100%; margin-top:.35rem; border:1px solid #9fb4a8; border-radius:.4rem; padding:.55rem; } textarea { min-height:12rem; resize:vertical; } .status { margin:1.5rem; font-size:.84rem; color:#48665a; } .error { color:#a12c34; }
    .modal { position:fixed; inset:0; z-index:10; display:grid; place-items:center; background:#102820a8; padding:1.2rem; } .dialog { width:min(100%,28rem); background:#fffefa; border-radius:.85rem; padding:1.5rem; box-shadow:0 20px 60px #091a1880; } .dialog h2 { font:500 1.6rem Georgia,serif; margin:0 0 .8rem; } .dialog-actions { display:flex; justify-content:flex-end; gap:.5rem; }
    .document { display:grid; grid-template-columns:minmax(0,1fr) 18rem; gap:1.5rem; } nav { background:#e6eee7; padding:1.4rem; display:grid; align-content:start; gap:.5rem; } nav button { text-align:left; } nav button[aria-current=page] { background:#205445; color:white; }
    @media(max-width:850px) { .document { grid-template-columns:1fr; } } @media(max-width:650px) { .layout { grid-template-columns:1fr; } nav { display:flex; padding:.8rem; } main { padding:1.2rem; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
