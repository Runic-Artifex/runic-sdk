# The native Desktop server: the HTTP and WebSocket engine that Runic.Desktop.NativeServer loads to serve Runic Desktop
# surfaces. See packages/dotnet/Runic.Desktop.NativeServer/README.md and eng/native/README.md.
[workspace]
resolver = "3"
members = ["runic-server"]

[workspace.package]
version = "0.15.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
repository = "https://github.com/Runic-Artifex/runic-sdk"
publish = false

# The shipped library: small, fast and without unwinding tables across the C boundary. A panic aborts the process, as
# an unhandled .NET exception on a thread-pool thread would; every C entry point validates its input instead.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
