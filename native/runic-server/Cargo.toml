[package]
name = "runic-server"
description = "Experimental native HTTP and WebSocket server for Runic Desktop surfaces (loopback, C ABI for .NET)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "runic_server"
# rlib for the Rust tests, cdylib for JIT applications (runtimes/<rid>/native), staticlib for NativeAOT, which links
# it into the executable (DirectPInvoke).
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
bytes = "1.12"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "net", "sync", "fs", "io-util", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "net", "sync", "fs", "io-util", "macros", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
