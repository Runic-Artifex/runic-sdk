name: CI

on:
  push:
    branches:
      - "**"
    tags: ['v*']
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  linux:
    name: Linux build, test, package, and WebView
    if: github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet download cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - uses: ./.github/actions/setup-bun

      - name: TypeScript transport and package
        run: |
          bun install --frozen-lockfile
          bun run test
          ./eng/verify-web-package.sh

      - name: Install Linux WebKitGTK runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-0 xvfb

      - name: Restore
        run: dotnet restore RunicDesktop.slnx

      - name: Build
        run: dotnet build RunicDesktop.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test RunicDesktop.slnx --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results/linux-x64

      - name: Exact package and NativeAOT consumer
        shell: bash
        run: ./eng/verify-local-package.sh linux-x64

      - name: Embedded WebView smoke
        run: >-
          xvfb-run -a dotnet run
          --project tests/Runic.Desktop.WebViewSmoke/Runic.Desktop.WebViewSmoke.csproj
          --configuration Release --no-build

      - run: git diff --exit-code

      - name: Derive immutable candidate version
        run: echo "PACKAGE_VERSION=1.0.0-ci.sha${GITHUB_SHA:0:16}" >> "$GITHUB_ENV"

      - name: Pack immutable npm and NuGet candidates
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          node eng/prepare-web-package.mjs "$PACKAGE_VERSION" "$GITHUB_SHA"
          (cd web/packages/desktop && bun pm pack --destination "$RUNNER_TEMP/packages" --quiet)
          dotnet pack src/Runic.Desktop/Runic.Desktop.csproj \
            --configuration Release \
            --output "$RUNNER_TEMP/packages" \
            -p:PackageVersion="$PACKAGE_VERSION" \
            -p:RepositoryCommit="$GITHUB_SHA"
          sha256sum "$RUNNER_TEMP"/packages/*

      - name: Configure GitHub Packages NuGet source
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/NuGet.Config" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="github" value="https://nuget.pkg.github.com/Runic-Artifex/index.json" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <github>
                <add key="Username" value="%GITHUB_ACTOR%" />
                <add key="ClearTextPassword" value="%GITHUB_TOKEN%" />
              </github>
            </packageSourceCredentials>
          </configuration>
          EOF

      - name: Publish candidates to GitHub Packages
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          NPM_CONFIG_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node eng/publish-github-npm.mjs "$RUNNER_TEMP/packages/runic-artifex-desktop-$PACKAGE_VERSION.tgz"
          dotnet nuget push "$RUNNER_TEMP/packages/Runic.Desktop.$PACKAGE_VERSION.nupkg" \
            --api-key "$GITHUB_TOKEN" \
            --source github \
            --configfile "$RUNNER_TEMP/NuGet.Config" \
            --skip-duplicate

      - name: Download exact candidates from GitHub Packages
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node eng/download-github-npm.mjs "$RUNNER_TEMP/registry-npm" "$PACKAGE_VERSION"
          cp -R tests/Runic.Desktop.PackageConsumer "$RUNNER_TEMP/registry-nuget-consumer"
          dotnet restore "$RUNNER_TEMP/registry-nuget-consumer/Runic.Desktop.PackageConsumer.csproj" \
            --packages "$RUNNER_TEMP/registry-nuget" \
            --configfile "$RUNNER_TEMP/NuGet.Config" \
            --runtime linux-x64 \
            -p:PublishAot=true \
            -p:RunicDesktopPackageVersion="$PACKAGE_VERSION"
          dotnet run \
            --project "$RUNNER_TEMP/registry-nuget-consumer/Runic.Desktop.PackageConsumer.csproj" \
            --configuration Release \
            --no-restore \
            -p:RunicDesktopPackageVersion="$PACKAGE_VERSION"
          sha256sum "$RUNNER_TEMP"/registry-npm/*.tgz

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux-x64
          path: artifacts/test-results/linux-x64
          if-no-files-found: ignore

  comparative-stress-source:
    name: Prepare comparative stress baseline
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.baseline.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read maintained CS-WebUI baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          revision=$(tr -d '[:space:]' < eng/comparative-stress/cs-webui-revision.txt)
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid CS-WebUI revision: $revision" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Check out maintained CS-WebUI baseline
        uses: actions/checkout@v7
        with:
          repository: Runic-Artifex/cs-webui
          ref: ${{ steps.baseline.outputs.revision }}
          path: artifacts/cs-webui
          persist-credentials: false

      - name: Bootstrap verified official WebUI assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash artifacts/cs-webui/eng/bootstrap-webui.sh "$RUNNER_TEMP/webui-assets"

      - name: Upload verified native baseline
        uses: actions/upload-artifact@v7
        with:
          name: comparative-stress-native-assets
          path: ${{ runner.temp }}/webui-assets
          if-no-files-found: error

  native-platforms:
    name: Native parity and stress (${{ matrix.rid }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: comparative-stress-source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
            native_library: webui-2.dll
          - os: macos-15-intel
            rid: osx-x64
            native_library: libwebui-2.dylib
          - os: macos-14
            rid: osx-arm64
            native_library: libwebui-2.dylib
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out maintained CS-WebUI baseline
        uses: actions/checkout@v7
        with:
          repository: Runic-Artifex/cs-webui
          ref: ${{ needs.comparative-stress-source.outputs.revision }}
          path: artifacts/cs-webui
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: comparative-stress-native-assets
          path: ${{ runner.temp }}/webui-assets

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: ./.github/actions/setup-bun

      - name: Restore
        run: dotnet restore RunicDesktop.slnx

      - name: Build
        run: dotnet build RunicDesktop.slnx --configuration Release --no-restore

      - name: Native parity corpus
        run: >-
          dotnet test RunicDesktop.slnx --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results/${{ matrix.rid }}

      - name: Embedded WebView smoke
        run: >-
          dotnet run
          --project tests/Runic.Desktop.WebViewSmoke/Runic.Desktop.WebViewSmoke.csproj
          --configuration Release --no-build

      - name: Same-host comparative stress observation
        shell: bash
        env:
          CSWEBUI_NATIVE_LIBRARY: ${{ runner.temp }}/webui-assets/native/${{ matrix.rid }}/${{ matrix.native_library }}
          RUNIC_CS_WEBUI_REPOSITORY: ${{ github.workspace }}/artifacts/cs-webui
        run: bash eng/run-comparative-stress.sh "artifacts/comparative-stress/${{ matrix.rid }}.json"

      - name: Upload native parity and raw stress evidence
        uses: actions/upload-artifact@v7
        with:
          name: native-parity-and-stress-${{ matrix.rid }}
          path: |
            artifacts/test-results/${{ matrix.rid }}
            artifacts/comparative-stress/${{ matrix.rid }}.json
          if-no-files-found: error
