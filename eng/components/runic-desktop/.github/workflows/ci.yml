name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  linux:
    name: Linux build, test, package, and WebView
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Linux WebKitGTK runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-0 xvfb

      - name: Restore
        run: dotnet restore RunicDesktop.slnx

      - name: Build
        run: dotnet build RunicDesktop.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test RunicDesktop.slnx --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results/linux-x64

      - name: Exact package and NativeAOT consumer
        shell: bash
        run: ./eng/verify-local-package.sh linux-x64

      - name: Embedded WebView smoke
        run: >-
          xvfb-run -a dotnet run
          --project tests/Runic.Desktop.WebViewSmoke/Runic.Desktop.WebViewSmoke.csproj
          --configuration Release --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux-x64
          path: artifacts/test-results/linux-x64
          if-no-files-found: ignore

  native-platforms:
    name: Native smoke (${{ matrix.rid }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-14
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RunicDesktop.slnx

      - name: Build
        run: dotnet build RunicDesktop.slnx --configuration Release --no-restore

      - name: Embedded WebView smoke
        run: >-
          dotnet run
          --project tests/Runic.Desktop.WebViewSmoke/Runic.Desktop.WebViewSmoke.csproj
          --configuration Release --no-build
