name: Prerelease packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer candidate version
        required: true
        type: string
      publish:
        description: Publish the verified packages to GitHub Packages
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || format('0.1.0-preview.{0}.{1}', github.run_number, github.run_attempt) }}

jobs:
  package:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out pinned Runic Command Line dependency
        shell: bash
        run: |
          set -euo pipefail
          dependency_root="$GITHUB_WORKSPACE/../runic-command-line"
          git init "$dependency_root"
          git -C "$dependency_root" remote add origin https://github.com/Runic-Artifex/runic-command-line.git
          git -C "$dependency_root" fetch --no-tags --depth=1 origin beadc31d91746a2cb005207ac1161cf579e128e5
          git -C "$dependency_root" checkout --detach FETCH_HEAD
          test "$(git -C "$dependency_root" rev-parse HEAD)" = "beadc31d91746a2cb005207ac1161cf579e128e5"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run verification pipeline
        run: ./eng/verify.sh

      - name: Create prerelease packages
        run: |
          ./eng/pack.sh "$PACKAGE_VERSION" "$RUNNER_TEMP/packages"
          npm version "$PACKAGE_VERSION" --no-git-tag-version --allow-same-version --prefix web
          npm pkg set \
            "publishConfig.registry=https://npm.pkg.github.com" \
            "publishConfig.access=public" \
            --prefix web
          npm pack "$GITHUB_WORKSPACE/web" --pack-destination "$RUNNER_TEMP/packages"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: runic-translations-${{ env.PACKAGE_VERSION }}
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to GitHub Packages
    if: ${{ inputs.publish }}
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://npm.pkg.github.com
          scope: "@runic-artifex"

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: runic-translations-${{ env.PACKAGE_VERSION }}
          path: ${{ runner.temp }}/packages

      - name: Publish NuGet packages
        run: |
          for package in "$RUNNER_TEMP"/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/Runic-Artifex/index.json" \
              --api-key "$GITHUB_TOKEN" \
              --skip-duplicate
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm package
        run: npm publish "$RUNNER_TEMP"/packages/*.tgz --registry https://npm.pkg.github.com --tag preview
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
