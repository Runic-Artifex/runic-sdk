name: Public release

on:
  pull_request:
    branches: [main]
    paths:
      - .github/actions/setup-bun/action.yml
      - .github/actions/setup-dotnet/action.yml
      - .github/workflows/public-release.yml
      - Directory.Build.props
      - Directory.Packages.props
      - eng/NuGet.ci.config
      - eng/download-github-npm.mjs
      - eng/download-github-nuget.sh
      - eng/pack.sh
      - eng/prepare-web-package.mjs
      - eng/prepare-web-package.test.mjs
      - eng/publish-github-npm.mjs
      - eng/publish-public-npm.sh
      - eng/publish-public-nuget.sh
      - eng/validate-public-npm.mjs
      - dotnet/**/*.csproj
      - web/**
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer package version
        required: true
        type: string
      runic_command_line_version:
        description: Published Runic.CommandLine version to depend on
        required: true
        default: 1.0.0
        type: string
      publish_public:
        description: Publish the verified artifacts to nuget.org and npmjs.org
        required: true
        default: false
        type: boolean
      npm_bootstrap:
        description: Use the one-time npm bootstrap token
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type PUBLISH PUBLIC when publication is enabled
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: public-release-${{ inputs.version || github.sha }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_CONFIG_FILE: ${{ github.workspace }}/eng/NuGet.ci.config
  PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.0.0-pr-validation' }}
  RunicCommandLineVersion: ${{ github.event_name == 'workflow_dispatch' && inputs.runic_command_line_version || '1.0.0-ci.sha5d6a9aa6be25e196' }}
  NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

jobs:
  package:
    name: Verify public artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate request
        shell: bash
        env:
          PUBLISH_PUBLIC: ${{ inputs.publish_public }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be SemVer-compatible." >&2
            exit 1
          fi
          if [[ "$PUBLISH_PUBLIC" == "true" && "$CONFIRMATION" != "PUBLISH PUBLIC" ]]; then
            echo "Public publication requires the exact confirmation PUBLISH PUBLIC." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/setup-bun

      - name: Run verification pipeline
        run: RUNIC_PACKAGE_VERSION="$PACKAGE_VERSION" ./eng/verify.sh

      - name: Ensure verification is reproducible
        run: git diff --exit-code

      - name: Create packages
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          cp artifacts/verification/packages/*.nupkg "$RUNNER_TEMP/packages/"
          node eng/prepare-web-package.mjs \
            "$PACKAGE_VERSION" "$GITHUB_SHA" public "$RunicCommandLineVersion"
          (cd web && bun pm pack --destination "$RUNNER_TEMP/packages" --quiet)

      - name: Validate public package contract
        uses: Runic-Artifex/.github/.github/actions/validate-release-artifacts@main
        with:
          version: ${{ env.PACKAGE_VERSION }}
          artifact-directory: ${{ runner.temp }}/packages
          repository-url: https://github.com/Runic-Artifex/runic-translations
          repository-commit: ${{ github.sha }}
          expected-nuget-count: "5"
          expected-npm-count: "1"

      - name: Validate public npm package contract
        run: >-
          node ./eng/validate-public-npm.mjs
          "$PACKAGE_VERSION"
          "$RUNNER_TEMP/packages"
          "$GITHUB_SHA"

      - name: Stage exact packages in GitHub Packages
        if: ${{ inputs.publish_public && inputs.confirmation == 'PUBLISH PUBLIC' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          NPM_CONFIG_TOKEN: ${{ github.token }}
        run: |
          for package in "$RUNNER_TEMP"/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/Runic-Artifex/index.json" \
              --api-key "$GITHUB_TOKEN" \
              --skip-duplicate
          done
          node eng/publish-github-npm.mjs \
            "$RUNNER_TEMP/packages/runic-artifex-vite-plugin-runic-translations-$PACKAGE_VERSION.tgz" \
            release-staging

  publish:
    name: Publish to nuget.org and npmjs.org
    if: ${{ inputs.publish_public && inputs.confirmation == 'PUBLISH PUBLIC' && github.ref == 'refs/heads/main' }}
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: public-release
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Check out release plumbing
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          scope: "@runic-artifex"

      - name: Download exact staged packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          ./eng/download-github-nuget.sh "$PACKAGE_VERSION" "$RUNNER_TEMP/packages"
          node eng/download-github-npm.mjs "$RUNNER_TEMP/packages" "$PACKAGE_VERSION"

      - name: Validate exact staged package contract
        uses: Runic-Artifex/.github/.github/actions/validate-release-artifacts@main
        with:
          version: ${{ env.PACKAGE_VERSION }}
          artifact-directory: ${{ runner.temp }}/packages
          repository-url: https://github.com/Runic-Artifex/runic-translations
          repository-commit: ${{ github.sha }}
          expected-nuget-count: "5"
          expected-npm-count: "1"

      - name: Validate exact staged npm package contract
        run: >-
          node ./eng/validate-public-npm.mjs
          "$PACKAGE_VERSION"
          "$RUNNER_TEMP/packages"
          "$GITHUB_SHA"

      - name: Preflight npm publication state
        run: ./eng/publish-public-npm.sh "$RUNNER_TEMP/packages" "$PACKAGE_VERSION" --preflight-only

      - name: Preflight NuGet publication state
        run: ./eng/publish-public-nuget.sh "$RUNNER_TEMP/packages" "$PACKAGE_VERSION" "$GITHUB_SHA" --preflight-only

      - name: Validate npm bootstrap credential
        if: ${{ inputs.npm_bootstrap }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: test -n "$NODE_AUTH_TOKEN"

      - name: Sign in to nuget.org with trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: ./eng/publish-public-nuget.sh "$RUNNER_TEMP/packages" "$PACKAGE_VERSION" "$GITHUB_SHA"

      - name: Publish npm package with bootstrap token
        if: ${{ inputs.npm_bootstrap }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: ./eng/publish-public-npm.sh "$RUNNER_TEMP/packages" "$PACKAGE_VERSION"

      - name: Publish npm package with trusted publishing
        if: ${{ !inputs.npm_bootstrap }}
        run: ./eng/publish-public-npm.sh "$RUNNER_TEMP/packages" "$PACKAGE_VERSION"
