name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  RUNIC_RELEASE_MANIFEST: ${{ github.workspace }}/release-authority/runic.release.json
  RUNIC_COMPATIBILITY_SET: ${{ github.workspace }}/release-authority/runic.compatibility-set.json
  NODE_AUTH_TOKEN: ${{ github.token }}
  NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ github.token }};ValidAuthenticationTypes=Basic

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out release authority
        uses: actions/checkout@v7
        with:
          repository: Runic-Artifex/.github
          ref: main
          path: release-authority
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/prepare-registry-candidates
      - run: ./verify.sh
      - name: Restore tracked candidate inputs
        if: always()
        run: node eng/restore-ci-inputs.mjs
      - run: git diff --exit-code

  cross-platform:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: Check out release authority
        uses: actions/checkout@v7
        with:
          repository: Runic-Artifex/.github
          ref: main
          path: release-authority
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/prepare-registry-candidates
      - shell: pwsh
        run: ./eng/editor-smoke.ps1
      - name: Restore tracked candidate inputs
        if: always()
        shell: pwsh
        run: node eng/restore-ci-inputs.mjs
      - name: Ensure candidate inputs are unchanged
        shell: pwsh
        run: git diff --exit-code
