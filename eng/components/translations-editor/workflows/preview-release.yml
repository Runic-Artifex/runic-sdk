name: Editor preview candidates

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/preview-release.yml
      - eng/package-editor.ps1
      - eng/verify-editor-package.ps1
      - eng/write-editor-release-staging.ps1
      - eng/verify-editor-release-staging.ps1
      - eng/rehearse-editor-update-manifest.ps1
      - eng/verify-editor-release-contract.ps1
      - eng/verify-editor-release-set.ps1
      - eng/create-editor-release-bundle.ps1
      - eng/sign-editor-windows.ps1
      - eng/sign-editor-macos.ps1
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer preview version
        required: true
        type: string

permissions:
  contents: read
  packages: read
  attestations: write
  id-token: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  RUNIC_RELEASE_MANIFEST: ${{ github.workspace }}/release-authority/runic.release.json
  RUNIC_COMPATIBILITY_SET: ${{ github.workspace }}/release-authority/runic.compatibility-set.json
  NODE_AUTH_TOKEN: ${{ github.token }}
  NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ github.token }};ValidAuthenticationTypes=Basic
  EDITOR_VERSION: ${{ inputs.version || format('1.0.0-preview.{0}.{1}', github.run_number, github.run_attempt) }}
jobs:
  package:
    name: Stage preview ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2025
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out release authority
        uses: actions/checkout@v7
        with:
          repository: Runic-Artifex/.github
          ref: main
          path: release-authority
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/prepare-registry-candidates
      - name: Build and verify an unsigned preview candidate
        shell: pwsh
        env:
          EDITOR_RID: ${{ matrix.rid }}
          EDITOR_OUTPUT: ${{ runner.temp }}/editor-package
        run: |
          $tree = git rev-parse "$env:GITHUB_SHA^{tree}"
          ./eng/package-editor.ps1 -RuntimeIdentifier $env:EDITOR_RID -OutputDirectory $env:EDITOR_OUTPUT -Version $env:EDITOR_VERSION -RepositoryCommit $env:GITHUB_SHA -RepositoryTree $tree -ReleaseChannel preview
      - name: Restore tracked candidate inputs
        if: always()
        shell: pwsh
        run: node eng/restore-ci-inputs.mjs
      - name: Attest the archive candidate
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ runner.temp }}/editor-package/Runic.Translations.Editor-*.tar.gz
            ${{ runner.temp }}/editor-package/Runic.Translations.Editor-*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: runic-translations-editor-preview-${{ matrix.rid }}
          path: ${{ runner.temp }}/editor-package/
          if-no-files-found: error
          retention-days: 14

# Preview candidates are unsigned and are never published from this workflow.
