name: Editor previews

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

jobs:
  package:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2025
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Build, package, and start the editor
        shell: pwsh
        env:
          EDITOR_RID: ${{ matrix.rid }}
          EDITOR_OUTPUT: ${{ runner.temp }}/editor-package
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.1.0-preview.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT" }
          ./eng/package-editor.ps1 -RuntimeIdentifier $env:EDITOR_RID -OutputDirectory $env:EDITOR_OUTPUT -Version $version -RepositoryCommit $env:GITHUB_SHA
      - uses: actions/upload-artifact@v7
        with:
          name: RunicTranslations.Editor-${{ matrix.rid }}
          path: ${{ runner.temp }}/editor-package/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --prerelease --generate-notes --title "Runic Translations Editor $GITHUB_REF_NAME"
