name: Public release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer package version
        required: true
        type: string
      publish_public:
        description: Publish verified npm artifacts publicly
        required: true
        default: false
        type: boolean
      npm_bootstrap:
        description: Use the one-time npm bootstrap token
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type PUBLISH PUBLIC when publication is enabled
        required: false
        type: string

permissions:
  contents: read

env:
  PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.0.0-pr-validation' }}

concurrency:
  group: public-release-${{ inputs.version || github.sha }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate request
        env:
          PUBLISH_PUBLIC: ${{ inputs.publish_public }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          if [[ "$PUBLISH_PUBLIC" == "true" && "$CONFIRMATION" != "PUBLISH PUBLIC" ]]; then exit 1; fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Pack public candidates
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          node eng/prepare-packages.mjs "$PACKAGE_VERSION" "$GITHUB_SHA" public
          bun pm --cwd packages/svelte pack --destination "$RUNNER_TEMP/packages" --quiet
          bun pm --cwd packages/sveltekit pack --destination "$RUNNER_TEMP/packages" --quiet
      - uses: Runic-Artifex/.github/.github/actions/validate-release-artifacts@main
        with:
          version: ${{ env.PACKAGE_VERSION }}
          artifact-directory: ${{ runner.temp }}/packages
          repository-url: https://github.com/Runic-Artifex/runic-svelte
          repository-commit: ${{ github.sha }}
          expected-npm-count: "2"
      - name: Stage exact packages in GitHub Packages
        if: ${{ inputs.publish_public && inputs.confirmation == 'PUBLISH PUBLIC' && github.ref == 'refs/heads/main' }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          NPM_CONFIG_TOKEN: ${{ github.token }}
        run: node eng/publish-github-packages.mjs "$RUNNER_TEMP/packages" release-staging

  publish:
    if: ${{ inputs.publish_public && inputs.confirmation == 'PUBLISH PUBLIC' && github.ref == 'refs/heads/main' }}
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: public-release
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          scope: "@runic-artifex"
      - name: Download exact staged packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: node eng/download-github-packages.mjs "$RUNNER_TEMP/packages" "$PACKAGE_VERSION"
      - uses: Runic-Artifex/.github/.github/actions/validate-release-artifacts@main
        with:
          version: ${{ env.PACKAGE_VERSION }}
          artifact-directory: ${{ runner.temp }}/packages
          repository-url: https://github.com/Runic-Artifex/runic-svelte
          repository-commit: ${{ github.sha }}
          expected-npm-count: "2"
      - name: Preflight npm publication state
        run: ./eng/publish-public-npm.sh "$RUNNER_TEMP/packages" "$PACKAGE_VERSION" --preflight-only
      - name: Validate npm bootstrap credential
        if: ${{ inputs.npm_bootstrap }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: test -n "$NODE_AUTH_TOKEN"
      - name: Publish with bootstrap token
        if: ${{ inputs.npm_bootstrap }}
        run: ./eng/publish-public-npm.sh "$RUNNER_TEMP/packages" "$PACKAGE_VERSION"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
      - name: Publish with trusted publishing
        if: ${{ !inputs.npm_bootstrap }}
        run: ./eng/publish-public-npm.sh "$RUNNER_TEMP/packages" "$PACKAGE_VERSION"
