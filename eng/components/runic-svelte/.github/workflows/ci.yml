name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Runic-Artifex/.github
          ref: main
          path: release-authority
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Select exact Application Bridge candidate
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          RUNIC_COMPATIBILITY_SET: ${{ github.workspace }}/release-authority/runic.compatibility-set.json
        run: node eng/prepare-ci-dependency.mjs prepare
      - run: bun install --no-save
      - run: bun run verify
      - run: node eng/prepare-ci-dependency.mjs restore
      - run: git diff --exit-code
      - name: Derive immutable candidate version
        run: echo "PACKAGE_VERSION=1.0.0-ci.sha${GITHUB_SHA:0:16}" >> "$GITHUB_ENV"
      - name: Pack candidate
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          node eng/prepare-packages.mjs "$PACKAGE_VERSION" "$GITHUB_SHA" github
          bun pm --cwd packages/svelte pack --destination "$RUNNER_TEMP/packages" --quiet
          bun pm --cwd packages/sveltekit pack --destination "$RUNNER_TEMP/packages" --quiet
          sha256sum "$RUNNER_TEMP"/packages/*.tgz
      - name: Publish candidate to GitHub Packages
        if: ${{ github.event_name == 'push' }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          NPM_CONFIG_TOKEN: ${{ github.token }}
        run: node eng/publish-github-packages.mjs "$RUNNER_TEMP/packages"
      - name: Download exact candidate from GitHub Packages
        if: ${{ github.event_name == 'push' }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          node eng/download-github-packages.mjs "$RUNNER_TEMP/consumer" "$PACKAGE_VERSION"
          sha256sum "$RUNNER_TEMP"/consumer/*.tgz
