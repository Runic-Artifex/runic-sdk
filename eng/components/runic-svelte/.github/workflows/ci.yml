name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: git diff --exit-code
      - name: Derive immutable candidate version
        run: echo "PACKAGE_VERSION=1.0.0-ci.sha${GITHUB_SHA:0:16}" >> "$GITHUB_ENV"
      - name: Pack candidate
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          node eng/prepare-packages.mjs "$PACKAGE_VERSION" "$GITHUB_SHA" github
          bun pm --cwd packages/svelte pack --destination "$RUNNER_TEMP/packages" --quiet
          bun pm --cwd packages/sveltekit pack --destination "$RUNNER_TEMP/packages" --quiet
          sha256sum "$RUNNER_TEMP"/packages/*.tgz
      - name: Publish candidate to GitHub Packages
        if: ${{ github.event_name == 'push' }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          NPM_CONFIG_TOKEN: ${{ github.token }}
        run: node eng/publish-github-packages.mjs "$RUNNER_TEMP/packages"
      - name: Consume exact candidate from GitHub Packages
        if: ${{ github.event_name == 'push' }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          printf '{"private":true,"dependencies":{"@runic-artifex/svelte":"%s","@runic-artifex/sveltekit":"%s"}}\n' "$PACKAGE_VERSION" "$PACKAGE_VERSION" > "$RUNNER_TEMP/consumer/package.json"
          printf '@runic-artifex:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > "$RUNNER_TEMP/consumer/.npmrc"
          bun install --cwd "$RUNNER_TEMP/consumer" --omit peer
          bun --cwd "$RUNNER_TEMP/consumer" -e "await import('@runic-artifex/svelte/translations'); await import('@runic-artifex/sveltekit/translations')"
