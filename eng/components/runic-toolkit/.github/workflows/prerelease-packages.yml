name: Prerelease packages

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/prerelease-packages.yml
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
      - eng/pack.sh
      - eng/verify-release-candidate.sh
      - eng/checkout-ci-candidates.mjs
      - eng/compatibility-set-value.mjs
      - eng/runic.compatibility-set.json
      - eng/pack-npm.mjs
      - eng/verify-npm-artifacts.mjs
      - eng/verify-package-artifacts.ps1
      - src/**/*.csproj
      - templates/**
      - protocol/application-bridge/**
      - web/packages/**
      - tools/**/*.csproj
      - tests/Runic.Application.Bridge.AotSmoke/**
      - tests/RunicToolkit.PackageCanary/**
      - tests/RunicToolkit.TemplateAcceptance/**
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer candidate version
        required: true
        type: string
      publish:
        description: Publish the verified packages to GitHub Packages
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: prerelease-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  package:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve candidate version
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          candidate_version="${REQUESTED_VERSION:-$(node eng/compatibility-set-value.mjs release-train-version)}"
          echo "PACKAGE_VERSION=$candidate_version" >> "$GITHUB_ENV"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@runic-artifex"

      - name: Check out exact compatibility candidates
        env:
          RUNIC_COMPATIBILITY_AUTHORITY_REF: ${{ github.head_ref || github.ref_name }}
        run: node eng/checkout-ci-candidates.mjs

      - name: Install pinned Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: 151.0.7922.77

      - name: Run verification pipeline
        env:
          WEBUI_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: ./eng/verify.sh

      - name: Ensure verification is reproducible
        run: git diff --exit-code

      - name: Verify the complete prerelease candidate locally
        run: >-
          ./eng/verify-release-candidate.sh
          "$PACKAGE_VERSION" "$RUNNER_TEMP/packages" github

      - name: Record package digests
        working-directory: ${{ runner.temp }}/packages
        run: sha256sum ./*.nupkg ./*.tgz > SHA256SUMS

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: runic-toolkit-${{ env.PACKAGE_VERSION }}
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to GitHub Packages
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://npm.pkg.github.com
          scope: "@runic-artifex"

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: runic-toolkit-${{ env.PACKAGE_VERSION }}
          path: ${{ runner.temp }}/packages

      - name: Verify package digests
        working-directory: ${{ runner.temp }}/packages
        run: sha256sum --check SHA256SUMS

      - name: Publish packages
        run: |
          for package in "$RUNNER_TEMP"/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/Runic-Artifex/index.json" \
              --api-key "$GITHUB_TOKEN" \
              --skip-duplicate
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm packages
        run: |
          for package in "$RUNNER_TEMP"/packages/*.tgz; do
            npm publish "$package" \
              --registry "https://npm.pkg.github.com" \
              --tag preview
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
