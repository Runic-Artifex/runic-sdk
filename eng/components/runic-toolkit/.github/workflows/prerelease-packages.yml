name: Prerelease packages

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/prerelease-packages.yml
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
      - eng/pack.sh
      - eng/verify-package-artifacts.ps1
      - src/**/*.csproj
      - templates/**
      - protocol/application-bridge/**
      - web/packages/**
      - tools/**/*.csproj
      - tests/RunicToolkit.PackageCanary/**
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified packages to GitHub Packages
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: prerelease-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  PACKAGE_VERSION: 0.1.0-preview.${{ github.run_number }}.${{ github.run_attempt }}

jobs:
  package:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Run verification pipeline
        run: ./eng/verify.sh

      - name: Ensure verification is reproducible
        run: git diff --exit-code

      - name: Create and validate prerelease packages
        run: ./eng/pack.sh "$PACKAGE_VERSION" "$RUNNER_TEMP/packages"

      - name: Consume packages in isolation
        run: >-
          ./tests/RunicToolkit.PackageCanary/Test-PackageCanary.sh
          "$PACKAGE_VERSION" "$RUNNER_TEMP/packages"

      - name: Publish NativeAOT package consumer
        run: >-
          ./tests/RunicToolkit.ApplicationBridge.AotSmoke/Test-PackageAot.sh
          "$PACKAGE_VERSION" "$RUNNER_TEMP/packages"

      - name: Create and validate npm packages
        run: |
          node eng/pack-npm.mjs "$PACKAGE_VERSION" "$RUNNER_TEMP/packages"
          node eng/verify-npm-artifacts.mjs "$PACKAGE_VERSION" "$RUNNER_TEMP/packages"

      - name: Build all published project templates
        run: >-
          ./tests/RunicToolkit.TemplateAcceptance/Test-Templates.sh
          "$PACKAGE_VERSION"
          "$RUNNER_TEMP/packages"
          "$RUNNER_TEMP/packages/runic-artifex-application-bridge-$PACKAGE_VERSION.tgz"

      - name: Record package digests
        working-directory: ${{ runner.temp }}/packages
        run: sha256sum ./*.nupkg ./*.tgz > SHA256SUMS

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: runic-toolkit-${{ env.PACKAGE_VERSION }}
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to GitHub Packages
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://npm.pkg.github.com
          scope: "@runic-artifex"

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: runic-toolkit-${{ env.PACKAGE_VERSION }}
          path: ${{ runner.temp }}/packages

      - name: Verify package digests
        working-directory: ${{ runner.temp }}/packages
        run: sha256sum --check SHA256SUMS

      - name: Publish packages
        run: |
          for package in "$RUNNER_TEMP"/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/Runic-Artifex/index.json" \
              --api-key "$GITHUB_TOKEN" \
              --skip-duplicate
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm packages
        run: |
          for package in "$RUNNER_TEMP"/packages/*.tgz; do
            npm publish "$package" \
              --registry "https://npm.pkg.github.com" \
              --tag preview
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
