name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  verify:
    name: Verify standalone Toolkit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Run verification pipeline
        run: ./eng/verify.sh

      - name: Ensure verification is reproducible
        run: git diff --exit-code

  application-bridge-windows:
    name: Application Bridge · Windows native host
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: 151.0.7922.77

      - name: Verify Effect contract and managed bridge suites
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          npm run verify
          dotnet run --project tests/RunicToolkit.ApplicationBridge.Tests -c Release
          dotnet run --project tests/RunicToolkit.Hosting.CsWebUi.ApplicationBridge.Tests -c Release

      - name: Run real Windows browser and native host roundtrip
        shell: pwsh
        env:
          WEBUI_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          dotnet run --project tests/RunicToolkit.Hosting.CsWebUi.NativeE2E -c Release

      - name: Publish and execute Windows NativeAOT consumer
        shell: pwsh
        run: |
          dotnet publish tests/RunicToolkit.ApplicationBridge.AotSmoke -c Release -r win-x64 `
            -p:ApplicationBridgeNativeAot=true -o "$env:RUNNER_TEMP\application-bridge-aot"
          & "$env:RUNNER_TEMP\application-bridge-aot\RunicToolkit.ApplicationBridge.AotSmoke.exe"
