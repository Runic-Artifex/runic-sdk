name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  verify:
    name: Verify standalone Toolkit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check out exact compatibility candidates
        env:
          RUNIC_COMPATIBILITY_AUTHORITY_REF: ${{ github.head_ref || github.ref_name }}
        run: node eng/checkout-ci-candidates.mjs

      - name: Install pinned Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: 151.0.7922.77

      - name: Run verification pipeline
        env:
          WEBUI_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: ./eng/verify.sh

      - name: Ensure verification is reproducible
        run: git diff --exit-code

  application-bridge-windows:
    name: Application Bridge · Windows Desktop host
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Check out exact compatibility candidates
        env:
          RUNIC_COMPATIBILITY_AUTHORITY_REF: ${{ github.head_ref || github.ref_name }}
        shell: pwsh
        run: node eng/checkout-ci-candidates.mjs

      - name: Pack exact Runic Desktop candidate
        shell: pwsh
        run: |
          $env:PackageVersion = (node eng/compatibility-set-value.mjs release-train-version).Trim()
          $feed = Join-Path $env:RUNNER_TEMP "runic-desktop-feed"
          New-Item -ItemType Directory -Force -Path $feed | Out-Null
          dotnet pack ..\runic-desktop\src\Runic.Desktop\Runic.Desktop.csproj -c Release -o $feed
          "RUNIC_VERIFICATION_FEED=$feed" >> $env:GITHUB_ENV

      - name: Verify Effect contract and managed Desktop bridge suites
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          npm run verify
          dotnet run --project tests/Runic.Application.Bridge.Tests -c Release
          dotnet run --project tests/Runic.Application.Desktop.Tests -c Release "-p:RunicVerificationFeed=$env:RUNIC_VERIFICATION_FEED"

      - name: Publish and execute Windows NativeAOT consumer
        shell: pwsh
        run: |
          dotnet publish tests/Runic.Application.Bridge.AotSmoke -c Release -r win-x64 `
            -p:ApplicationBridgeNativeAot=true -o "$env:RUNNER_TEMP\application-bridge-aot"
          & "$env:RUNNER_TEMP\application-bridge-aot\Runic.Application.Bridge.AotSmoke.exe"
