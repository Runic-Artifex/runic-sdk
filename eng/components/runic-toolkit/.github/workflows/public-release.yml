name: Public release

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/public-release.yml
      - .github/actions/setup-bun/action.yml
      - .github/actions/setup-dotnet/action.yml
      - bun.lock
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
      - eng/pack.sh
      - eng/verify-release-candidate.sh
      - eng/checkout-ci-candidates.mjs
      - eng/compatibility-set-value.mjs
      - eng/runic.compatibility-set.json
      - eng/pack-npm.mjs
      - eng/publish-npm.sh
      - eng/verify-package-artifacts.ps1
      - eng/verify-npm-artifacts.mjs
      - src/**/*.csproj
      - templates/**
      - protocol/application-bridge/**
      - tools/**/*.csproj
      - web/packages/**
      - tests/Runic.Application.Bridge.AotSmoke/**
      - tests/RunicToolkit.PackageCanary/**
      - tests/RunicToolkit.TemplateAcceptance/**
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer package version
        required: true
        type: string
      publish_public:
        description: Publish verified NuGet and npm artifacts publicly
        required: true
        default: false
        type: boolean
      npm_bootstrap:
        description: Use the one-time npm bootstrap token for packages not yet created
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type PUBLISH PUBLIC when publication is enabled
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: public-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  package:
    name: Verify public artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve candidate version
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          candidate_version="${REQUESTED_VERSION:-$(node eng/compatibility-set-value.mjs release-train-version)}"
          echo "PACKAGE_VERSION=$candidate_version" >> "$GITHUB_ENV"

      - name: Validate request
        shell: bash
        env:
          PUBLISH_PUBLIC: ${{ inputs.publish_public }}
          NPM_BOOTSTRAP: ${{ inputs.npm_bootstrap }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be SemVer-compatible." >&2
            exit 1
          fi
          if [[ "$PUBLISH_PUBLIC" == "true" && "$CONFIRMATION" != "PUBLISH PUBLIC" ]]; then
            echo "Public publication requires the exact confirmation PUBLISH PUBLIC." >&2
            exit 1
          fi
          if [[ "$NPM_BOOTSTRAP" == "true" && "$PUBLISH_PUBLIC" != "true" ]]; then
            echo "npm bootstrap is meaningful only for public publication." >&2
            exit 1
          fi

      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/setup-bun

      - name: Check out exact compatibility candidates
        env:
          RUNIC_COMPATIBILITY_AUTHORITY_REF: main
        run: node eng/checkout-ci-candidates.mjs

      - name: Install pinned Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: 151.0.7922.77

      - name: Run verification pipeline
        env:
          WEBUI_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: ./eng/verify.sh

      - name: Ensure verification is reproducible
        run: git diff --exit-code

      - name: Verify the complete public release candidate locally
        run: >-
          ./eng/verify-release-candidate.sh
          "$PACKAGE_VERSION" "$RUNNER_TEMP/packages" public

      - name: Record package digests
        working-directory: ${{ runner.temp }}/packages
        run: sha256sum ./*.nupkg ./*.tgz > SHA256SUMS

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: runic-toolkit-${{ env.PACKAGE_VERSION }}
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to nuget.org and npm
    if: ${{ inputs.publish_public && inputs.confirmation == 'PUBLISH PUBLIC' && github.ref == 'refs/heads/main' }}
    needs: package
    runs-on: ubuntu-24.04
    environment: public-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          scope: "@runic-artifex"

      - name: Download release candidate
        uses: actions/download-artifact@v8
        with:
          name: runic-toolkit-${{ env.PACKAGE_VERSION }}
          path: ${{ runner.temp }}/packages

      - name: Verify package digests
        working-directory: ${{ runner.temp }}/packages
        run: sha256sum --check SHA256SUMS

      - name: Preflight npm publication state
        run: ./eng/publish-npm.sh "$PACKAGE_VERSION" "$RUNNER_TEMP/packages" --preflight-only

      - name: Validate npm bootstrap credential
        if: ${{ inputs.npm_bootstrap }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: test -n "$NODE_AUTH_TOKEN"

      - name: Refuse NuGet version reuse on a new dispatch
        shell: bash
        run: |
          set -euo pipefail
          for package in "$RUNNER_TEMP"/packages/*.nupkg; do
            filename="$(basename "$package")"
            package_id="${filename%."$PACKAGE_VERSION".nupkg}"
            if [[ "$package_id" == "$filename" ]]; then
              echo "Cannot derive a package ID from '$filename'." >&2
              exit 1
            fi
            package_id="${package_id,,}"
            url="https://api.nuget.org/v3-flatcontainer/$package_id/$PACKAGE_VERSION/$package_id.$PACKAGE_VERSION.nupkg"
            if curl --fail --silent --show-error --output /dev/null "$url"; then
              if [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]; then
                echo "$package_id $PACKAGE_VERSION already exists on nuget.org; choose a new version." >&2
                exit 1
              fi
              echo "$package_id $PACKAGE_VERSION already exists; retry will skip it."
            fi
          done

      - name: Sign in to nuget.org with trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for package in "$RUNNER_TEMP"/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done

      - name: Bootstrap npm packages
        if: ${{ inputs.npm_bootstrap }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: ./eng/publish-npm.sh "$PACKAGE_VERSION" "$RUNNER_TEMP/packages"

      - name: Publish npm packages with trusted publishing
        if: ${{ !inputs.npm_bootstrap }}
        run: ./eng/publish-npm.sh "$PACKAGE_VERSION" "$RUNNER_TEMP/packages"
