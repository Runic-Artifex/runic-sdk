name: Public release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer package version
        required: true
        default: 0.1.0
        type: string
      publish_public:
        description: Publish the verified npm artifact publicly
        required: true
        default: false
        type: boolean
      npm_bootstrap:
        description: Use the one-time npm bootstrap token
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type PUBLISH PUBLIC when publication is enabled
        required: false
        type: string

permissions:
  contents: read

env:
  PACKAGE_VERSION: ${{ inputs.version || '0.1.0-preview.0' }}

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate request
        env:
          PUBLISH_PUBLIC: ${{ inputs.publish_public }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          if [[ "$PUBLISH_PUBLIC" == "true" && "$CONFIRMATION" != "PUBLISH PUBLIC" ]]; then exit 1; fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Pack public candidate
        run: |
          npm version "$PACKAGE_VERSION" --no-git-tag-version
          npm pack --pack-destination "$RUNNER_TEMP"
      - uses: Runic-Artifex/.github/.github/actions/validate-release-artifacts@main
        with:
          version: ${{ env.PACKAGE_VERSION }}
          artifact-directory: ${{ runner.temp }}
          repository-url: https://github.com/Runic-Artifex/runic-vite
          repository-commit: ${{ github.sha }}
          expected-npm-count: "1"
      - uses: actions/upload-artifact@v7
        with:
          name: runic-vite-${{ env.PACKAGE_VERSION }}
          path: ${{ runner.temp }}/*.tgz

  publish:
    if: ${{ inputs.publish_public && inputs.confirmation == 'PUBLISH PUBLIC' && github.ref == 'refs/heads/main' }}
    needs: package
    runs-on: ubuntu-24.04
    environment: public-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          scope: "@runic-artifex"
      - uses: actions/download-artifact@v8
        with:
          name: runic-vite-${{ env.PACKAGE_VERSION }}
          path: ${{ runner.temp }}/packages
      - name: Publish with bootstrap token
        if: ${{ inputs.npm_bootstrap }}
        run: npm publish "$RUNNER_TEMP"/packages/*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
      - name: Publish with trusted publishing
        if: ${{ !inputs.npm_bootstrap }}
        run: npm publish "$RUNNER_TEMP"/packages/*.tgz --access public

