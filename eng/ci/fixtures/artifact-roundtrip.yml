name: Local artifact protocol contract
on: workflow_dispatch
jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          mkdir -p proof
          printf 'runic-artifact-roundtrip\n' > proof/value.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roundtrip
          path: proof/value.txt
          if-no-files-found: error
          overwrite: true
  download:
    needs: upload
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roundtrip
          path: proof
      - run: test "$(cat proof/value.txt)" = runic-artifact-roundtrip
