ui_count_project_summary = ".input {$languages :integer select=plural}\n.input {$files :integer select=plural}\n.match $languages $files\none one {{One language · one file · compiler validated}}\none * {{One language · {$files} files · compiler validated}}\n* one {{{$languages} languages · one file · compiler validated}}\n* * {{{$languages} languages · {$files} files · compiler validated}}\n"
ui_count_quality_summary = ".input {$findings :integer select=plural}\n.input {$messages :integer select=plural}\n.match $findings $messages\none one {{One finding across one message. CSV columns follow the report order.}}\none * {{One finding across {$messages} messages. CSV columns follow the report order.}}\n* one {{{$findings} findings across one message. CSV columns follow the report order.}}\n* * {{{$findings} findings across {$messages} messages. CSV columns follow the report order.}}\n"
