name: Set up Bun workspace
description: Install the authority-pinned Node and Bun toolchains and restore Bun's download cache.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version-file: .node-version
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.0
    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.0-${{ hashFiles('Frontend/bun.lock', 'tests/HostedBrowserE2E/bun.lock', 'release-authority/runic.compatibility-set.json') }}
        restore-keys: |
          bun-${{ runner.os }}-${{ runner.arch }}-1.4.0-
