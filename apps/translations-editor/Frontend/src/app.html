<!doctype html>
<html lang="en" class="dark" data-theme="runic">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/brand/icon.png" />
    <script>
      (() => {
        try {
          const mode = localStorage.getItem("runic-translations.theme-mode") ?? "dark";
          const palette = localStorage.getItem("runic-translations.theme-palette") ?? "runic";
          const dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.dataset.theme = ["runic", "moss", "fjord", "ember"].includes(palette) ? palette : "runic";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch {}
      })();
    </script>
    <script src="webui.js"></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="off">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
